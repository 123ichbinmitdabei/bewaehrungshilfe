// === PIN-LOCK ===
// Simple hash for PIN - not crypto secure, just to deter casual peeks
function hashPin(pin) {
  let h = 0;
  for (let i = 0; i < pin.length; i++) {
    h = ((h << 5) - h) + pin.charCodeAt(i);
    h |= 0;
  }
  // Add a salt to make it slightly less obvious
  return "bh_" + (h ^ 0xdeadbeef).toString(36);
}
async function setPin(pin) {
  if (!pin || pin.length < 4) {
    alert("PIN muss mindestens 4 Stellen haben.");
    return false;
  }
  await Storage.set(PIN_STORAGE_KEY, hashPin(pin));
  return true;
}
async function checkPin(pin) {
  const stored = await Storage.get(PIN_STORAGE_KEY);
  return stored && stored === hashPin(pin);
}
async function removePin() {
  await Storage.del(PIN_STORAGE_KEY);
  await Storage.del(PIN_RECOVERY_KEY);
}
// Recovery question/answer storage
async function setPinRecovery(question, answer) {
  if (!question || !answer) return false;
  // Normalize answer: lowercase, trim, no spaces
  const normalized = answer.toLowerCase().trim().replace(/\s+/g, "");
  await Storage.set(PIN_RECOVERY_KEY, JSON.stringify({
    question: question,
    answerHash: hashPin(normalized)
  }));
  return true;
}
async function getPinRecoveryQuestion() {
  const raw = await Storage.get(PIN_RECOVERY_KEY);
  if (!raw) return null;
  try {
    const data = JSON.parse(raw);
    return data.question || null;
  } catch(e) { return null; }
}
async function checkPinRecovery(answer) {
  const raw = await Storage.get(PIN_RECOVERY_KEY);
  if (!raw) return false;
  try {
    const data = JSON.parse(raw);
    const normalized = (answer || "").toLowerCase().trim().replace(/\s+/g, "");
    return data.answerHash === hashPin(normalized);
  } catch(e) { return false; }
}
let pinSetupMode = false;
let pinSetupStep = 1; // 1: enter PIN, 2: confirm PIN, 3: enter recovery Q, 4: enter recovery A
let pinSetupTemp = "";
let pinSetupRecoveryQ = "";
let pinRecoveryMode = false; // true when user clicked "PIN vergessen?"

function startPinSetup() {
  pinSetupMode = true;
  pinSetupStep = 1;
  pinSetupTemp = "";
  pinSetupRecoveryQ = "";
  state.pinLocked = true;
  render();
}
async function disablePin() {
  if (!confirm("PIN-Schutz wirklich entfernen?")) return;
  await removePin();
  state.pinLocked = false;
  showSaveToast("PIN-Schutz deaktiviert");
  render();
}
function startPinRecovery() {
  pinRecoveryMode = true;
  render();
}
function cancelPinRecovery() {
  pinRecoveryMode = false;
  render();
}
async function submitPin() {
  const inp = document.getElementById("pin-input");
  if (!inp) return;
  const val = inp.value.trim();

  if (pinRecoveryMode) {
    // Check recovery answer
    const ok = await checkPinRecovery(val);
    if (!ok) {
      inp.classList.add("error");
      setTimeout(() => inp.classList.remove("error"), 400);
      inp.value = "";
      return;
    }
    // Recovery successful - let user set new PIN
    pinRecoveryMode = false;
    pinSetupMode = true;
    pinSetupStep = 1;
    pinSetupTemp = "";
    showSaveToast("Antwort korrekt - bitte neue PIN setzen");
    render();
    return;
  }

  if (pinSetupMode) {
    if (pinSetupStep === 1) {
      if (val.length < 4) {
        inp.classList.add("error");
        setTimeout(() => inp.classList.remove("error"), 400);
        return;
      }
      pinSetupTemp = val;
      pinSetupStep = 2;
      inp.value = "";
      render();
    } else if (pinSetupStep === 2) {
      if (val !== pinSetupTemp) {
        inp.classList.add("error");
        setTimeout(() => inp.classList.remove("error"), 400);
        inp.value = "";
        pinSetupStep = 1;
        pinSetupTemp = "";
        render();
        return;
      }
      // PIN matches - save it
      await setPin(val);
      // Now move to recovery question step
      pinSetupStep = 3;
      pinSetupTemp = val;
      inp.value = "";
      render();
    } else if (pinSetupStep === 3) {
      // val is the recovery question text
      if (val.length < 5) {
        inp.classList.add("error");
        setTimeout(() => inp.classList.remove("error"), 400);
        return;
      }
      pinSetupRecoveryQ = val;
      pinSetupStep = 4;
      inp.value = "";
      render();
    } else if (pinSetupStep === 4) {
      // val is the recovery answer
      if (val.length < 2) {
        inp.classList.add("error");
        setTimeout(() => inp.classList.remove("error"), 400);
        return;
      }
      await setPinRecovery(pinSetupRecoveryQ, val);
      pinSetupMode = false;
      pinSetupStep = 1;
      pinSetupTemp = "";
      pinSetupRecoveryQ = "";
      state.pinLocked = false;
      showSaveToast("PIN und Wiederherstellungs-Frage gesetzt");
      render();
    }
  } else {
    // Normal unlock
    const ok = await checkPin(val);
    if (!ok) {
      inp.classList.add("error");
      setTimeout(() => inp.classList.remove("error"), 400);
      inp.value = "";
      return;
    }
    state.pinLocked = false;
    render();
  }
}

  pinSetupMode = false;
  pinSetupStep = 1;
  pinSetupTemp = "";

// === CALENDAR EXPORT (.ics) ===
function pad(n) { return String(n).padStart(2, "0"); }
function toIcsDate(date, hour, minute) {
  const yyyy = date.getFullYear();
  const mm = pad(date.getMonth() + 1);
  const dd = pad(date.getDate());
  const h = hour !== undefined ? pad(hour) : "12";
  const m = minute !== undefined ? pad(minute) : "00";
  return `${yyyy}${mm}${dd}T${h}${m}00`;
}
function escapeIcs(s) {
  return String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}
function downloadIcs(filename, content) {
  const blob = new Blob([content], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showSaveToast("Kalender-Datei erstellt");
}
function exportNextBhTerminToCalendar() {
  const datum = state.docs.bhtermine?.answers?.["naechster.datum"];
  const uhrzeit = state.docs.bhtermine?.answers?.["naechster.uhrzeit"] || "10:00";
  const ort = state.docs.bhtermine?.answers?.["naechster.ort"] || "";
  const vorbereitung = state.docs.bhtermine?.answers?.["naechster.vorbereitung"] || "";
  if (!datum) { alert("Kein nächster Termin eingetragen."); return; }
  const date = parseDateGuess(datum);
  if (!date) { alert("Datumsformat nicht erkannt."); return; }
  const tm = uhrzeit.match(/^(\d{1,2}):(\d{2})$/);
  const h = tm ? parseInt(tm[1]) : 10;
  const m = tm ? parseInt(tm[2]) : 0;
  const endH = h + 1, endM = m;
  const uid = "bh-termin-" + date.getTime() + "@bewaehrungshilfe-app";
  const dtstamp = toIcsDate(new Date());
  const dtstart = toIcsDate(date, h, m);
  const dtend = toIcsDate(date, endH, endM);
  const bh = state.shared.bewaehrungshelfer || "Bewährungshelfer/in";
  const summary = `Termin bei ${bh}`;
  const description = vorbereitung ? `Was besprechen:\n${vorbereitung}` : "";
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bewährungshilfe-Assistent//DE",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    `UID:${uid}`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART:${dtstart}`,
    `DTEND:${dtend}`,
    `SUMMARY:${escapeIcs(summary)}`,
    description ? `DESCRIPTION:${escapeIcs(description)}` : "",
    ort ? `LOCATION:${escapeIcs(ort)}` : "",
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    `DESCRIPTION:${escapeIcs(summary)}`,
    "TRIGGER:-PT1H",
    "END:VALARM",
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    `DESCRIPTION:${escapeIcs(summary)}`,
    "TRIGGER:-P1D",
    "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"
  ].filter(l => l).join("\r\n");
  downloadIcs(`BH-Termin_${pad(date.getDate())}.${pad(date.getMonth()+1)}.${date.getFullYear()}.ics`, ics);
}

// === GENERIC: Build a single VEVENT block from a row ===
// Used both for per-row export and for bulk export.
// Returns a string like "BEGIN:VEVENT\r\n...END:VEVENT" or null if no valid date.
function buildIcsEvent(opts) {
  // opts: { date, hour, minute, durationMinutes, summary, description, location, uid }
  if (!opts.date) return null;
  const dtstamp = toIcsDate(new Date());
  const dtstart = toIcsDate(opts.date, opts.hour ?? 12, opts.minute ?? 0);
  const endDate = new Date(opts.date);
  endDate.setMinutes(endDate.getMinutes() + (opts.durationMinutes || 60));
  // For end time, if start hour was given:
  let endH = (opts.hour ?? 12) + Math.floor(((opts.minute ?? 0) + (opts.durationMinutes || 60)) / 60);
  let endM = ((opts.minute ?? 0) + (opts.durationMinutes || 60)) % 60;
  if (endH >= 24) endH = 23, endM = 59;
  const dtend = toIcsDate(opts.date, endH, endM);
  const lines = [
    "BEGIN:VEVENT",
    `UID:${opts.uid}`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART:${dtstart}`,
    `DTEND:${dtend}`,
    `SUMMARY:${escapeIcs(opts.summary)}`,
    opts.description ? `DESCRIPTION:${escapeIcs(opts.description)}` : "",
    opts.location ? `LOCATION:${escapeIcs(opts.location)}` : "",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${escapeIcs(opts.summary)}`, "TRIGGER:-PT1H", "END:VALARM",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${escapeIcs(opts.summary)}`, "TRIGGER:-P1D", "END:VALARM",
    "END:VEVENT"
  ].filter(Boolean);
  return lines.join("\r\n");
}

// Parse "HH:MM" or "HH" into [hour, minute]
function parseTimeStr(s) {
  if (!s) return [null, null];
  const m = String(s).match(/^(\d{1,2})[:.]?(\d{0,2})$/);
  if (!m) return [null, null];
  const h = parseInt(m[1]); const mi = parseInt(m[2] || "0");
  if (isNaN(h) || h > 23 || isNaN(mi) || mi > 59) return [null, null];
  return [h, mi];
}

// Build VEVENT for a row in any tabel - returns null if no date
function buildEventFromRow(docId, sectionId, rowIdx, row) {
  const date = parseDateGuess(row.datum);
  if (!date) return null;
  const [h, mi] = parseTimeStr(row.uhrzeit || row.von || "");
  let durationMin = 60;
  // Sozialstunden: try to infer from von/bis
  if (sectionId === "stunden" && row.von && row.bis) {
    const [vH, vM] = parseTimeStr(row.von);
    const [bH, bM] = parseTimeStr(row.bis);
    if (vH !== null && bH !== null) {
      const total = (bH * 60 + bM) - (vH * 60 + vM);
      if (total > 0) durationMin = total;
    }
  }
  // Therapy: use dauer field if present
  if (sectionId === "termine" && docId === "thera" && row.dauer) {
    const dm = String(row.dauer).match(/(\d+)/);
    if (dm) durationMin = parseInt(dm[1]);
  }
  // Build summary based on doc type
  let summary = "";
  let description = "";
  let location = "";
  if (docId === "thera") {
    summary = "Therapie-Termin";
    if (row.art) summary += ` (${row.art})`;
    if (row.notiz) description = row.notiz;
  } else if (docId === "sozial") {
    summary = "Sozialstunden-Einsatz";
    if (row.taetigkeit) summary += ": " + row.taetigkeit;
    const einrichtung = state.docs.sozial?.answers?.["einrichtung.name"] || "";
    if (einrichtung) location = einrichtung;
    if (row.notiz) description = row.notiz;
  } else if (docId === "bhtermine") {
    const bh = state.shared.bewaehrungshelfer || "Bewährungshelfer/in";
    summary = `Termin bei ${bh}`;
    if (row.art) summary += ` (${row.art})`;
    description = [row.themen, row.vereinbarungen, row.notiz].filter(Boolean).join("\n\n");
  } else if (docId === "schadens") {
    summary = "Schadens-Zahlung fällig";
    if (row.bemerkung) description = row.bemerkung;
  } else if (docId === "kosten") {
    summary = "Verfahrenskosten-Zahlung fällig";
    if (row.bemerkung) description = row.bemerkung;
  } else {
    summary = DOCS[docId]?.title || "Termin";
  }
  const uid = `${docId}-${sectionId}-${rowIdx}-${date.getTime()}@bewaehrungshilfe-app`;
  return buildIcsEvent({
    date, hour: h, minute: mi,
    durationMinutes: durationMin,
    summary, description, location, uid
  });
}

// Export a single row to .ics
function exportRowToCalendar(docId, sectionId, rowIdx) {
  const row = state.docs[docId]?.rows?.[sectionId]?.[rowIdx];
  if (!row || !row.datum) { alert("Dieser Eintrag hat kein Datum, das exportiert werden kann."); return; }
  const event = buildEventFromRow(docId, sectionId, rowIdx, row);
  if (!event) { alert("Eintrag konnte nicht in ein Kalenderereignis umgewandelt werden."); return; }
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bewährungshilfe-Assistent//DE",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    event,
    "END:VCALENDAR"
  ].join("\r\n");
  const date = parseDateGuess(row.datum);
  const fname = `${docId}-Termin_${pad(date.getDate())}.${pad(date.getMonth()+1)}.${date.getFullYear()}.ics`;
  downloadIcs(fname, ics);
}

// Export all upcoming appointments of a doc as one .ics
function exportAllToCalendar(docId, sectionId) {
  const rows = state.docs[docId]?.rows?.[sectionId] || [];
  const today = new Date(); today.setHours(0,0,0,0);
  const events = [];
  rows.forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    if (!d) return;
    // Only export future + today
    if (d < today) return;
    // Skip clearly cancelled / missed (keine "toten" Termine im Kalender)
    if (row.status && /abgesagt|verpasst|verschoben/i.test(row.status)) return;
    const ev = buildEventFromRow(docId, sectionId, idx, row);
    if (ev) events.push(ev);
  });
  if (events.length === 0) { alert("Keine zukünftigen Termine zum Exportieren gefunden.\n\nNur Termine mit Datum heute oder später (und Status nicht „abgesagt/verpasst/verschoben“) werden exportiert."); return; }
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bewährungshilfe-Assistent//DE",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    ...events,
    "END:VCALENDAR"
  ].join("\r\n");
  const fname = `${docId}-Termine_${events.length}.ics`;
  downloadIcs(fname, ics);
  showSaveToast(`✓ ${events.length} Termin(e) exportiert`);
}

// Aggregierter ICS-Export: ALLE Termine aus ALLEN Docs in einer .ics-Datei.
// Quellen: BH-Termine, Sozialstunden-Einsätze, Therapie-Termine, kommende
// Bewährungs-Stichtage. Verlangt keine Args — durchläuft alle bekannten Docs.
function exportAllTermineToCalendar() {
  const today = new Date(); today.setHours(0,0,0,0);
  const events = [];
  // BH-Termine
  (state.docs.bhtermine?.rows?.termine || []).forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    if (!d || d < today) return;
    if (row.status && /abgesagt|verpasst|verschoben/i.test(row.status)) return;
    const ev = buildEventFromRow("bhtermine", "termine", idx, row);
    if (ev) events.push(ev);
  });
  // Therapie-Termine
  (state.docs.thera?.rows?.termine || []).forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    if (!d || d < today) return;
    if (row.status && /abgesagt|verpasst|ausgefallen/i.test(row.status)) return;
    const ev = buildEventFromRow("thera", "termine", idx, row);
    if (ev) events.push(ev);
  });
  // Sozialstunden-Einsätze
  (state.docs.sozial?.rows?.eintraege || []).forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    if (!d || d < today) return;
    const ev = buildEventFromRow("sozial", "eintraege", idx, row);
    if (ev) events.push(ev);
  });
  // Nächster geplanter BH-Termin (aus answers, falls noch nicht in Tabelle)
  const nDatum = state.docs.bhtermine?.answers?.["naechster.datum"];
  if (nDatum) {
    const d = parseDateGuess(nDatum);
    if (d && d >= today) {
      const [h, mi] = parseTimeStr(state.docs.bhtermine.answers["naechster.uhrzeit"] || "10:00");
      const ev = buildIcsEvent({
        date: d, hour: h ?? 10, minute: mi ?? 0, durationMinutes: 60,
        summary: "BH-Termin (nächster)",
        description: state.docs.bhtermine.answers["naechster.vorbereitung"] || "",
        location: state.docs.bhtermine.answers["naechster.ort"] || "",
        uid: "bh-naechster-" + d.getTime() + "@bewaehrungshilfe-app",
      });
      if (ev) events.push(ev);
    }
  }
  // Bewährungs-Stichtage als Ganztags-Events
  const bewEnde = state.shared?.bewaehrung_ende;
  if (bewEnde) {
    const d = parseDateGuess(bewEnde);
    if (d && d >= today) {
      events.push(buildIcsEvent({
        date: d, hour: 12, minute: 0, durationMinutes: 60,
        summary: "📅 Ende der Bewährungszeit",
        description: "Aktenzeichen: " + (state.shared?.aktenzeichen || "—"),
        uid: "bew-ende-" + d.getTime() + "@bewaehrungshilfe-app",
      }));
    }
  }
  // Zahlungsfristen aus Verfahrenskosten
  const kAns = state.docs.kosten?.answers || {};
  ["geldstrafe.frist_zahlung", "gerichtskosten.frist_zahlung"].forEach(key => {
    const v = kAns[key];
    if (!v) return;
    const d = parseDateGuess(v);
    if (!d || d < today) return;
    const label = key.startsWith("geldstrafe") ? "Geldstrafe-Frist" : "Gerichtskosten-Frist";
    events.push(buildIcsEvent({
      date: d, hour: 12, minute: 0, durationMinutes: 60,
      summary: "💸 " + label,
      description: "Kassenzeichen: " + (kAns["verfahren.az_landesjustizkasse"] || "—"),
      uid: "kosten-" + key + "-" + d.getTime() + "@bewaehrungshilfe-app",
    }));
  });

  if (events.length === 0) {
    alert("Keine zukünftigen Termine zum Exportieren gefunden.\n\nHinweis: Nur Termine mit Datum heute oder später werden mitgenommen, und abgesagte/verpasste werden übersprungen.");
    return;
  }
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bewährungshilfe-Assistent//DE",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "X-WR-CALNAME:Bewährungshilfe-Assistent — Termine",
    ...events,
    "END:VCALENDAR"
  ].filter(Boolean).join("\r\n");
  const userName = (state.shared?.name || "").replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");
  const stamp = todayISO();
  downloadIcs(`Alle-Termine${userName ? "_" + userName : ""}_${stamp}.ics`, ics);
  showSaveToast(`✓ ${events.length} Termin(e) als ICS exportiert`);
}

function closeRescheduleDialog() {
  const m = document.getElementById("reschedule-modal");
  if (m) m.remove();
  window._rescheduleCallback = null;
}

function submitRescheduleDialog() {
  const dateEl = document.getElementById("resched-date");
  const timeEl = document.getElementById("resched-time");
  const newDate = dateEl ? autoFormatDate(dateEl.value.trim()) : "";
  const newTime = timeEl ? autoFormatTime(timeEl.value.trim()) : "";
  if (!newDate) { alert("Bitte ein Datum eintragen."); dateEl?.focus(); return; }
  // Validate date
  if (!parseDateGuess(newDate)) { alert("Datumsformat nicht erkannt. Bitte als TT.MM.JJJJ eingeben."); dateEl?.focus(); return; }
  let mode = window._rescheduleMode || "create_new";
  if (mode === "choose") {
    const radio = document.querySelector('input[name="resched-mode"]:checked');
    mode = radio ? radio.value : "create_new";
  }
  const cb = window._rescheduleCallback;
  closeRescheduleDialog();
  if (typeof cb === "function") cb({ newDate, newTime, mode });
}

// Apply a reschedule action to the underlying state
function applyReschedule(docId, sectionId, rowIdx, originalStatus, opts) {
  // opts: { newDate, newTime, mode }
  const ds = state.docs[docId];
  if (!ds || !ds.rows || !ds.rows[sectionId]) return;
  const rows = ds.rows[sectionId];
  const oldRow = rows[rowIdx];
  if (!oldRow) return;

  if (opts.mode === "update_existing") {
    // Overwrite the existing row's date and time
    oldRow.datum = opts.newDate;
    if (opts.newTime) {
      // Use 'uhrzeit' for thera/bhtermine, 'von' for sozial
      if (sectionId === "stunden") oldRow.von = opts.newTime;
      else oldRow.uhrzeit = opts.newTime;
    }
    // Don't set status (since this is now the active appointment again)
    delete oldRow.status;
  } else {
    // create_new: mark old row with old status, create a new row
    oldRow.status = originalStatus;
    // Create a new row as a fresh appointment
    const newRow = { datum: opts.newDate };
    if (opts.newTime) {
      if (sectionId === "stunden") newRow.von = opts.newTime;
      else newRow.uhrzeit = opts.newTime;
    }
    // Inherit certain fields where useful
    if (oldRow.art) newRow.art = oldRow.art;
    if (sectionId === "stunden" && oldRow.taetigkeit) newRow.taetigkeit = oldRow.taetigkeit;
    if (sectionId === "stunden" && oldRow.bis) newRow.bis = oldRow.bis;
    if (sectionId === "stunden" && oldRow.pause) newRow.pause = oldRow.pause;
    rows.push(newRow);
  }
  saveAndRefresh(docId);
}

// === SEARCH FILTER ===
function setRowSearch(secId, value) {
  const key = `${state.activeDocId}.${secId}`;
  if (value) state.rowSearch[key] = value;
  else delete state.rowSearch[key];
}
function getRowSearch(secId) {
  return state.rowSearch[`${state.activeDocId}.${secId}`] || "";
}
function rowMatchesSearch(row, term) {
  if (!term) return true;
  const lower = term.toLowerCase();
  return Object.values(row).some(v => String(v || "").toLowerCase().includes(lower));
}

// === LANGUAGE TOGGLE FOR PRINT (removed v3.6 - only DE actually used) ===

// Live filter rows without re-render (preserves input focus)
function applySearchFilter(secId, term) {
  const rows = (state.docs[state.activeDocId]?.rows?.[secId]) || [];
  const lower = (term || "").toLowerCase();
  document.querySelectorAll(`[data-rowkey^="${secId}|"]`).forEach(el => {
    const idx = parseInt(el.dataset.rowkey.split("|")[1]);
    const card = el.closest(".row-card");
    if (!card) return;
    const row = rows[idx] || {};
    const matches = !lower || Object.values(row).some(v => String(v || "").toLowerCase().includes(lower));
    if (matches) card.classList.remove("search-hidden");
    else card.classList.add("search-hidden");
  });
}
function updateSearchInfo(secId) {
  const term = getRowSearch(secId);
  const rows = (state.docs[state.activeDocId]?.rows?.[secId]) || [];
  const matchCount = rows.filter(r => rowMatchesSearch(r, term)).length;
  const info = document.getElementById(`search-info-${secId}`);
  if (info && term) info.textContent = `${matchCount} von ${rows.length} Einträgen passen`;
}

// Lazy-load JSZip from CDN, only when bundling is requested
let jszipLoading = null;
function loadJSZipLib() {
  if (window.JSZip) return Promise.resolve();
  if (jszipLoading) return jszipLoading;
  const sources = [
    "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js",
    "https://unpkg.com/jszip@3.10.1/dist/jszip.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
  ];
  jszipLoading = new Promise((resolve, reject) => {
    let idx = 0;
    function tryNext() {
      if (idx >= sources.length) {
        reject(new Error("Konnte die ZIP-Bibliothek nicht laden. Bitte Internetverbindung prüfen. Tipp: Du kannst stattdessen „🖨 Drucken / als PDF\" nutzen - das funktioniert auch ohne Internet."));
        return;
      }
      const url = sources[idx++];
      const s = document.createElement("script");
      s.src = url;
      s.onload = () => {
        if (window.JSZip) resolve();
        else tryNext();
      };
      s.onerror = () => tryNext();
      document.head.appendChild(s);
    }
    tryNext();
  });
  return jszipLoading;
}

// === PDF.js LAZY-LOAD + RENDER ===
// Used to embed PDF attachments as page-images in the print/PDF output.
// pdf.js v3.11.x is the last UMD release (v4+ is ESM-only and harder to use
// from a single-file HTML). Sources are kept in sync to avoid version drift.
// ── Tesseract.js OCR-Loader (lazy, opt-in) ────────────────────────────────
// Tesseract.js wird nur geladen, wenn der User explizit OCR auf einem Bild
// oder gescanntem PDF startet. Library ist ~1 MB, plus ~15 MB für das deutsche
// Sprachmodell (vom CDN, browser-gecached). Erste OCR-Operation ist langsam
// (~30s Download), folgende sind schnell (~5–15s pro Seite).
const TESSERACT_VERSION = "5.0.5";
let tesseractLoading = null;
function loadTesseractLib() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoading) return tesseractLoading;
  const sources = [
    "https://cdn.jsdelivr.net/npm/tesseract.js@" + TESSERACT_VERSION + "/dist/tesseract.min.js",
    "https://unpkg.com/tesseract.js@" + TESSERACT_VERSION + "/dist/tesseract.min.js",
  ];
  tesseractLoading = new Promise((resolve, reject) => {
    let idx = 0;
    function tryNext() {
      if (idx >= sources.length) {
        reject(new Error("Konnte die OCR-Bibliothek (Tesseract.js) nicht laden. Bitte Internetverbindung prüfen."));
        return;
      }
      const s = document.createElement("script");
      s.src = sources[idx++];
      s.onload = () => {
        if (window.Tesseract) resolve();
        else tryNext();
      };
      s.onerror = () => tryNext();
      document.head.appendChild(s);
    }
    tryNext();
  });
  return tesseractLoading;
}

// OCR auf eine einzelne Bild-DataUrl. onProgress(pct) wird beim Fortschritt
// aufgerufen (0..100). Sprache: 'deu' (Deutsch).
async function ocrImageDataUrl(dataUrl, onProgress) {
  await loadTesseractLib();
  const result = await window.Tesseract.recognize(dataUrl, "deu", {
    logger: m => {
      if (onProgress && m.status === "recognizing text" && typeof m.progress === "number") {
        onProgress(Math.round(m.progress * 100));
      }
    },
  });
  return (result && result.data && result.data.text) || "";
}

// OCR auf alle Seiten eines PDF-Anhangs (für gescannte PDFs ohne Textebene).
// Jede Seite wird zunächst zu einem JPEG gerendert (PDF.js), dann via Tesseract
// ausgelesen. Bei Mehrseitigem PDF wird pro Seite gemeldet.
async function ocrPdfAttachment(att, onProgress) {
  const pages = await renderPdfAttachmentToPageImages(att, { scale: 2.0, quality: 0.92 });
  if (pages.length === 0) return "";
  let all = "";
  for (let i = 0; i < pages.length; i++) {
    if (onProgress) onProgress({ page: i + 1, total: pages.length, pct: 0 });
    const t = await ocrImageDataUrl(pages[i].dataUrl, pct => {
      if (onProgress) onProgress({ page: i + 1, total: pages.length, pct });
    });
    all += t + "\n";
  }
  return all;
}

const PDFJS_VERSION = "3.11.174";
let pdfjsLoading = null;
function loadPdfJsLib() {
  if (window.pdfjsLib) return Promise.resolve();
  if (pdfjsLoading) return pdfjsLoading;
  const baseSources = [
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@" + PDFJS_VERSION + "/build/",
    "https://unpkg.com/pdfjs-dist@" + PDFJS_VERSION + "/build/",
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/",
  ];
  pdfjsLoading = new Promise((resolve, reject) => {
    let idx = 0;
    function tryNext() {
      if (idx >= baseSources.length) {
        reject(new Error("Konnte die PDF-Bibliothek nicht laden. Bitte Internetverbindung prüfen."));
        return;
      }
      const base = baseSources[idx++];
      const s = document.createElement("script");
      s.src = base + "pdf.min.js";
      s.onload = () => {
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
          resolve();
        } else tryNext();
      };
      s.onerror = () => tryNext();
      document.head.appendChild(s);
    }
    tryNext();
  });
  return pdfjsLoading;
}

// Convert a base64 data URL to a Uint8Array (synchronous, no fetch)
function dataUrlToUint8Array(dataUrl) {
  const i = dataUrl.indexOf(",");
  if (i < 0) return new Uint8Array(0);
  const b64 = dataUrl.slice(i + 1);
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let j = 0; j < bin.length; j++) arr[j] = bin.charCodeAt(j);
  return arr;
}

// Render a single PDF attachment to an array of {dataUrl, pageNum, pageCount}.
// scale ~1.5 produces ~1500px-wide pages for A4, which prints well at 72-150dpi
// while keeping file sizes reasonable. JPEG q=0.78 is a good clarity/size trade.
async function renderPdfAttachmentToPageImages(att, opts) {
  opts = opts || {};
  const scale = opts.scale || 1.5;
  const quality = opts.quality || 0.78;
  await loadPdfJsLib();
  const data = dataUrlToUint8Array(att.dataUrl);
  // pdf.js mutates the input buffer when transferring to the worker. Pass a copy
  // so the original attachment data is not destroyed.
  const pdf = await window.pdfjsLib.getDocument({ data: data.slice(0) }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    const ctx = canvas.getContext("2d");
    // White background underneath in case the PDF page has transparency
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    out.push({
      dataUrl: canvas.toDataURL("image/jpeg", quality),
      pageNum: p,
      pageCount: pdf.numPages,
    });
    // Help the GC by clearing the canvas
    canvas.width = 1; canvas.height = 1;
  }
  return out;
}

// Walk the print-view DOM, find every <div class="pdf-pending"> placeholder and
// replace it with one .attachment-page <div> per PDF page. Each placeholder
// carries data-pdf-ref="<docId>|<secId>|<rowIdx>|<attIdx>" so we can resolve
// the attachment via getAttachments() without baking the dataUrl into HTML.
// onProgress(done, total) is called after each placeholder. Returns true on
// success, false if PDF.js failed to load (caller falls back to placeholders).
async function inlinePdfPlaceholders(rootEl, onProgress) {
  const placeholders = Array.from(rootEl.querySelectorAll(".pdf-pending"));
  if (placeholders.length === 0) return true;
  try {
    await loadPdfJsLib();
  } catch (err) {
    // No connection / blocked — leave placeholders as visible PDF-Hinweise
    placeholders.forEach(ph => {
      ph.classList.remove("pdf-pending");
      ph.classList.add("attachment-page");
      const note = document.createElement("div");
      note.className = "attachment-pdf-note";
      note.innerHTML = "📄 PDF-Beleg konnte nicht eingebettet werden (keine Internet-Verbindung). Das PDF liegt separat in der Datensicherung.";
      ph.insertBefore(note, ph.firstChild);
    });
    return false;
  }
  let done = 0;
  for (const ph of placeholders) {
    const ref = ph.getAttribute("data-pdf-ref") || "";
    const [docId, secId, rowIdxStr, attIdxStr] = ref.split("|");
    const rowIdx = parseInt(rowIdxStr, 10);
    const attIdx = parseInt(attIdxStr, 10);
    const ds = state.docs[docId];
    const atts = (ds && ds.attachments && ds.attachments[secId] && ds.attachments[secId][rowIdx]) || [];
    const att = atts[attIdx];
    const caption = ph.getAttribute("data-caption") || "";
    const captionHtml = caption ? `<div class="attachment-caption">${esc(caption)}</div>` : "";
    let replacementHtml = "";
    if (!att || att.type !== "pdf") {
      replacementHtml = `<div class="attachment-page"><div class="attachment-pdf-note">📄 Beleg nicht mehr verfügbar.</div>${captionHtml}</div>`;
    } else {
      try {
        const pages = await renderPdfAttachmentToPageImages(att);
        pages.forEach((pg, i) => {
          const pageCaption = pg.pageCount > 1
            ? `${caption}${caption ? " · " : ""}Seite ${pg.pageNum} / ${pg.pageCount}`
            : caption;
          const pCapHtml = pageCaption ? `<div class="attachment-caption">${esc(pageCaption)}</div>` : "";
          replacementHtml += `<div class="attachment-page"><img src="${pg.dataUrl}" alt="${esc(att.name)} Seite ${pg.pageNum}" />${pCapHtml}</div>`;
        });
      } catch (err) {
        replacementHtml = `<div class="attachment-page"><div class="attachment-pdf-note">📄 PDF-Beleg <strong>${esc(att.name)}</strong> konnte nicht gerendert werden (${esc(err.message || "Fehler")}). Das PDF liegt separat in der Datensicherung.</div>${captionHtml}</div>`;
      }
    }
    const wrapper = document.createElement("div");
    wrapper.innerHTML = replacementHtml;
    const parent = ph.parentNode;
    while (wrapper.firstChild) parent.insertBefore(wrapper.firstChild, ph);
    parent.removeChild(ph);
    done += 1;
    if (typeof onProgress === "function") onProgress(done, placeholders.length);
  }
  return true;
}

// Collect all attachments for a doc as Blobs with structured filenames
async function collectDocAttachments(docId) {
  const ds = state.docs[docId];
  const result = []; // { folder, filename, blob }
  if (!ds || !ds.attachments) return result;
  const doc = DOCS[docId];
  for (const secId of Object.keys(ds.attachments)) {
    const sec = doc.sections.find(s => s.id === secId);
    const secLabel = sec ? sec.title : secId;
    const map = ds.attachments[secId];
    for (const rowIdxStr of Object.keys(map)) {
      const rowIdx = parseInt(rowIdxStr);
      const atts = map[rowIdxStr] || [];
      const row = (ds.rows && ds.rows[secId] && ds.rows[secId][rowIdx]) || {};
      // Build a row label - try common id labels
      const rowParts = [];
      if (row.datum) rowParts.push(row.datum);
      if (row.bezeichnung) rowParts.push(row.bezeichnung.substring(0, 30));
      if (row.art) rowParts.push(row.art);
      if (row.betrag) rowParts.push(row.betrag + "EUR");
      const rowLabel = rowParts.length > 0 ? rowParts.join("_") : `Zeile-${rowIdx + 1}`;
      const safeRowLabel = rowLabel.replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_").substring(0, 60);
      for (let i = 0; i < atts.length; i++) {
        const att = atts[i];
        try {
          const resp = await fetch(att.dataUrl);
          const blob = await resp.blob();
          const ext = att.name.includes(".") ? att.name.split(".").pop() : (att.type === "pdf" ? "pdf" : "jpg");
          const filename = `${String(i + 1).padStart(2, "0")}_${safeRowLabel}.${ext}`;
          result.push({
            folder: secLabel.replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_"),
            filename: filename,
            blob: blob,
            originalName: att.name,
          });
        } catch (e) {
          console.error("Fehler beim Lesen von Beleg:", att.name, e);
        }
      }
    }
  }
  return result;
}

// Build the docx for a doc (returns blob), or null if not supported
async function buildDocBlob(docId) {
  await loadDocxLib();
  if (docId === "ear") return await buildEarDocx();
  if (docId === "zeit") return await buildZeitDocx();
  if (docId === "thera") return await buildTheraDocx();
  if (docId === "schadens") return await buildSchadensDocx();
  if (docId === "sozial") return await buildSozialDocx();
  if (docId === "asservate") return await buildAsservateDocx();
  if (docId === "kosten") return await buildKostenDocx();
  if (docId === "bhtermine") return await buildBhtermineDocx();
  return null; // uebersicht: kein docx, nur Druck
}

// Build a ZIP containing the doc + all attachments
async function buildDocBundleZip(docId) {
  await loadJSZipLib();
  const doc = DOCS[docId];
  const userName = (state.shared.name || "").replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");
  const docTitle = doc.title.replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");
  const baseName = userName ? `${docTitle}_${userName}` : docTitle;

  const zip = new JSZip();

  // 1) Docx of main document (if available)
  const docBlob = await buildDocBlob(docId);
  if (docBlob) {
    zip.file(`${baseName}.docx`, docBlob);
  } else {
    // For docs without docx (kosten, asservate): include a Readme as text
    const note = `Hauptdokument "${doc.title}"\n\nFür dieses Dokument gibt es keinen Word-Export. Bitte nutze die Druck-Funktion in der App und speichere das Ergebnis als PDF, dann lege es in diesen Ordner.`;
    zip.file(`${baseName}_HINWEIS.txt`, note);
  }

  // 2) Attachments
  const atts = await collectDocAttachments(docId);
  if (atts.length > 0) {
    const folder = zip.folder("Belege");
    // Group by section
    const folderMap = {};
    atts.forEach(a => {
      if (!folderMap[a.folder]) folderMap[a.folder] = folder.folder(a.folder);
      folderMap[a.folder].file(a.filename, a.blob);
    });
    // Add an index file
    let index = `Belege-Übersicht für: ${doc.title}\n`;
    if (state.shared.name) index += `Name: ${state.shared.name}\n`;
    if (state.shared.aktenzeichen) index += `Aktenzeichen: ${state.shared.aktenzeichen}\n`;
    index += `Erstellt: ${todayDE()}\n\n`;
    index += `Anzahl Belege: ${atts.length}\n\n`;
    index += atts.map((a, i) => `${i + 1}. ${a.folder}/${a.filename}  (Original: ${a.originalName})`).join("\n");
    folder.file("00_Inhaltsverzeichnis.txt", index);
  }

  return await zip.generateAsync({ type: "blob" });
}

// Switch between draw and upload modes
function switchSigMode(mode) {
  const drawTab = document.getElementById("sig-tab-draw");
  const uploadTab = document.getElementById("sig-tab-upload");
  const drawPane = document.getElementById("sig-mode-draw");
  const uploadPane = document.getElementById("sig-mode-upload");

    drawTab.classList.remove("active");

    uploadTab.classList.remove("active");

    uploadPane.style.display = "none";
  }
}

// Handle an uploaded signature image file
function handleSignatureUpload(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    alert("Bitte eine Bilddatei auswählen (PNG oder JPG).");
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      // Normalize to the standard signature size, trim whitespace
      const normalized = normalizeSignatureImage(img);
      window._sigUploadedDataUrl = normalized;
      // Show preview
      const previewImg = document.getElementById("sig-upload-img");
      const emptyBox = document.getElementById("sig-upload-empty");
      const previewBox = document.getElementById("sig-upload-preview");
      const saveBtn = document.getElementById("sig-upload-save-btn");
      if (previewImg) previewImg.src = normalized;
      if (emptyBox) emptyBox.style.display = "none";
      if (previewBox) previewBox.style.display = "";
      if (saveBtn) saveBtn.disabled = false;
    };
    img.onerror = () => alert("Das Bild konnte nicht geladen werden. Bitte ein anderes versuchen.");
    img.src = e.target.result;
  };
  reader.onerror = () => alert("Datei konnte nicht gelesen werden.");
  reader.readAsDataURL(file);
}

// Normalize an uploaded signature image: fit to standard size on white background
function normalizeSignatureImage(img) {
  const TARGET_W = 400;
  const TARGET_H = 133;
  const tmp = document.createElement("canvas");
  tmp.width = TARGET_W;
  tmp.height = TARGET_H;
  const ctx = tmp.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, TARGET_W, TARGET_H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  // Fit image preserving aspect ratio (contain)
  const scale = Math.min(TARGET_W / img.width, TARGET_H / img.height);
  const drawW = img.width * scale;
  const drawH = img.height * scale;
  const offX = (TARGET_W - drawW) / 2;
  const offY = (TARGET_H - drawH) / 2;
  ctx.drawImage(img, offX, offY, drawW, drawH);
  return tmp.toDataURL("image/jpeg", 0.85);
}

// Save the uploaded signature
function saveUploadedSignature() {
  const dataUrl = window._sigUploadedDataUrl;
  if (!dataUrl) {
    alert("Bitte zuerst ein Bild auswählen.");
    return;
  }

function setupSignatureCanvas() {
  const canvas = document.getElementById("sig-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  // High-DPI support
  const dpr = window.devicePixelRatio || 1;
  if (dpr > 1) {
    canvas.width = SIG_CANVAS_W * dpr;
    canvas.height = SIG_CANVAS_H * dpr;
    canvas.style.width = SIG_CANVAS_W + "px";
    canvas.style.height = SIG_CANVAS_H + "px";
    ctx.scale(dpr, dpr);
  }
  ctx.lineWidth = 2.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#1e293b";

  let drawing = false;
  let hasInk = false;
  let lastX = 0, lastY = 0;

  function getXY(e) {
    const rect = canvas.getBoundingClientRect();
    let cx, cy;
    if (e.touches && e.touches[0]) {
      cx = e.touches[0].clientX; cy = e.touches[0].clientY;
    } else {
      cx = e.clientX; cy = e.clientY;
    }
    return { x: cx - rect.left, y: cy - rect.top };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    const p = getXY(e);
    lastX = p.x; lastY = p.y;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    // Hide hint on first stroke
    if (!hasInk) {
      hasInk = true;
      const hint = document.querySelector(".sig-canvas-hint");
      if (hint) hint.style.display = "none";
    }
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = getXY(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  }
  function end(e) {
    if (!drawing) return;
    e.preventDefault();
    drawing = false;
  }

  // Mouse
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  // Touch
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end, { passive: false });
  canvas.addEventListener("touchcancel", end, { passive: false });

  window._sigHasInk = () => hasInk;
}

function clearSignaturePad() {
  const canvas = document.getElementById("sig-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const hint = document.querySelector(".sig-canvas-hint");
  if (hint) hint.style.display = "";
  window._sigHasInk = () => false;
}

function cancelSignaturePad() {
  const m = document.getElementById("sig-modal");
  if (m) m.remove();
  window._sigCallback = null;
}

function saveSignaturePad() {
  const canvas = document.getElementById("sig-canvas");
  if (!canvas) return;
  if (!window._sigHasInk || !window._sigHasInk()) {
    alert("Bitte zuerst unterschreiben.");
    return;
  }
  let signerName = "";
  if (window._sigAskName) {
    const inp = document.getElementById("sig-name-input");
    signerName = inp ? inp.value.trim() : "";
    if (!signerName) {
      alert("Bitte den Namen der unterschreibenden Person eintragen.");
      if (inp) inp.focus();
      return;
    }
  }
  // Compress: render to smaller JPEG (saves ~70% vs PNG, no visible quality loss)
  // Target: 400x133px (3:1 ratio matches canvas), JPEG quality 0.8
  const TARGET_W = 400;
  const TARGET_H = 133;
  const tmp = document.createElement("canvas");
  tmp.width = TARGET_W;
  tmp.height = TARGET_H;
  const tctx = tmp.getContext("2d");
  tctx.fillStyle = "#ffffff";
  tctx.fillRect(0, 0, TARGET_W, TARGET_H);
  tctx.imageSmoothingEnabled = true;
  tctx.imageSmoothingQuality = "high";
  tctx.drawImage(canvas, 0, 0, TARGET_W, TARGET_H);
  const dataUrl = tmp.toDataURL("image/jpeg", 0.8);
  const timestamp = new Date().toISOString();
  // Gather a lightweight device fingerprint to strengthen evidentiary value
  const device = collectDeviceFingerprint();
  const cb = window._sigCallback;
  cancelSignaturePad();
  if (typeof cb === "function") cb(dataUrl, timestamp, signerName, device, "draw");
}

// Collect a lightweight device fingerprint for stronger signature evidence
// Note: We deliberately avoid invasive fingerprinting. Just enough info to
// distinguish "signed on the user's iPad in their kitchen" from "signed on a different device".
function collectDeviceFingerprint() {
  try {
    const ua = (navigator.userAgent || "").substring(0, 120);
    const lang = navigator.language || "";
    const w = (window.screen && window.screen.width) || 0;
    const h = (window.screen && window.screen.height) || 0;
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    const offset = new Date().getTimezoneOffset();
    return {
      userAgentShort: shortenUA(ua),
      language: lang,
      screen: w + "x" + h,
      timezone: tz,
      tzOffset: offset,
    };
  } catch (e) {
    return null;
  }
}

// Boil down browser UA to a friendly device name like "iPhone Safari", "Windows Chrome"
function shortenUA(ua) {
  if (!ua) return "";
  let device = "";
  if (/iPhone/.test(ua)) device = "iPhone";
  else if (/iPad/.test(ua)) device = "iPad";
  else if (/Android/.test(ua)) device = "Android";
  else if (/Macintosh/.test(ua)) device = "Mac";
  else if (/Windows/.test(ua)) device = "Windows";
  else if (/Linux/.test(ua)) device = "Linux";
  let browser = "";
  if (/Edg\//.test(ua)) browser = "Edge";
  else if (/Chrome\//.test(ua)) browser = "Chrome";
  else if (/Firefox\//.test(ua)) browser = "Firefox";
  else if (/Safari\//.test(ua)) browser = "Safari";
  return [device, browser].filter(Boolean).join(" ") || "Unbekannt";
}

// Format signature timestamp as "28.04.2026, 14:32"
function fmtSigTimestamp(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const yyyy = d.getFullYear();
    const hh = String(d.getHours()).padStart(2, "0");
    const mi = String(d.getMinutes()).padStart(2, "0");
    return `${dd}.${mm}.${yyyy}, ${hh}:${mi} Uhr`;
  } catch (e) { return ""; }
}

// Render a signature inline (in wizard or print)
function renderSignatureBlock(sig, opts) {
  // sig: { dataUrl, timestamp, signerName, device } or null
  // opts: { showRemove: bool, onRemove: string (JS expression), maxHeight: number, showDevice: bool }
  if (!sig || !sig.dataUrl) return "";
  const maxH = opts && opts.maxHeight ? opts.maxHeight : 80;
  const showDevice = !opts || opts.showDevice !== false;
  const deviceStr = (showDevice && sig.device && sig.device.userAgentShort) ? ` · auf ${esc(sig.device.userAgentShort)}` : "";
  return `
    <div class="sig-display">
      <img src="${sig.dataUrl}" alt="Unterschrift" style="max-height:${maxH}px; max-width:100%; display:block;">
      <div class="sig-meta">
        ${sig.signerName ? `<strong>${esc(sig.signerName)}</strong> · ` : ""}Digital unterzeichnet am ${esc(fmtSigTimestamp(sig.timestamp))}${deviceStr}
      </div>
      ${opts && opts.showRemove && opts.onRemove ? `<button class="btn-secondary sig-remove-btn" onclick="${opts.onRemove}">🗑 Unterschrift entfernen</button>` : ""}
    </div>`;
}

// === SIGNATURE STATE HELPERS ===

// Each doc gets a `signatures` map in its state:
//   ds.signatures = {
//     gesamt: { dataUrl, timestamp, signerName },           // Document-level "by signer" (Therapeut, Einrichtung, Geschädigter)
//     gesamt_proband: { dataUrl, timestamp, signerName },   // Document-level "by user" (proband)
//     row_<sectionId>_<rowIdx>: { dataUrl, timestamp, signerName }  // Per-row
//   }

function ensureSignaturesObj(docId) {
  const ds = state.docs[docId];
  if (!ds.signatures) ds.signatures = {};
  return ds.signatures;
}

function getSignature(docId, key) {
  const ds = state.docs[docId];
  if (!ds || !ds.signatures) return null;
  return ds.signatures[key] || null;
}

function setSignature(docId, key, sig) {
  const sigs = ensureSignaturesObj(docId);
  sigs[key] = sig;
  debouncedSave();
}

function removeSignature(docId, key) {
  const ds = state.docs[docId];
  if (!ds || !ds.signatures) return;
  delete ds.signatures[key];
  debouncedSave();
  render();
}

// Open pad for document-level signature (e.g. Therapeut on Therapie doc)
function signDocument(docId, key, opts) {
  // opts: { title, subtitle, askName, defaultName }
  openSignaturePad({
    title: opts.title || "Unterschrift",
    subtitle: opts.subtitle || "",
    askName: opts.askName !== false,
    defaultName: opts.defaultName || "",
    onSave: (dataUrl, timestamp, signerName, device, method) => {
      setSignature(docId, key, { dataUrl, timestamp, signerName, device, method: method || "draw" });
      render();
    }
  });
}

// Safe dispatcher to avoid quote-escaping issues in inline onclick attributes.
// Stores opts in a global registry, called by short ID-based handlers.
window._sigOpts = {};
function _registerSigOpts(opts) {
  const id = "sig_" + Math.random().toString(36).substring(2, 11);
  window._sigOpts[id] = opts;
  return id;
}
function dispatchSignDoc(optsId) {
  const opts = window._sigOpts[optsId];
  if (!opts) { console.error("Sig opts not found:", optsId); return; }
  signDocument(opts.docId, opts.key, opts);
}
function dispatchSignRow(optsId) {
  const opts = window._sigOpts[optsId];
  if (!opts) { console.error("Sig opts not found:", optsId); return; }
  signRow(opts.docId, opts.sectionId, opts.rowIdx, opts);
}

// Open pad for per-row signature (e.g. each Sozialstunden row)
function signRow(docId, sectionId, rowIdx, opts) {
  const key = `row_${sectionId}_${rowIdx}`;
  openSignaturePad({
    title: opts.title || "Unterschrift für diese Zeile",
    subtitle: opts.subtitle || "",
    askName: true,
    defaultName: opts.defaultName || "",
    onSave: (dataUrl, timestamp, signerName, device, method) => {
      setSignature(docId, key, { dataUrl, timestamp, signerName, device, method: method || "draw" });
      render();
    }
  });
}

function getRowSignature(docId, sectionId, rowIdx) {
  return getSignature(docId, `row_${sectionId}_${rowIdx}`);
}

function removeRowSignature(docId, sectionId, rowIdx) {
  removeSignature(docId, `row_${sectionId}_${rowIdx}`);
}

async function downloadDocBundle(docId, ev) {
  // Get the button reliably - from the passed event, or the global event as fallback
  const evt = ev || (typeof event !== "undefined" ? event : null);
  const btn = evt && evt.target ? evt.target : null;
  const origText = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "📦 Erstelle ZIP..."; }
  try {
    const blob = await buildDocBundleZip(docId);
    const doc = DOCS[docId];
    const userName = (state.shared.name || "").replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");
    const docTitle = doc.title.replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");
    const filename = userName ? `${docTitle}_${userName}.zip` : `${docTitle}.zip`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if (btn) { btn.textContent = "✓ ZIP heruntergeladen"; setTimeout(() => { btn.disabled = false; btn.textContent = origText; }, 2200); }
  } catch (e) {
    console.error(e);
    alert("ZIP-Erstellung fehlgeschlagen: " + (e.message || "Unbekannter Fehler") + "\n\nMögliche Ursache: keine Internetverbindung (die ZIP-Funktion lädt einmalig eine Hilfsbibliothek nach). Bitte mit Internet erneut versuchen.");
    if (btn) { btn.disabled = false; btn.textContent = origText; }
  }
}

async function shareDocument(docId) {
  const doc = DOCS[docId];
  // Desktop browsers (e.g. Firefox/Chrome on Windows) usually have no Web Share API.
  // On desktop this button is labelled "Word herunterladen" and downloads ONLY the
  // Word document. Belege have their own separate "ZIP mit Belegen" button.
  if (!navigator.share) {
    try {
      const blob = await buildDocBlob(docId);
      if (blob) {
        const userName = (state.shared.name || "").replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");
        const docTitle = doc.title.replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");
        const filename = `${docTitle}${userName ? "_" + userName : ""}.docx`;
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showSaveToast("📄 Word-Dokument heruntergeladen");
      } else {
        // Docs without a Word export (kosten, asservate, bhtermine, uebersicht)
        showSaveToast("Für dieses Dokument bitte „Drucken / als PDF\" nutzen");
      }
    } catch (e) {
      console.error(e);
      showSaveToast("Word-Export nicht möglich - bitte „Drucken / als PDF\" nutzen");
    }
    return;
  }
  try {
    if (docId === "uebersicht") {
      const text = `Status-Übersicht für ${state.shared.name || ""}\nAktenzeichen: ${state.shared.aktenzeichen || ""}\nStand: ${todayDE()}\n\n(Bitte vollständige Übersicht aus der App ausdrucken oder als PDF speichern.)`;
      await navigator.share({ title: doc.title, text: text });
      return;
    }

    // Check if doc has attachments
    const docsWithAttachments = ["schadens", "sozial", "kosten", "asservate"];
    const hasAtts = docsWithAttachments.includes(docId) && countAllAttachments(docId) > 0;

    // Build files list - main doc + all attachments
    const files = [];
    const userName = (state.shared.name || "").replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");
    const docTitle = doc.title.replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");

    // Main doc as docx if available, else skip (user must use Print)
    const docBlob = await buildDocBlob(docId);
    if (docBlob) {
      const filename = `${docTitle}${userName ? "_" + userName : ""}.docx`;
      files.push(new File([docBlob], filename, { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }));
    }

    // Attachments
    if (hasAtts) {
      const atts = await collectDocAttachments(docId);
      for (const a of atts) {
        const safeName = `${a.folder}_${a.filename}`;
        files.push(new File([a.blob], safeName, { type: a.blob.type }));
      }
    }

    if (files.length === 0) {
      // Fallback: only text
      const text = `${doc.title}\n${state.shared.name ? "Name: " + state.shared.name + "\n" : ""}${state.shared.aktenzeichen ? "Aktenzeichen: " + state.shared.aktenzeichen + "\n" : ""}Stand: ${todayDE()}\n\n(Dokument bitte aus der App ausdrucken oder als PDF speichern.)`;
      await navigator.share({ title: doc.title, text: text });
      return;
    }

    // Check if device can share files
    if (navigator.canShare && !navigator.canShare({ files: files })) {
      // Fallback: try ZIP download
      const fallback = confirm("Datei-Teilen wird auf diesem Gerät leider nicht unterstützt.\n\nMöchtest du stattdessen alles als ZIP-Datei herunterladen?");
      if (fallback) await downloadDocBundle(docId);
      return;
    }

    await navigator.share({
      title: doc.title,
      text: buildEmailBody(doc.title) + (hasAtts ? "\n\n(Belege sind als zusätzliche Dateien beigefügt.)" : ""),
      files: files,
    });
  } catch (e) {
    if (e.name === "AbortError") return;
    console.error(e);
    // If too-many-files or other share-error, offer ZIP fallback
    const fallback = confirm("Teilen fehlgeschlagen: " + (e.message || "Unbekannter Fehler") + "\n\nMöchtest du stattdessen alles als ZIP-Datei herunterladen?");
    if (fallback) await downloadDocBundle(docId);
  }
}

// Share a single attachment (image/pdf) via system share sheet
async function shareAttachment(secId, rowIdx, attId) {
  const att = getAttachments(secId, rowIdx).find(a => a.id === attId);
  if (!att) return;
  if (!navigator.share) {
    alert("Teilen wird auf diesem Gerät nicht unterstützt. Lade den Beleg runter und versende ihn manuell.");
    return;
  }
  try {
    const resp = await fetch(att.dataUrl);
    const blob = await resp.blob();
    const file = new File([blob], att.name, { type: blob.type });
    if (navigator.canShare && !navigator.canShare({ files: [file] })) {
      alert("Datei-Teilen wird auf diesem Gerät nicht unterstützt.");
      return;
    }
    await navigator.share({ title: "Beleg: " + att.name, files: [file] });
  } catch (e) {
    if (e.name === "AbortError") return;
    alert("Fehler beim Teilen: " + e.message);
  }
}

// Download a single attachment
function downloadAttachment(secId, rowIdx, attId) {

  const a = document.createElement("a");
  a.href = att.dataUrl;
  a.download = att.name;

}

function applyAvgCalculator() {

    alert("Bitte zuerst mindestens einen Wert eingeben.");
    return;

  const avg = parseFloat(preview.dataset.avg);

async function quickAddTerminSubmit(datum) {
  const uhrEl = document.getElementById("qa-uhrzeit");

  const artEl = document.getElementById("qa-art");
  const bisEl = document.getElementById("qa-bis");

  const uhrzeit = uhrEl ? autoFormatTime(uhrEl.value.trim()) : "";

  if (!parseDateGuess(datum)) {

  }

  const kind = quickAddTerminKind;
  let docId, sectionId, newRow;

    if (notizEl?.value.trim()) newRow.notiz = notizEl.value.trim();

    if (bisEl?.value.trim()) newRow.bis = autoFormatTime(bisEl.value.trim());

  state.activeDocId = null;

function isDateInPast(dateStr) {
  const d = parseDateGuess(dateStr);

// Stored as: state.docs[docId].attachments[secId][rowIdx] = [{ id, name, type, size, dataUrl }, ...]
function getAttachments(secId, rowIdx) {
  const ds = getDocState();
  if (!ds.attachments) ds.attachments = {};
  if (!ds.attachments[secId]) ds.attachments[secId] = {};
  if (!ds.attachments[secId][rowIdx]) ds.attachments[secId][rowIdx] = [];

  const ds = getDocState();

// When deleting a row, also drop its attachments and re-index
function shiftAttachmentsAfterRowDelete(secId, deletedIdx) {
  const ds = getDocState();
  if (!ds.attachments || !ds.attachments[secId]) return;
  const map = ds.attachments[secId];
  const newMap = {};
  Object.keys(map).map(k => parseInt(k, 10)).filter(k => !isNaN(k)).sort((a,b) => a-b).forEach(idx => {
    if (idx === deletedIdx) return;
    const newIdx = idx > deletedIdx ? idx - 1 : idx;
    newMap[newIdx] = map[idx];
  });
  ds.attachments[secId] = newMap;
}

// Compress an image file to a smaller JPEG dataURL
function compressImage(file, maxDim = 1600, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = () => reject(new Error("Datei konnte nicht gelesen werden"));
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "white"; ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => reject(new Error("Bild konnte nicht verarbeitet werden"));
    reader.readAsDataURL(file);
  });
}
// Read PDF as base64 (no compression possible)
function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error("Datei konnte nicht gelesen werden"));
    reader.readAsDataURL(file);
  });
}
async function handleAttachmentUpload(secId, rowIdx, fileList) {
  const files = Array.from(fileList);
  if (files.length === 0) return;
  const list = getAttachments(secId, rowIdx);
  for (const file of files) {
    try {
      let dataUrl, type, size;
      if (file.type.startsWith("image/")) {
        dataUrl = await compressImage(file);
        type = "image";
      } else if (file.type === "application/pdf") {
        // PDFs can be large - warn if > 2 MB
        if (file.size > 2 * 1024 * 1024) {
          if (!confirm(`Die PDF "${file.name}" ist ${(file.size/1024/1024).toFixed(1)} MB groß und kann den lokalen Speicher schnell füllen. Trotzdem hinzufügen?`)) continue;
        }
        dataUrl = await readAsDataUrl(file);
        type = "pdf";
      } else {
        alert(`Datei "${file.name}" kann nicht hinzugefügt werden. Nur Bilder (JPG, PNG, HEIC) und PDFs sind erlaubt.`);
        continue;
      }
      // Estimate size of base64 dataUrl in bytes (approx 3/4 of base64 length)
      size = Math.round(dataUrl.length * 0.75);
      list.push({
        id: "att_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
        name: file.name, type, size, dataUrl
      });
    } catch (e) {
      alert(`Fehler bei "${file.name}": ${e.message}`);
    }
  }
  setAttachments(secId, rowIdx, list);
  render();
}

// === STORAGE USAGE ===
function calcStorageUsage() {
  // Total bytes used in localStorage by our app
  let bytes = 0;
  if (Storage.hasLocal) {
    try {
      Object.keys(localStorage).forEach(key => {
        if (key.startsWith("ear_") || key.startsWith("zeit_") || key.startsWith("thera_") ||
            key.startsWith("schadens_") || key.startsWith("sozial_") || key.startsWith("uebersicht_") ||
            key.startsWith("bh_")) {
          bytes += (localStorage.getItem(key) || "").length;
        }
      });
    } catch(e) {}
  }
  // Roughly 5MB limit on most browsers
  const limit = 5 * 1024 * 1024;
  return { bytes, limit, pct: Math.min(100, Math.round((bytes / limit) * 100)) };
}

// === DEADLINES ===
// Returns { kind, message, days } for a doc, or null if no deadline
function getDeadlineInfo(docId) {
  if (docId === "schadens") {
    const fristStr = state.docs.schadens?.answers?.["auflage.frist"];
    const gesamt = parseMoney(state.docs.schadens?.answers?.["auflage.gesamt"]);
    if (!fristStr || typeof fristStr !== "string") return null;
    const fristDate = parseDateGuess(fristStr);
    if (!fristDate) return null;
    // Calc paid - check this FIRST before any other condition
    const rows = (state.docs.schadens?.rows?.zahlungen) || [];
    const gezahlt = rows.reduce((s, r) => s + parseMoney(r.betrag || ""), 0);
    const rest = Math.max(0, gesamt - gezahlt);
    if (gesamt > 0 && rest === 0) return { kind: "ok", message: "✓ Vollständig gezahlt" };
    const days = daysUntil(fristDate);
    if (days < 0) return { kind: "danger", message: `⚠ Frist überschritten (vor ${-days} Tagen)` };
    if (days <= 30) return { kind: "warn", message: `⏰ Frist in ${days} Tagen (${moneyOnly(rest)} € noch offen)` };
    if (days <= 90) return { kind: "warn", message: `Frist in ${days} Tagen` };
    return { kind: "ok", message: `Frist in ${days} Tagen` };
  }
  if (docId === "sozial") {
    const fristStr = state.docs.sozial?.answers?.["auflage.frist"];
    const stundenGesamt = parseMoney(state.docs.sozial?.answers?.["auflage.stunden_gesamt"]);
    if (!fristStr || typeof fristStr !== "string") return null;
    const fristDate = parseDateGuess(fristStr);
    if (!fristDate) return null;
    const rows = (state.docs.sozial?.rows?.stunden) || [];
    const stundenSum = rows.reduce((s, r) => s + parseMoney(r.stunden || ""), 0);
    const rest = Math.max(0, stundenGesamt - stundenSum);
    if (stundenGesamt > 0 && rest === 0) return { kind: "ok", message: "✓ Stunden vollständig geleistet" };
    const days = daysUntil(fristDate);
    if (days < 0) return { kind: "danger", message: `⚠ Frist überschritten (vor ${-days} Tagen, noch ${rest.toLocaleString("de-DE")} h offen)` };
    if (days <= 30) return { kind: "warn", message: `⏰ Frist in ${days} Tagen (${rest.toLocaleString("de-DE")} h noch offen)` };
    if (days <= 90) return { kind: "warn", message: `Frist in ${days} Tagen` };
    return { kind: "ok", message: `Frist in ${days} Tagen` };
  }
  return null;
}
function parseDateGuess(s) {
  if (!s) return null;
  // Defensive: handle skipped fields (objects with skipped:true), numbers, etc.
  if (typeof s !== "string") {
    if (typeof s === "object" && s !== null && s.skipped) return null;
    if (typeof s === "object" && s !== null && typeof s.value === "string") s = s.value;
    else if (typeof s === "number") s = String(s);
    else return null;
  }
  if (!s) return null;
  // Try ISO format first (YYYY-MM-DD)
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  // Try DD.MM.YYYY
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (m) return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
  // Try MM/YYYY
  m = s.match(/^(\d{1,2})\/(\d{4})/);
  if (m) return new Date(parseInt(m[2]), parseInt(m[1])-1, 28); // end of month-ish
  return null;
}
function daysUntil(date) {
  const ms = date - new Date();
  return Math.ceil(ms / (1000 * 60 * 60 * 24));
}

  // Load backup reminder state
  const reminderRaw = await Storage.get(BACKUP_REMINDER_KEY);
  if (reminderRaw) {
    try {
      const parsed = JSON.parse(reminderRaw);
      if (parsed && typeof parsed === "object") {
        state.lastBackupAt = parsed.lastBackupAt || null;
        state.lastChangeAt = parsed.lastChangeAt || null;

      }
    } catch(e){}

  // Load user settings
  const settingsRaw = await Storage.get(SETTINGS_STORAGE_KEY);
  if (settingsRaw) {

        if (!Array.isArray(state.settings.hiddenDocs)) state.settings.hiddenDocs = [];

  // Check for PIN - if set, lock immediately. Strict validation: a valid hash
  // produced by hashPin() starts with "bh_" and is at least 6 chars long. Anything
  // shorter or in a wrong format is treated as corrupt and silently cleared, so
  // the user isn't locked out by a bogus storage value they never set.
  const pinHash = await Storage.get(PIN_STORAGE_KEY);
  if (pinHash && typeof pinHash === "string" && pinHash.startsWith("bh_") && pinHash.length >= 6) {

    console.warn("PIN-Hash war im falschen Format und wird entfernt:", pinHash);
    await Storage.del(PIN_STORAGE_KEY);
    state.pinLocked = false;
  }
}

// === BACKUP REMINDER LOGIC ===
const BACKUP_REMINDER_DAYS = 14; // every 14 days
const BACKUP_REMINDER_SNOOZE_HOURS = 24; // "Später erinnern" snoozes for 1 day

// Persist the backup reminder state (called when fields change)
async function persistBackupReminder() {
  try {
    await Storage.set(BACKUP_REMINDER_KEY, JSON.stringify({
      lastBackupAt: state.lastBackupAt,
      lastChangeAt: state.lastChangeAt,
      backupReminderSnoozedUntil: state.backupReminderSnoozedUntil
    }));
  } catch (e) { console.error("backup reminder persist:", e); }
}

// Mark that data has changed - called from saveActiveDoc and direct row edits
function markDataChanged() {
  state.lastChangeAt = new Date().toISOString();
  // Don't await - fire and forget
  persistBackupReminder();
}

// Check whether to show the backup reminder banner
function shouldShowBackupReminder() {
  // User disabled the reminder?
  if (state.settings && state.settings.showBackupReminder === false) return false;
  // No data changes yet? No reminder.
  if (!state.lastChangeAt) return false;
  const now = new Date();
  // Snoozed?
  if (state.backupReminderSnoozedUntil) {
    const snoozeEnd = new Date(state.backupReminderSnoozedUntil);
    if (snoozeEnd > now) return false;
  }
  // Determine interval (custom or default)
  let days = BACKUP_REMINDER_DAYS;
  if (state.settings && typeof state.settings.backupReminderDays === "number") {
    days = state.settings.backupReminderDays;
  }
  if (days === 0) return false; // user turned reminder off
  // Never backed up? Show only after data is at least 1 day old (avoid annoying brand-new users)
  if (!state.lastBackupAt) {
    const lastChange = new Date(state.lastChangeAt);
    const ageHours = (now - lastChange) / (1000 * 60 * 60);
    return ageHours >= 24;
  }
  // Has there been a change since last backup?
  const lastBackup = new Date(state.lastBackupAt);
  const lastChange = new Date(state.lastChangeAt);
  if (lastChange <= lastBackup) return false;  // No new changes since backup
  // Has interval passed since last backup?
  const daysSinceBackup = (now - lastBackup) / (1000 * 60 * 60 * 24);
  return daysSinceBackup >= days;
}

// Get a human-readable summary of when last backup was
function getBackupReminderInfo() {
  const now = new Date();
  if (!state.lastBackupAt) {
    return { neverBackedUp: true, message: "Du hast noch nie ein Backup gemacht. Sicher dir deine Daten - ein Datenverlust kann jederzeit passieren." };
  }
  const lastBackup = new Date(state.lastBackupAt);
  const daysAgo = Math.floor((now - lastBackup) / (1000 * 60 * 60 * 24));
  let when;
  if (daysAgo === 0) when = "heute";
  else if (daysAgo === 1) when = "gestern";
  else if (daysAgo < 30) when = `vor ${daysAgo} Tagen`;
  else if (daysAgo < 60) when = `vor über einem Monat`;
  else when = `vor ${Math.floor(daysAgo / 30)} Monaten`;
  return {
    neverBackedUp: false,
    daysAgo,
    message: `Dein letztes Backup war ${when}. Seitdem hast du Daten geändert - jetzt wäre ein guter Zeitpunkt, sie zu sichern.`
  };
}
