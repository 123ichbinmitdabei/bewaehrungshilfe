// PUNKT 14: HEUTE-ÜBERSICHT
// ============================================
// Returns array of "today" items based on app data
// Check if a row's status field indicates it has been handled (not "pending")
// Returns true if status contains keywords like "wahrgenommen", "abgesagt", "verpasst", "bezahlt", "erledigt"
function isStatusHandled(status) {
  if (!status || typeof status !== "string") return false;
  const s = status.toLowerCase();
  return /wahrgenommen|abgesagt|verpasst|nicht.?(da|wahrgenommen|erschienen)|bezahlt|erledigt|stattgefunden|nicht.?statt/.test(s);
}

function getTodayOverview() {
  const items = [];
  const now = new Date();
  const today = new Date(now); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  const inWeek = new Date(today); inWeek.setDate(inWeek.getDate() + 7);

  // Helper: classify a date relative to today and produce a label
  function classifyDate(d) {
    if (!d) return null;
    const dd = new Date(d); dd.setHours(0,0,0,0);
    const diffDays = Math.round((dd - today) / (1000*60*60*24));
    if (diffDays === 0) return { kind: "danger", label: "Heute", days: 0 };
    if (diffDays === 1) return { kind: "warn", label: "Morgen", days: 1 };
    if (diffDays > 1 && diffDays <= 7) return { kind: "info", label: `In ${diffDays} Tagen`, days: diffDays };
    if (diffDays < 0 && diffDays >= -7) return { kind: "danger", label: `Vor ${Math.abs(diffDays)} Tag${Math.abs(diffDays) !== 1 ? "en" : ""} (vergangen)`, days: diffDays };
    return null; // Outside the 7-day window
  }

  // 1. BH-Termin: nächster (gespeichertes Feld)
  const naechsterDatum = state.docs.bhtermine?.answers?.["naechster.datum"];
  if (naechsterDatum) {
    const d = parseDateGuess(naechsterDatum);
    const cls = d ? classifyDate(d) : null;
    if (cls && cls.days >= 0) {
      const uhrzeit = state.docs.bhtermine.answers?.["naechster.uhrzeit"] || "";
      items.push({ kind: cls.kind, icon: "📅", text: `${cls.label} BH-Termin${uhrzeit ? " um " + uhrzeit : ""}` });
    }
  }

  // 2. BH-Termine aus Tabelle (gespeicherte Termine)
  const bhRows = state.docs.bhtermine?.rows?.termine || [];
  bhRows.forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    const cls = d ? classifyDate(d) : null;
    if (!cls) return;
    // Skip if already handled (status set)
    if (isStatusHandled(row.status)) return;
    // Skip if already covered by "naechster.datum"
    if (naechsterDatum && row.datum === naechsterDatum) return;
    const uhr = row.uhrzeit || "";
    items.push({
      kind: cls.kind, icon: "📅",
      text: `${cls.label} BH-Termin${uhr ? " um " + uhr : ""}${row.themen ? ": " + row.themen.substring(0, 40) : ""}`,
      action: { type: "appointment", docId: "bhtermine", sectionId: "termine", rowIdx: idx, kind: "bh" }
    });
  });

  // 3. Therapie-Termine
  const theraRows = state.docs.thera?.rows?.termine || [];
  theraRows.forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    const cls = d ? classifyDate(d) : null;
    if (!cls) return;
    // Skip if already handled (status field added when user confirms)
    if (isStatusHandled(row.status)) return;
    const uhr = row.uhrzeit || row.von || "";
    items.push({
      kind: cls.kind, icon: "🧠",
      text: `${cls.label} Therapie-Termin${uhr ? " um " + uhr : ""}`,
      action: { type: "appointment", docId: "thera", sectionId: "termine", rowIdx: idx, kind: "thera" }
    });
  });

  // 4. Sozialstunden-Einsätze
  const sozialRows = state.docs.sozial?.rows?.stunden || [];
  sozialRows.forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    const cls = d ? classifyDate(d) : null;
    if (!cls) return;
    // Skip if already handled
    if (isStatusHandled(row.status)) return;
    const uhr = row.von || "";
    const taet = row.taetigkeit ? ": " + row.taetigkeit.substring(0, 40) : "";
    items.push({
      kind: cls.kind, icon: "🤝",
      text: `${cls.label} Sozialstunden-Einsatz${uhr ? " ab " + uhr : ""}${taet}`,
      action: { type: "appointment", docId: "sozial", sectionId: "stunden", rowIdx: idx, kind: "sozial" }
    });
  });

  // 5. Schadens: anstehende Zahlungen (Ratenzahlung)
  const schadensRows = state.docs.schadens?.rows?.zahlungen || [];
  schadensRows.forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    const cls = d ? classifyDate(d) : null;
    if (!cls) return;
    // Only show as upcoming if no payment has been made yet for this row (no betrag set)
    if (row.betrag) return; // Already paid - don't remind
    if (isStatusHandled(row.status)) return;
    const betrag = row.bemerkung ? " " + row.bemerkung.substring(0, 30) : "";
    items.push({
      kind: cls.kind, icon: "💶",
      text: `${cls.label} Schadens-Zahlung${betrag}`,
      action: { type: "payment", docId: "schadens", sectionId: "zahlungen", rowIdx: idx }
    });
  });

  // 6. Verfahrenskosten: anstehende Zahlungen
  const kostenRows = state.docs.kosten?.rows?.zahlungen || [];
  kostenRows.forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    const cls = d ? classifyDate(d) : null;
    if (!cls) return;
    if (row.betrag) return; // Already paid
    if (isStatusHandled(row.status)) return;
    items.push({
      kind: cls.kind, icon: "💸",
      text: `${cls.label} Verfahrenskosten-Zahlung`,
      action: { type: "payment", docId: "kosten", sectionId: "zahlungen", rowIdx: idx }
    });
  });

  // 7. Schadens: Frist nahe?
  const schadensFrist = state.docs.schadens?.answers?.["auflage.frist"];
  if (schadensFrist) {
    const fristD = parseDateGuess(schadensFrist);
    if (fristD) {
      const days = daysUntil(fristD);
      const gesamt = parseMoney(state.docs.schadens?.answers?.["auflage.gesamt"]);
      const rows = state.docs.schadens?.rows?.zahlungen || [];
      const gezahlt = rows.reduce((s, r) => s + parseMoney(r.betrag || ""), 0);
      const rest = Math.max(0, gesamt - gezahlt);
      if (rest > 0 && days >= 0 && days <= 30) {
        items.push({ kind: days <= 7 ? "danger" : "warn", icon: "💶", text: `Schadens-Auflage: ${moneyOnly(rest)} € offen, Frist in ${days} Tag${days !== 1 ? "en" : ""}` });
      } else if (rest > 0 && days < 0) {
        items.push({ kind: "danger", icon: "💶", text: `Schadens-Frist überschritten: ${moneyOnly(rest)} € noch offen` });
      }
    }
  }

  // 8. Sozial: Frist nahe?
  const sozialFrist = state.docs.sozial?.answers?.["auflage.frist"];
  if (sozialFrist) {
    const fristD = parseDateGuess(sozialFrist);
    if (fristD) {
      const days = daysUntil(fristD);
      const stundenGesamt = parseMoney(state.docs.sozial?.answers?.["auflage.stunden_gesamt"]);
      const rows = state.docs.sozial?.rows?.stunden || [];
      const stundenSum = rows.reduce((s, r) => s + parseMoney(r.stunden || ""), 0);
      const rest = Math.max(0, stundenGesamt - stundenSum);
      if (rest > 0 && days >= 0 && days <= 30) {
        items.push({ kind: days <= 7 ? "danger" : "warn", icon: "⏱", text: `Sozial-Auflage: ${rest.toLocaleString("de-DE")} h offen, Frist in ${days} Tag${days !== 1 ? "en" : ""}` });
      } else if (rest > 0 && days < 0) {
        items.push({ kind: "danger", icon: "⏱", text: `Sozial-Frist überschritten: ${rest.toLocaleString("de-DE")} h noch offen` });
      }
    }
  }

  // 9. Verfahrenskosten: Zahlungsfristen (offene Bescheide)
  const kostenFrist1 = state.docs.kosten?.answers?.["geldstrafe.frist"];
  const kostenFrist2 = state.docs.kosten?.answers?.["gerichtskosten.frist"];
  [["geldstrafe", kostenFrist1, "Geldstrafe"], ["gerichtskosten", kostenFrist2, "Gerichtskosten"]].forEach(([_, frist, label]) => {
    if (!frist) return;
    const fristD = parseDateGuess(frist);
    if (!fristD) return;
    const days = daysUntil(fristD);
    if (days >= 0 && days <= 14) {
      items.push({ kind: days <= 3 ? "danger" : "warn", icon: "💸", text: `${label}: Zahlungsfrist in ${days} Tag${days !== 1 ? "en" : ""}` });
    } else if (days < 0 && days >= -14) {
      items.push({ kind: "danger", icon: "💸", text: `${label}: Zahlungsfrist seit ${Math.abs(days)} Tag${Math.abs(days) !== 1 ? "en" : ""} überschritten` });
    }
  });

  // 10. Offene Notizen für nächsten BH-Termin
  const openBh = state.notes.filter(n => !n.done && n.category === "bh");
  if (openBh.length > 0 && naechsterDatum) {
    const d = parseDateGuess(naechsterDatum);
    if (d && d >= today && (d - today) / (1000*60*60*24) <= 7) {
      items.push({ kind: "info", icon: "📝", text: `${openBh.length} offene Notiz(en) für nächsten BH-Termin` });
    }
  }

  // Sort: most urgent first (danger > warn > info), then by closest date
  const kindOrder = { danger: 0, warn: 1, info: 2 };
  items.sort((a, b) => (kindOrder[a.kind] ?? 9) - (kindOrder[b.kind] ?? 9));

  return items;
}

// Render the backup reminder banner (shown above the today-overview)
// Render a card with the next upcoming appointment per area (BH / Therapie / Sozial)
function renderNextAppointmentsCard() {
  const today = new Date(); today.setHours(0,0,0,0);
  const items = [];

  // 1. BH-Termin: prefer special "naechster.datum" if set, else use earliest future row
  const naechsterDatum = state.docs.bhtermine?.answers?.["naechster.datum"];
  const naechsterUhrzeit = state.docs.bhtermine?.answers?.["naechster.uhrzeit"];
  let bhSpecialUsed = false;
  if (naechsterDatum) {
    const d = parseDateGuess(naechsterDatum);
    if (d && d >= today) {
      items.push({
        icon: "📅",
        label: "Nächster BH-Termin",
        date: naechsterDatum,
        time: naechsterUhrzeit || "",
        action: { kind: "bh-special" }
      });
      bhSpecialUsed = true;
    }
  }
  if (!bhSpecialUsed) {
    const next = findNextFutureRow("bhtermine", "termine", today);
    if (next) items.push({
      icon: "📅",
      label: "Nächster BH-Termin",
      date: next.row.datum,
      time: next.row.uhrzeit || "",
      action: { kind: "row", docId: "bhtermine", sectionId: "termine", rowIdx: next.idx }
    });
  }

  // 2. Therapie-Termin: earliest future row
  const nextThera = findNextFutureRow("thera", "termine", today);
  if (nextThera) items.push({
    icon: "🧠",
    label: "Nächster Therapie-Termin",
    date: nextThera.row.datum,
    time: nextThera.row.uhrzeit || "",
    extra: nextThera.row.art ? ` (${nextThera.row.art})` : "",
    action: { kind: "row", docId: "thera", sectionId: "termine", rowIdx: nextThera.idx }
  });

  // 3. Sozialstunden-Einsatz: earliest future row
  const nextSozial = findNextFutureRow("sozial", "stunden", today);
  if (nextSozial) items.push({
    icon: "🤝",
    label: "Nächster Sozial-Einsatz",
    date: nextSozial.row.datum,
    time: nextSozial.row.von || "",
    extra: nextSozial.row.taetigkeit ? `: ${nextSozial.row.taetigkeit}` : "",
    action: { kind: "row", docId: "sozial", sectionId: "stunden", rowIdx: nextSozial.idx }
  });

  if (items.length === 0) return "";

  const lines = items.map(it => {
    let calClick;
    if (it.action.kind === "bh-special") {
      calClick = `exportNextBhTerminToCalendar()`;
    } else {
      calClick = `exportRowToCalendar('${it.action.docId}', '${it.action.sectionId}', ${it.action.rowIdx})`;
    }
    return `
      <div class="next-appt-row">
        <span class="next-appt-text">
          <span class="next-appt-icon">${it.icon}</span>
          <strong>${esc(it.label)}:</strong> ${esc(it.date)}${it.time ? " um " + esc(it.time) : ""}${it.extra ? esc(it.extra) : ""}
        </span>
        <button class="btn btn-secondary next-appt-btn" onclick="${calClick}" title="Diesen Termin in den Kalender exportieren">📲 In Kalender</button>
      </div>`;
  }).join("");

  return `<div class="next-appts-card">${lines}</div>`;
}

// Helper: find earliest future (or today) row in a section
function findNextFutureRow(docId, sectionId, today) {
  const rows = state.docs[docId]?.rows?.[sectionId] || [];
  let best = null;
  rows.forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    if (!d || d < today) return;
    if (isStatusHandled(row.status)) return;
    if (!best || d < best.date) {
      best = { idx, row, date: d };
    }
  });
  return best;
}

// Action ref registry (avoid quote-encoding issues in inline onclick)
window._actionRefs = {};
function _registerActionRef(action) {
  const id = "act_" + Math.random().toString(36).substring(2, 11);
  window._actionRefs[id] = action;
  return id;
}

function _getActionRef(refId) {
  return window._actionRefs[refId];
}

// Handle appointment confirmation (Erledigt / Verpasst / Abgesagt)
function confirmAppointment(refId, status, ev) {
  if (ev) ev.stopPropagation();
  const action = _getActionRef(refId);
  if (!action) return;
  const { docId, sectionId, rowIdx, kind } = action;
  const rows = state.docs[docId]?.rows?.[sectionId];
  if (!rows || !rows[rowIdx]) return;
  const row = rows[rowIdx];

  // Map status to readable text
  const statusText = {
    done: "wahrgenommen",
    missed: "verpasst (nicht erschienen)",
    cancelled: "abgesagt"
  }[status];

  // Confirm dialog for destructive actions (missed / cancelled)
  if (status === "missed" || status === "cancelled") {
    const which = status === "missed" ? "verpasst" : "abgesagt";
    const dateStr = row.datum || "(ohne Datum)";
    const docName = DOCS[docId].title;
    if (!confirm(`Termin am ${dateStr} (${docName}) wirklich als „${which}" markieren?\n\nDas wird im Status-Feld eingetragen und der Termin verschwindet aus der Erinnerungsliste.`)) {
      return;
    }
  }

  // Special handling for sozial: offer to auto-fill stunden
  if (kind === "sozial" && status === "done") {
    handleSozialDone(docId, sectionId, rowIdx, row);
    return;
  }

  // Regular: just set status
  row.status = statusText;

  // After missed/cancelled, offer to schedule a replacement appointment
  if (status === "missed" || status === "cancelled") {
    // Save first (so the cancelled status is persisted even if user backs out of replacement dialog)
    saveAndRefresh(docId);
    // Slight delay so the toast appears first, then the dialog
    setTimeout(() => {
      const which = status === "missed" ? "verpasst" : "abgesagt";
      if (confirm(`Möchtest du gleich einen Ersatz-Termin anlegen?\n\nDer ${which}e Termin bleibt mit Status „${which === "verpasst" ? "verpasst" : "abgesagt"}" erhalten und ein neuer Termin wird zusätzlich angelegt.`)) {
        openRescheduleDialog({
          docId, sectionId, rowIdx,
          originalRow: row,
          mode: "create_new",
          title: "Ersatz-Termin anlegen",
          intro: `Trage Datum und Uhrzeit für den Ersatz-Termin ein. Der ${which}e Termin am ${row.datum || ""} bleibt mit dem Status erhalten, der neue Termin wird zusätzlich angelegt.`,
          onConfirm: (opts) => {
            // Create a new row only - don't touch the old (already has status)
            const ds = state.docs[docId];
            const newRow = { datum: opts.newDate };
            if (opts.newTime) {
              if (sectionId === "stunden") newRow.von = opts.newTime;
              else newRow.uhrzeit = opts.newTime;
            }
            if (row.art) newRow.art = row.art;
            if (sectionId === "stunden" && row.taetigkeit) newRow.taetigkeit = row.taetigkeit;
            if (sectionId === "stunden" && row.bis) newRow.bis = row.bis;
            if (sectionId === "stunden" && row.pause) newRow.pause = row.pause;
            ds.rows[sectionId].push(newRow);
            saveAndRefresh(docId);
          }
        });
      }
    }, 250);
    return;
  }

  saveAndRefresh(docId);
}

  if (ev) ev.stopPropagation();
  const action = _getActionRef(refId);

// Sozial special: prompt user about auto-calculating stunden
function handleSozialDone(docId, sectionId, rowIdx, row) {
  const calculated = calculateNetHours(row.von, row.bis, row.pause);
  let action = "manual";
  if (calculated !== null && calculated > 0 && row.von && row.bis) {
    // We can calculate - ask user
    const msg = `Sozialstunden-Einsatz als erledigt markieren.\n\n` +
      `Aus deinen Eingaben (${row.von}–${row.bis}, Pause ${row.pause || 0} Min) wären das ${calculated.toLocaleString("de-DE", { maximumFractionDigits: 2 })} h netto.\n\n` +
      `OK   = ${calculated.toLocaleString("de-DE", { maximumFractionDigits: 2 })} h automatisch eintragen\n` +
      `Abbrechen = Nur Status setzen, Stunden später eintragen`;
    if (confirm(msg)) {
      row.stunden = calculated.toLocaleString("de-DE", { maximumFractionDigits: 2 });
    }
  }
  row.status = "wahrgenommen";
  saveAndRefresh(docId);
}

// Calculate net hours from von/bis/pause (returns number or null)
function calculateNetHours(von, bis, pause) {
  if (!von || !bis) return null;
  const parseTime = s => {
    const m = String(s).match(/^(\d{1,2})[:.]?(\d{0,2})$/);
    if (!m) return null;
    const h = parseInt(m[1]); const mi = parseInt(m[2] || "0");
    if (isNaN(h) || isNaN(mi) || h > 23 || mi > 59) return null;
    return h * 60 + mi;
  };
  const v = parseTime(von); const b = parseTime(bis);
  if (v === null || b === null) return null;
  let mins = b - v;
  if (mins < 0) mins += 24 * 60; // crossed midnight (rare)
  const pauseMin = pause ? parseInt(String(pause).replace(/[^\d]/g, "")) || 0 : 0;
  mins -= pauseMin;
  if (mins <= 0) return null;
  return mins / 60;
}

// Handle payment confirmation
function confirmPayment(refId, status, ev) {
  if (ev) ev.stopPropagation();
  const action = _getActionRef(refId);
  if (!action) return;
  const { docId, sectionId, rowIdx } = action;
  const rows = state.docs[docId]?.rows?.[sectionId];
  if (!rows || !rows[rowIdx]) return;
  const row = rows[rowIdx];

  if (status === "paid") {
    // Ask user for amount (most likely they want to enter it now)
    const docName = DOCS[docId].title;
    const dateStr = row.datum || "(ohne Datum)";
    const suggested = row.bemerkung && /\d/.test(row.bemerkung) ? row.bemerkung.match(/\d+[,\.]?\d*/)?.[0] : "";
    const amount = prompt(`Zahlung am ${dateStr} (${docName}) als bezahlt markieren.\n\nWelchen Betrag hast du gezahlt? (€)`, suggested || "");
    if (amount === null) return; // User cancelled
    const cleaned = amount.trim();
    if (!cleaned) {
      // No amount - just set status
      row.status = "bezahlt";
    } else {
      row.betrag = cleaned;
      row.status = "bezahlt";
    }
  } else if (status === "postponed") {
    if (!confirm(`Zahlung wirklich als „verschoben" markieren?\n\nDer Eintrag bleibt erhalten und du kannst gleich ein neues Fälligkeits-Datum eintragen.`)) {
      return;
    }
    row.status = "verschoben";
    saveAndRefresh(docId);
    // Offer to schedule new payment date
    setTimeout(() => {
      if (confirm("Möchtest du gleich ein neues Fälligkeits-Datum eintragen?")) {
        openRescheduleDialog({
          docId, sectionId, rowIdx,
          originalRow: row,
          mode: "create_new",
          title: "Neues Fälligkeits-Datum",
          intro: `Trage das neue Fälligkeits-Datum für diese Zahlung ein. Der alte Eintrag bleibt mit Status „verschoben" erhalten.`,
          onConfirm: (opts) => {
            const ds = state.docs[docId];
            const newRow = { datum: opts.newDate };
            if (row.bemerkung) newRow.bemerkung = row.bemerkung;
            if (row.art) newRow.art = row.art;
            ds.rows[sectionId].push(newRow);
            saveAndRefresh(docId);
          }
        });
      }
    }, 250);
    return;
  }
  saveAndRefresh(docId);
}

// Common save + refresh helper for action handlers
function saveAndRefresh(docId) {
  const ds = state.docs[docId];
  if (!ds) return;
  // Rows are mutated in place; persist now (don't wait for debounce)
  try {
    Storage.set(DOCS[docId].storageKey, JSON.stringify(ds));
    markDataChanged();
  } catch (e) {
    console.error("save failed:", e);
  }
  showSaveToast("✓ Status gespeichert");
  render();
}

function showSaveToast(text) {
  const existing = document.querySelector(".save-toast.action-toast");
  if (existing) existing.remove();
  const toast = document.createElement("div");
  toast.className = "save-toast action-toast";
  toast.textContent = text;
  document.body.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 2000);
}

function renderBelegeView() {
  // Collect all attachments across schadens & sozial with metadata
  const all = [];
  ["schadens", "sozial"].forEach(docId => {
    const ds = state.docs[docId];
    if (!ds || !ds.attachments) return;
    Object.keys(ds.attachments).forEach(secId => {
      const map = ds.attachments[secId];
      if (!map) return;
      Object.keys(map).forEach(rowIdx => {
        const arr = map[rowIdx];
        if (!Array.isArray(arr)) return;
        const row = ds.rows?.[secId]?.[parseInt(rowIdx)];
        arr.forEach(att => {
          all.push({
            docId, docTitle: DOCS[docId].title, secId,
            rowIdx: parseInt(rowIdx),
            rowDescription: row ? (row.datum || "") + (row.betrag ? ` · ${row.betrag} €` : "") + (row.stunden ? ` · ${row.stunden} h` : "") + (row.taetigkeit ? ` · ${row.taetigkeit}` : "") : "",
            att
          });
        });
      });
    });
  });
  // Sort by size descending (biggest first - they're prime candidates for deletion)
  all.sort((a, b) => (b.att.size || 0) - (a.att.size || 0));
  const totalSize = all.reduce((s, x) => s + (x.att.size || 0), 0);
  const totalSizeMb = (totalSize / 1024 / 1024).toFixed(2);

  // Also tally signatures
  let sigCount = 0, sigSize = 0;
  Object.keys(state.docs).forEach(docId => {
    const sigs = state.docs[docId] && state.docs[docId].signatures;
    if (!sigs) return;
    Object.values(sigs).forEach(sig => {
      if (sig && sig.dataUrl) {
        sigCount++;
        // Estimate base64 dataUrl size
        sigSize += Math.round(sig.dataUrl.length * 0.75);
      }
    });
  });
  const sigSizeKb = (sigSize / 1024).toFixed(0);

  let listHtml = "";
  if (all.length === 0) {
    listHtml = `<div style="text-align:center; padding:40px; color:var(--text-soft);">Keine Belege vorhanden.</div>`;
  } else {
    all.forEach(item => {
      const sizeKb = ((item.att.size || 0) / 1024).toFixed(0);
      const preview = item.att.type === "image"
        ? `<img src="${item.att.dataUrl}" alt="" style="width:60px; height:60px; object-fit:cover; border-radius:6px; cursor:pointer;" onclick="viewAttachment('${item.secId}', ${item.rowIdx}, '${item.att.id}')" />`
        : `<div style="width:60px; height:60px; display:flex; align-items:center; justify-content:center; background:var(--bg); border-radius:6px; font-size:24px;">📄</div>`;
      listHtml += `
        <div class="belege-row">
          ${preview}
          <div class="belege-info">
            <div class="belege-name">${esc(item.att.name)}</div>
            <div class="belege-meta">${esc(item.docTitle)}${item.rowDescription ? " · " + esc(item.rowDescription) : ""}</div>
            <div class="belege-size">${sizeKb} KB</div>
          </div>
          <div class="belege-actions">
            <button class="btn btn-secondary" onclick="(async()=>{state.activeDocId='${item.docId}'; await deleteAttachment('${item.secId}', ${item.rowIdx}, '${item.att.id}'); openBelegeManager();})();" title="Belege löschen">🗑</button>
          </div>
        </div>`;
    });
  }
  return `
    <div class="header">
      <div>
        <h1>📦 Belege verwalten</h1>
        <div class="sub">Speicher freischaufeln durch Löschen alter Belege</div>
      </div>
      <button class="btn btn-secondary" onclick="closeBelegeManager()">← Zurück</button>
    </div>
    <div style="background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-top:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;">
        <div>
          <strong>${all.length} Beleg(e)</strong> · Gesamt Belege: <strong>${totalSizeMb} MB</strong>
          ${sigCount > 0 ? `<br><span style="font-size:13px; color:var(--text-soft);">+ ${sigCount} digitale Unterschrift(en) · ca. ${sigSizeKb} KB</span>` : ""}
        </div>
        <div style="font-size:12px; color:var(--text-soft);">Sortiert nach Größe (größte zuerst)</div>
      </div>
      ${all.length > 0 ? `
        <div style="background:rgba(217, 119, 6, 0.08); border-radius:8px; padding:12px; margin-bottom:14px; font-size:13px;">
          💡 <strong>Tipp:</strong> Große Belege belasten den Speicher am meisten. Wenn dein Speicher voll ist, lösche zuerst die größten oder die ältesten Belege - aber denk dran, vorher zu sichern!
        </div>` : ""}
      <div class="belege-list">${listHtml}</div>
    </div>
  `;
}

// ============================================
// HELPERS
// ============================================
const esc = s => String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
const isSkipped = a => a && typeof a === "object" && a.skipped === true;
const valueOf = a => (a && typeof a === "string") ? a : "";
function parseMoney(s) {
  if (!s) return 0;
  const c = String(s).replace(/[^\d.,-]/g, "").replace(/\./g, "").replace(",", ".");
  const n = parseFloat(c);
  return isNaN(n) ? 0 : n;
}
function formatMoney(n) {
  return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}
function moneyOnly(n) {
  return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function getDocState() { return state.docs[state.activeDocId]; }
function getSharedKey(secId, fId) {
  const map = SHARED_FIELD_MAP[state.activeDocId];
  return map ? map[`${secId}.${fId}`] : null;
}
function getAnswer(secId, fId) {
  const ds = getDocState();
  if (!ds) return undefined;
  const local = ds.answers[`${secId}.${fId}`];
  if (local !== undefined) return local;
  // Fall back to shared value if field is shared and not yet touched in this doc
  const sk = getSharedKey(secId, fId);
  if (sk && state.shared[sk]) return state.shared[sk];
  return undefined;
}
function setAnswer(secId, fId, val) {
  getDocState().answers[`${secId}.${fId}`] = val;
  // Sync to shared store if this is a shared field
  const sk = getSharedKey(secId, fId);
  if (sk && typeof val === "string") {
    state.shared[sk] = val;
    // Also propagate to other docs that have already touched this shared field,
    // so they don't show a stale value when revisited
    Object.keys(SHARED_FIELD_MAP).forEach(docId => {
      if (docId === state.activeDocId) return;
      const otherMap = SHARED_FIELD_MAP[docId];
      Object.keys(otherMap).forEach(otherKey => {
        if (otherMap[otherKey] === sk) {
          const other = state.docs[docId]?.answers?.[otherKey];
          // Only overwrite if other doc already has a string value (not skipped, not untouched)
          if (typeof other === "string") {
            state.docs[docId].answers[otherKey] = val;
          }
        }
      });
    });
  }
  // Universal Sync (v3.35): durch DATA_SYNC_GROUPS gehen und alle gemappten
  // Felder und Adressbuch-Kontakte aktualisieren.
  if (typeof val === "string" && state.activeDocId) {
    try {
      propagateFieldChange({ type: "doc", docId: state.activeDocId, key: `${secId}.${fId}` }, val);
      syncSharedToContacts();
    } catch(e) { console.error("universal sync failed:", e); }
  }
  debouncedSave();
}
function getRows(secId) {
  const ds = getDocState();
  if (!ds.rows) ds.rows = {};
  if (!ds.rows[secId]) ds.rows[secId] = [];
  return ds.rows[secId];
}
function setRows(secId, rows) {
  if (!getDocState().rows) getDocState().rows = {};
  getDocState().rows[secId] = rows;
  debouncedSave();
}
function getChecks(secId) {
  const ds = getDocState();
  if (!ds.checks) ds.checks = {};
  if (!ds.checks[secId]) ds.checks[secId] = {};
  return ds.checks[secId];
}
function toggleCheck(secId, opt) {
  const checks = getChecks(secId);
  checks[opt] = !checks[opt];
  debouncedSave();
}
function sectionStatus(sec) {
  if (sec.type === "review") return "empty";
  if (sec.type === "rows") {
    const rows = getRows(sec.id);
    return rows.length > 0 ? "done" : "empty";
  }
  if (sec.type === "checkboxes") {
    const checks = getChecks(sec.id);
    return Object.values(checks).some(v => v) ? "done" : "empty";
  }
  if (sec.type === "signatures") {
    const docId = state.activeDocId;
    const sigs = state.docs[docId] && state.docs[docId].signatures;
    if (!sigs) return "empty";
    if (sigs.gesamt_proband || sigs.gesamt) return "done";
    return "empty";
  }
  if (!sec.fields) return "empty";
  const total = sec.fields.length; if (total === 0) return "empty";
  let touched = 0;
  sec.fields.forEach(f => {
    const a = getAnswer(sec.id, f.id);
    if (isSkipped(a) || (a && a.length > 0)) touched++;
  });
  if (touched === 0) return "empty";
  if (touched === total) return "done";
  return "partial";
}
function totalsBySide() {
  let ein = 0, aus = 0, einHH = 0;
  if (state.activeDocId !== "ear") return { ein, aus, einHH, saldo: 0 };
  const ans = getDocState().answers;
  DOCS.ear.sections.forEach(sec => {
    if (sec.type !== "money") return;
    sec.fields.forEach(f => {
      const a = ans[`${sec.id}.${f.id}`];
      if (isSkipped(a)) return;
      const n = parseMoney(a);
      if (sec.side === "ein") ein += n;
      if (sec.side === "aus") aus += n;
    });
  });
  // Add household member income from rows
  const hhRows = (getDocState().rows && getDocState().rows.haushalt_ein) || [];
  hhRows.forEach(r => { einHH += parseMoney(r.betrag || ""); });
  return { ein, einHH, aus, saldo: (ein + einHH) - aus };
}

function render() {
  // PIN lock: blocks everything else
  if (state.pinLocked) {
    document.getElementById("printView").classList.remove("show", "landscape-mode");
    document.getElementById("app").innerHTML = "";
    document.querySelectorAll("#modalOverlay").forEach(el => el.remove());
    const orphanSig = document.getElementById("sig-modal");
    if (orphanSig) orphanSig.remove();
    let pinExisting = document.getElementById("pinOverlay");
    if (pinExisting) pinExisting.remove();
    const wrap = document.createElement("div");
    wrap.id = "pinOverlay";
    wrap.innerHTML = renderPinLock();
    document.body.appendChild(wrap);
    setTimeout(() => {
      const inp = document.getElementById("pin-input");
      if (inp) inp.focus();
    }, 50);
    return;
  } else {
    let pinExisting = document.getElementById("pinOverlay");
    if (pinExisting) pinExisting.remove();
  }
  document.getElementById("printView").classList.remove("show", "landscape-mode");
  const app = document.getElementById("app");
  if (state.view === "home") {
    app.innerHTML = renderHome();
    // Punkt 11: After home renders, check if we should suggest marking notes as done
    setTimeout(() => checkNoteSuggestionsAfterTermin(), 100);
  }
  else if (state.view === "wizard") app.innerHTML = renderWizard();
  else if (state.view === "preview") {
    app.innerHTML = renderPreviewToolbar();
    renderPrintView();
  }
  else if (state.view === "help") app.innerHTML = renderHelpView();
  else if (state.view === "anschreiben") app.innerHTML = renderAnschreibenView();
  else if (state.view === "belege") app.innerHTML = renderBelegeView();
  else if (state.view === "inbox") app.innerHTML = renderInboxView();
  else if (state.view === "import") app.innerHTML = renderImportView();
  else if (state.view === "settings") app.innerHTML = renderSettingsView();
  else if (state.view === "contacts") app.innerHTML = renderContactsView();
  else if (state.view === "briefHistory") app.innerHTML = renderBriefHistoryView();
  else if (state.view === "timeline") app.innerHTML = renderTimelineView();

  // Render modal overlay if open.
  // IMPORTANT: remove ALL existing overlays (not just one) - if duplicates ever
  // accumulated, a leftover invisible backdrop would block all clicks on the page.
  document.querySelectorAll("#modalOverlay").forEach(el => el.remove());
  // Clean up any orphaned signature modal that is no longer in use
  // (sig-modal is self-managed; if no signature callback is active it's orphaned)
  if (!window._sigCallback) {
    const orphanSig = document.getElementById("sig-modal");
    if (orphanSig) orphanSig.remove();
  }
  // Only ONE modal can be open at a time - use else-if so we never append two overlays
  let modalHtml = null;
  if (quickAddOpen) modalHtml = renderQuickAddModal();
  else if (onboardingActive) modalHtml = renderOnboardingModal();
  else if (resetModalOpen) modalHtml = renderResetModal();
  else if (avgCalcTarget) modalHtml = renderAvgCalculatorModal();
  else if (state.inboxModal) modalHtml = renderInboxModal();
  else if (state.extractedTextModal) modalHtml = renderExtractedTextModal();
  if (state.globalSearchOpen) modalHtml = (modalHtml || "") + renderGlobalSearchModal();
  if (state.addCustomTplOpen) modalHtml = (modalHtml || "") + renderAddCustomTplModal();
  if (state.confirmModal) modalHtml = (modalHtml || "") + renderConfirmModal();
  if (modalHtml) {
    const wrap = document.createElement("div");
    wrap.id = "modalOverlay";
    wrap.innerHTML = modalHtml;
    document.body.appendChild(wrap);
  }
  attachListeners();
  attachAutoFormatListeners();
}

// Auto-format listeners: applied to all date/time/hours fields after every render
function attachAutoFormatListeners() {
  document.querySelectorAll("[data-rowkey]").forEach(el => {
    const parts = el.dataset.rowkey.split("|");
    const colId = parts[2];
    if (/^(datum)$/.test(colId)) {
      el.addEventListener("blur", e => {
        const formatted = autoFormatDate(e.target.value);
        if (formatted !== e.target.value) {
          e.target.value = formatted;
          // Trigger input event so it gets saved
          e.target.dispatchEvent(new Event("input", { bubbles: true }));
        }
      });
    }
    if (/^(von|bis|uhrzeit)$/.test(colId)) {
      el.addEventListener("blur", e => {
        const formatted = autoFormatTime(e.target.value);
        if (formatted !== e.target.value) {
          e.target.value = formatted;
          e.target.dispatchEvent(new Event("input", { bubbles: true }));
        }
      });
    }
    // Auto-compute net hours from von/bis/pause for sozial.stunden
    if (parts[0] === "stunden" && /^(von|bis|pause)$/.test(colId)) {
      el.addEventListener("blur", () => {
        const idx = parseInt(parts[1], 10);
        const rows = state.docs.sozial?.rows?.stunden || [];
        const row = rows[idx];
        if (!row) return;
        // Only auto-fill if stunden field is empty
        if (row.stunden && row.stunden.toString().trim()) return;
        const computed = computeNetHours(row.von, row.bis, row.pause);
        if (computed) {
          row.stunden = computed;
          state.docs.sozial.rows.stunden = rows;
          debouncedSave();
          // Update the visible stunden input
          const stundenInput = document.querySelector(`[data-rowkey="stunden|${idx}|stunden"]`);
          if (stundenInput) stundenInput.value = computed;
        }
      });
    }
  });
}

  const fieldMap = CONTACT_SHARED_MAP[c.rolle];

function _readSyncField(f) {
  if (f.type === "shared") return state.shared?.[f.key] || "";
  if (f.type === "doc") return state.docs?.[f.docId]?.answers?.[f.key] || "";
  return "";
}
function _writeSyncField(f, value) {
  if (f.type === "shared") {
    state.shared = state.shared || {};
    state.shared[f.key] = value;
    Storage.set(SHARED_STORAGE_KEY, JSON.stringify(state.shared));
  } else if (f.type === "doc") {
    state.docs = state.docs || {};
    state.docs[f.docId] = state.docs[f.docId] || { answers:{}, rows:{}, attachments:{}, signatures:{} };
    state.docs[f.docId].answers = state.docs[f.docId].answers || {};
    state.docs[f.docId].answers[f.key] = value;
    if (DOCS[f.docId]) Storage.set(DOCS[f.docId].storageKey, JSON.stringify(state.docs[f.docId]));
  }
}

// Wird aufgerufen wenn EIN Feld in einer Gruppe geändert wird → propagiert
// auf alle anderen Felder in dieser Gruppe. Gibt die Anzahl der propagierten
// Änderungen zurück.
function propagateFieldChange(changedField, value) {
  let n = 0;
  DATA_SYNC_GROUPS.forEach(group => {
    // Ist das changed-Feld in dieser Gruppe?
    const inGroup = group.fields.some(f => 
      f.type === changedField.type &&
      (f.type === "shared" ? f.key === changedField.key : (f.docId === changedField.docId && f.key === changedField.key))
    );
    if (!inGroup) return;
    // Alle anderen Felder auf den neuen Wert setzen, falls sie sich unterscheiden
    group.fields.forEach(f => {
      if (f.type === changedField.type &&
          (f.type === "shared" ? f.key === changedField.key : (f.docId === changedField.docId && f.key === changedField.key))) {
        return; // Selbes Feld
      }
      const current = _readSyncField(f);
      if (current !== value) {
        _writeSyncField(f, value);
        n++;
      }
    });
  });
  return n;
}

// Beim App-Start: gleicht alle Sync-Gruppen einmal ab. Wenn in einer Gruppe
// ein nicht-leerer Wert existiert, werden alle leeren Felder damit gefüllt.
// Wenn mehrere unterschiedliche Werte existieren, gewinnt der erste nicht-leere.
function reconcileAllSyncGroups() {
  let changes = 0;
  DATA_SYNC_GROUPS.forEach(group => {
    const valuesWithSource = group.fields.map(f => ({ f, val: _readSyncField(f) })).filter(x => x.val);
    if (valuesWithSource.length === 0) return;
    // Wert wählen: erster nicht-leerer
    const winnerVal = valuesWithSource[0].val;
    group.fields.forEach(f => {
      const cur = _readSyncField(f);
      if (cur !== winnerVal && (!cur || cur === "")) {
        _writeSyncField(f, winnerVal);
        changes++;
      }
    });
  });
  return changes;
}

// Kontakt -> shared. Nur Felder des ersten Kontakts mit dieser Rolle werden
// als "primärer" Kontakt gespiegelt. Spätere Kontakte mit selber Rolle
// bleiben unverknüpft.
function syncContactToShared(contact) {
  if (!contact || !contact.rolle) return;
  const fieldMap = CONTACT_SHARED_MAP[contact.rolle];
  if (!fieldMap) return; // Rolle hat kein Mapping (z.B. "sonstige")
  const allOfRole = (state.contacts || []).filter(c => c.rolle === contact.rolle);
  if (allOfRole.length === 0 || allOfRole[0].id !== contact.id) return;
  state.shared = state.shared || {};
  let changed = false;
  Object.entries(fieldMap).forEach(([contactField, sharedKey]) => {
    const val = contact[contactField];
    if (val && state.shared[sharedKey] !== val) {
      state.shared[sharedKey] = val;
      changed = true;
    }
  });
  if (changed) {
    Storage.set(SHARED_STORAGE_KEY, JSON.stringify(state.shared));
  }
}

// shared -> Kontakt. Für jede Rolle im Mapping: Wenn die zugehörigen
// shared-Felder Werte haben aber kein Kontakt mit dieser Rolle existiert,
// einen anlegen. Wenn einer existiert: Werte synchronisieren (User-Änderungen
// in Stammdaten überschreiben den Kontakt — single source of truth).
function syncSharedToContacts() {
  if (!state.contacts) state.contacts = [];
  const s = state.shared || {};
  Object.entries(CONTACT_SHARED_MAP).forEach(([rolle, fieldMap]) => {
    // Werte aus shared sammeln
    const values = {};
    let anySet = false;
    Object.entries(fieldMap).forEach(([contactField, sharedKey]) => {
      if (s[sharedKey]) { values[contactField] = s[sharedKey]; anySet = true; }
    });
    if (!anySet) return; // Keine Stammdaten für diese Rolle -> nichts tun
    // Existierenden Kontakt finden (erster mit dieser Rolle)
    let contact = state.contacts.find(c => c.rolle === rolle);
    if (!contact) {
      contact = {
        id: "c_" + Date.now() + "_" + rolle.slice(0,3) + Math.random().toString(36).slice(2,4),
        rolle,
        name: values.name || "",
        firma: values.firma || "",
        email: values.email || "",
        telefon: values.telefon || "",
        anschrift: values.anschrift || "",
        notiz: "Automatisch aus Stammdaten erstellt",
      };
      state.contacts.unshift(contact);
    } else {
      // shared ist die "Quelle" — alle gesetzten Werte werden übernommen
      Object.entries(values).forEach(([contactField, val]) => {
        if (val) contact[contactField] = val;
      });
    }
  });
  saveContacts();
}

  } else {
    // Gruppiere nach Rolle
    const byRole = {};

// ── Web-Notifications (PWA Push für Termine) ─────────────────────────────
// Bittet einmalig um Permission, prüft regelmäßig die nächsten Termine und
// zeigt eine Browser-Notification 1 Stunde vorher. Persistent State im
// localStorage: bh_notif_enabled (true/false), bh_notif_shown (Map<termId,
// timestamp>) — damit derselbe Termin nicht wiederholt benachrichtigt wird.
const NOTIF_ENABLED_KEY = "bh_notif_enabled";
const NOTIF_SHOWN_KEY = "bh_notif_shown";
const NOTIF_CHECK_INTERVAL_MS = 5 * 60 * 1000; // alle 5 Minuten prüfen
const NOTIF_LEAD_MS = 60 * 60 * 1000; // 1h vor Termin benachrichtigen
let _notifCheckTimer = null;

function notifSupported() {
  return typeof window !== "undefined" && "Notification" in window;
}
function notifIsEnabled() {
  if (!notifSupported()) return false;
  if (Notification.permission !== "granted") return false;
  try { return localStorage.getItem(NOTIF_ENABLED_KEY) === "true"; } catch(e) { return false; }
}
async function enableNotifications() {
  if (!notifSupported()) { alert("Dein Browser unterstützt keine Benachrichtigungen."); return; }
  let perm = Notification.permission;
  if (perm === "default") {
    perm = await Notification.requestPermission();
  }
  if (perm !== "granted") {
    alert("Berechtigung nicht erteilt. Du kannst sie später in den Browser-Einstellungen anpassen.");
    return;
  }
  try { localStorage.setItem(NOTIF_ENABLED_KEY, "true"); } catch(e){}
  scheduleNotifChecks();
  showSaveToast("✓ Termin-Erinnerungen aktiviert");
  // Sofortige Test-Notification
  try { new Notification("Bewährungshilfe-Assistent", { body: "Erinnerungen für deine Termine sind jetzt aktiv.", icon: "/favicon.ico" }); } catch(e){}
  render();
}
function disableNotifications() {
  try { localStorage.setItem(NOTIF_ENABLED_KEY, "false"); } catch(e){}
  if (_notifCheckTimer) { clearInterval(_notifCheckTimer); _notifCheckTimer = null; }
  showSaveToast("Termin-Erinnerungen deaktiviert");
  render();
}
function _loadNotifShown() {
  try {
    const raw = localStorage.getItem(NOTIF_SHOWN_KEY);
    if (!raw) return {};
    return JSON.parse(raw) || {};
  } catch(e) { return {}; }
}
function _saveNotifShown(map) {
  try { localStorage.setItem(NOTIF_SHOWN_KEY, JSON.stringify(map)); } catch(e){}
}
function checkUpcomingTermineForNotif() {
  if (!notifIsEnabled()) return;
  const now = Date.now();
  const shown = _loadNotifShown();
  // Garbage-Collection: alte Einträge entfernen (>30 Tage alt)
  const cutoff = now - 30 * 24 * 60 * 60 * 1000;
  Object.keys(shown).forEach(k => { if (shown[k] < cutoff) delete shown[k]; });
  // Quellen durchsuchen
  const candidates = [];
  // BH-Termine
  (state.docs?.bhtermine?.rows?.termine || []).forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    if (!d) return;
    const [h, mi] = parseTimeStr(row.uhrzeit || "10:00");
    d.setHours(h ?? 10, mi ?? 0, 0, 0);
    candidates.push({ id: "bh-" + idx, time: d.getTime(), title: "BH-Termin", body: row.ort ? "Ort: " + row.ort : "" });
  });
  // Therapie-Termine
  (state.docs?.thera?.rows?.termine || []).forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    if (!d) return;
    const [h, mi] = parseTimeStr(row.uhrzeit || "10:00");
    d.setHours(h ?? 10, mi ?? 0, 0, 0);
    candidates.push({ id: "thera-" + idx, time: d.getTime(), title: "Therapie-Termin", body: row.art || "" });
  });
  // Sozialstunden
  (state.docs?.sozial?.rows?.eintraege || []).forEach((row, idx) => {
    if (!row.datum) return;
    const d = parseDateGuess(row.datum);
    if (!d) return;
    const [h, mi] = parseTimeStr(row.von || "08:00");
    d.setHours(h ?? 8, mi ?? 0, 0, 0);
    candidates.push({ id: "sozial-" + idx, time: d.getTime(), title: "Sozialstunden-Einsatz", body: row.taetigkeit || "" });
  });
  // Filter: Termine, die in den nächsten LEAD-Zeitraum fallen und noch nicht gezeigt
  candidates.forEach(c => {
    const diff = c.time - now;
    if (diff > 0 && diff <= NOTIF_LEAD_MS && !shown[c.id]) {
      try {
        const dt = new Date(c.time);
        const minutes = Math.round(diff / 60000);
        const when = minutes < 60 ? "in " + minutes + " Min" : "in " + Math.round(minutes/60) + "h";
        new Notification("⏰ " + c.title + " " + when, {
          body: c.body || (pad(dt.getHours()) + ":" + pad(dt.getMinutes()) + " — vergiss die Unterlagen nicht!"),
          icon: "/favicon.ico",
          tag: c.id,
        });
        shown[c.id] = now;
        _saveNotifShown(shown);
      } catch(e){}
    }
  });
}
function scheduleNotifChecks() {
  if (_notifCheckTimer) clearInterval(_notifCheckTimer);
  if (!notifIsEnabled()) return;
  // Sofort einen Check + danach periodisch
  setTimeout(() => checkUpcomingTermineForNotif(), 1000);
  _notifCheckTimer = setInterval(() => checkUpcomingTermineForNotif(), NOTIF_CHECK_INTERVAL_MS);
}

  return `

    state.terminPrep[key] = DEFAULT_PREP_ITEMS.map(t => ({ text: t, done: false }));
  }
  return state.terminPrep[key];
}

// Verfahrenskosten-Rechner: berechnet basierend auf Geldstrafe + bisherigen
// Zahlungen + Ratenhöhe, wie lange es noch dauert und wann's voraussichtlich
// abbezahlt ist. Wird auf der Home-Page und im Kosten-Doc angezeigt.
function computeKostenForecast() {
  const ans = state.docs.kosten?.answers || {};
  const zahlungen = state.docs.kosten?.rows?.zahlungen || [];
  const geldstrafe = parseMoney(ans["geldstrafe.betrag_gesamt"] || "");
  const gerichtskosten = parseMoney(ans["gerichtskosten.betrag_gesamt"] || "");
  const gesamt = geldstrafe + gerichtskosten;
  if (gesamt <= 0) return null;
  const gezahlt = zahlungen.reduce((s, r) => s + parseMoney(r.betrag || ""), 0);
  const rest = Math.max(0, gesamt - gezahlt);
  // Ratenhöhe — bevorzugt explizit, sonst Schnitt der letzten 3 Zahlungen
  let rateMonat = parseMoney(ans["geldstrafe.rate_hoehe"] || "") || parseMoney(ans["gerichtskosten.rate_hoehe"] || "");
  if (!rateMonat || rateMonat <= 0) {
    const recent = zahlungen.slice(-3).map(r => parseMoney(r.betrag || "")).filter(n => n > 0);
    if (recent.length > 0) rateMonat = recent.reduce((s, n) => s + n, 0) / recent.length;
  }
  const result = {
    gesamt, gezahlt, rest, rateMonat: rateMonat || 0,
    prozent: gesamt > 0 ? Math.round(gezahlt / gesamt * 100) : 0,
  };
  if (rateMonat > 0 && rest > 0) {
    result.monateRest = Math.ceil(rest / rateMonat);
    const endDate = new Date();
    endDate.setMonth(endDate.getMonth() + result.monateRest);
    result.endDatum = pad(endDate.getDate()) + "." + pad(endDate.getMonth()+1) + "." + endDate.getFullYear();
  }
  return result;
}

function renderKostenForecastCard() {
  const f = computeKostenForecast();
  if (!f || f.gesamt <= 0) return "";
  // Knapp: wenn abbezahlt, freundlicher Status; sonst Rest + Prognose
  if (f.rest <= 0) {
    return `<div style="background:rgba(91,165,114,0.15); border:1px solid var(--accent); border-radius:10px; padding:12px 14px; margin-top:12px;">
      <div style="font-size:13px;">✅ <strong>Verfahrenskosten vollständig abbezahlt!</strong> ${moneyOnly(f.gesamt)} € von ${moneyOnly(f.gesamt)} €.</div>
    </div>`;
  }
  const forecast = (f.monateRest && f.endDatum)
    ? `Bei <strong>${moneyOnly(f.rateMonat)} €</strong>/Monat noch <strong>${f.monateRest} ${f.monateRest === 1 ? "Monat" : "Monate"}</strong>, voraussichtliches Ende: <strong>${esc(f.endDatum)}</strong>.`
    : `Trag Ratenhöhe oder mache Zahlungen ein, damit ich eine Prognose machen kann.`;
  return `
    <div style="background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-top:12px;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
        <span style="font-size:18px;">💸</span>
        <strong style="font-size:13px;">Verfahrenskosten-Stand</strong>
        <span style="margin-left:auto; font-size:12px; color:var(--text-soft);">${f.prozent}% bezahlt</span>
      </div>
      <div style="width:100%; height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin-bottom:8px;">
        <div style="height:100%; background:var(--accent); width:${f.prozent}%; transition: width .3s;"></div>
      </div>
      <div style="font-size:12px; color:var(--text-soft);">
        Bezahlt: <strong>${moneyOnly(f.gezahlt)} €</strong> von ${moneyOnly(f.gesamt)} € · Rest: <strong>${moneyOnly(f.rest)} €</strong>
      </div>
      <div style="font-size:12px; color:var(--text-soft); margin-top:6px;">${forecast}</div>
    </div>`;
}

function computeAchievements() {
  const out = {
    bhWahrgenommen: 0, bhAbgesagt: 0, bhTotal: 0,
    sozialStunden: 0, sozialEintraege: 0,
    schadensZahlungen: 0, schadensSumme: 0,
    kostenZahlungen: 0, kostenSumme: 0,
    therapieBesucht: 0,
    streak: 0, streakAktiv: false,
  };
  // BH-Termine: status-spalte enthaelt "wahrgenommen" / "abgesagt"
  const bhRows = state.docs.bhtermine?.rows?.termine || [];
  bhRows.forEach(r => {
    const s = (r.status || "").toLowerCase();
    if (s.includes("wahrgenommen")) out.bhWahrgenommen++;
    else if (s.includes("abgesagt") || s.includes("nicht")) out.bhAbgesagt++;
    if (r.datum) out.bhTotal++;
  });
  // Sozialstunden: Summe der stunden-Spalte (Format wie "4,5" oder "4.5")
  const sozRows = state.docs.sozial?.rows?.stunden || [];
  sozRows.forEach(r => {
    const h = parseFloat(String(r.stunden || "").replace(",", "."));
    if (!isNaN(h) && h > 0) { out.sozialStunden += h; out.sozialEintraege++; }
  });
  // Zahlungen Schadenswiedergutmachung
  const schZ = state.docs.schadens?.rows?.zahlungen || [];
  schZ.forEach(r => {
    if (!r.betrag) return;
    const n = parseMoney(r.betrag); if (n > 0) { out.schadensSumme += n; out.schadensZahlungen++; }
  });
  // Zahlungen Verfahrenskosten
  const kosZ = state.docs.kosten?.rows?.zahlungen || [];
  kosZ.forEach(r => {
    if (!r.betrag) return;
    const n = parseMoney(r.betrag); if (n > 0) { out.kostenSumme += n; out.kostenZahlungen++; }
  });
  // Therapie-Termine: alle vergangenen, nicht abgesagten
  const therRows = state.docs.thera?.rows?.termine || [];
  therRows.forEach(r => {
    if (!r.datum || !isDateInPast(r.datum)) return;
    const s = (r.status || "").toLowerCase();
    if (s.includes("abgesagt") || s.includes("nicht")) return;
    out.therapieBesucht++;
  });
  // BH-Streak: aufeinanderfolgende wahrgenommene Termine ab dem juengsten
  const pastBh = bhRows
    .map(r => ({ ...r, _d: r.datum ? parseDateGuess(r.datum) : null }))
    .filter(r => r._d && isDateInPast(r.datum))
    .sort((a, b) => b._d - a._d);
  for (const r of pastBh) {
    const s = (r.status || "").toLowerCase();
    if (s.includes("wahrgenommen")) { out.streak++; out.streakAktiv = true; }
    else if (s.includes("abgesagt") || s.includes("nicht")) break;
    else break; // unbekannter Status zaehlt nicht als Fortfuehrung
  }
  return out;
}

  items.push({

    done: docsStarted > 0,

  });
  // Schritt 6: Backup einmal gemacht

    action: "exportAllData()",
    actionLabel: "💾 Jetzt sichern",

  // Schritt 7: PIN-Schutz aktiviert (optional, aber empfohlen)
  let hasPin = false;
  try { hasPin = !!localStorage.getItem(PIN_STORAGE_KEY); } catch(e){}
  items.push({

    done: notifIsEnabled(),
    optional: true,

  });
  return items;
}
function isSetupChecklistDismissed() {
  try { return localStorage.getItem(SETUP_CHECKLIST_KEY) === "1"; } catch(e) { return false; }
}
function dismissSetupChecklist() {
  try { localStorage.setItem(SETUP_CHECKLIST_KEY, "1"); } catch(e){}
  render();
}
function unDismissSetupChecklist() {
  try { localStorage.removeItem(SETUP_CHECKLIST_KEY); } catch(e){}
  render();
}
function renderSetupChecklist() {
  const items = computeSetupChecklist();
  const required = items.filter(i => !i.optional);
  const requiredDone = required.filter(i => i.done).length;
  const total = required.length;
  const allRequiredDone = requiredDone === total;
  // Wenn alles Required erledigt UND user hat dismissed: nichts zeigen
  if (allRequiredDone && isSetupChecklistDismissed()) return "";

    const optionalOpen = items.filter(i => i.optional && !i.done).length;

  const itemsHtml = items.map(item => {
    const cls = item.done ? "done" : "open";
    const optLabel = item.optional ? `<span style="font-size:10px; padding:1px 6px; background:var(--bg); border-radius:5px; color:var(--text-soft); margin-left:6px;">optional</span>` : "";
    return `
      <div style="display:flex; gap:10px; align-items:center; padding:7px 0; ${item.done ? 'opacity:0.6;' : ''}">
        <span style="width:22px; height:22px; border-radius:50%; border:2px solid ${item.done ? 'var(--accent)' : 'var(--border)'}; background:${item.done ? 'var(--accent)' : 'transparent'}; color:${item.done ? '#fff' : 'transparent'}; display:inline-flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;">${item.done ? '✓' : ''}</span>
        <span style="flex:1; font-size:13px; ${item.done ? 'text-decoration:line-through;' : ''}">${esc(item.label)}${optLabel}</span>
        ${!item.done ? `<button class="btn btn-secondary" style="font-size:11px; padding:4px 10px;" onclick="${item.action}">${esc(item.actionLabel)}</button>` : ""}
      </div>`;
  }).join("");
  const pctDone = total > 0 ? Math.round(requiredDone / total * 100) : 0;
  return `
    <details ${requiredDone < 2 ? "open" : ""} style="background:var(--card); border:1px solid var(--border); border-radius:12px; padding:0; margin-top:14px;">

        <span style="flex:1; min-width:140px;">
          <strong style="font-size:14px;">Erste Schritte</strong>
          <div style="font-size:11px; color:var(--text-soft); margin-top:2px;">${requiredDone} von ${total} erledigt</div>
        </span>
        <span style="width:100px; height:6px; background:var(--bg); border-radius:3px; overflow:hidden;"><span style="display:block; height:100%; background:var(--accent); width:${pctDone}%; transition: width .3s;"></span></span>
        <span style="font-size:12px; color:var(--text-soft); min-width:38px; text-align:right;">${pctDone}%</span>
      </summary>
      <div style="padding:4px 16px 12px;">${itemsHtml}</div>
