  if (i >= 0) arr.splice(i, 1);
  else arr.push(id);
  render();
}

// Liefert das HTML, das ein Anhang im Druck-Fenster ergibt. Für Bilder direkt
// die DataUrl, für PDFs gerendert als Page-Images (PDF.js), für komplette Docs
// das jeweilige renderPrintXxx().
async function renderAttachmentForPrint(att) {
  if (att.kind === "attachment") {
    const ds = state.docs[att.docId];
    if (!ds || !ds.attachments || !ds.attachments[att.secId] || !ds.attachments[att.secId][att.rowIdx]) return "";
    const a = ds.attachments[att.secId][att.rowIdx].find(x => x.id === att.attId);
    if (!a) return "";
    if (a.type === "image") {
      return `<div style="page-break-before:always; margin-top:20pt;">
        <div style="font-size:10pt; color:#555; margin-bottom:6pt; font-style:italic;">Anhang: ${esc(a.name || "")} · ${esc(att.sub)}</div>
        <img src="${a.dataUrl}" style="max-width:100%; max-height:25cm; object-fit:contain; border:1px solid #ddd;" />
      </div>`;
    } else if (a.type === "pdf") {
      try {
        const pages = await renderPdfAttachmentToPageImages(a, { scale: 1.5, quality: 0.78 });
        if (pages.length === 0) {
          return `<div style="page-break-before:always; margin-top:20pt; font-style:italic;">Anhang ${esc(a.name)} konnte nicht eingebettet werden.</div>`;
        }
        const imgs = pages.map((p, idx) => `<img src="${p.dataUrl}" style="display:block; max-width:100%; ${idx > 0 ? 'page-break-before:always;' : ''} margin:8pt 0;" />`).join("");
        return `<div style="page-break-before:always; margin-top:20pt;">
          <div style="font-size:10pt; color:#555; margin-bottom:6pt; font-style:italic;">Anhang: ${esc(a.name || "")} · ${esc(att.sub)}</div>
          ${imgs}
        </div>`;
      } catch(e) {
        return `<div style="page-break-before:always; margin-top:20pt; font-style:italic;">Anhang ${esc(a.name)}: ${esc(e.message)}</div>`;
      }
    }
  } else if (att.kind === "doc") {
    // Komplettes Dokument als HTML einbetten — nutzt die existierenden Render-
    // Funktionen für die Druckansicht, die auch beim normalen Drucken laufen.
    const docId = att.docId;
    const renderFnName = "renderPrint" + docId.charAt(0).toUpperCase() + docId.slice(1);
    const renderFn = window[renderFnName];
    if (typeof renderFn !== "function") {
      return `<div style="page-break-before:always; margin-top:20pt; font-style:italic;">Dokument ${docId} konnte nicht eingebettet werden.</div>`;
    }
    try {
      let html = renderFn();
      // Anhang-Trenner + Beschriftung
      const docDef = DOCS[docId];
      return `<div style="page-break-before:always; margin-top:20pt;">
        <div style="border-bottom:2px solid #333; padding-bottom:8pt; margin-bottom:14pt;">
          <div style="font-size:11pt; color:#555;">Anhang</div>
          <div style="font-size:14pt; font-weight:bold;">${esc((docDef?.icon || "") + " " + (docDef?.title || docId))}</div>
        </div>
        ${html}
      </div>`;
    } catch(e) {
      return `<div style="page-break-before:always; margin-top:20pt; font-style:italic;">Fehler beim Einbetten von ${docId}: ${esc(e.message)}</div>`;
    }
  }
  return "";
}

async function printAnschreiben() {
  const ta = document.getElementById("anschreiben-textarea");
  if (!ta) return;
  const text = ta.value;
  const tpl = ANSCHREIBEN_TEMPLATES[activeAnschreiben];

  // Validierungs-Hinweis: leere Platzhalter (____) im Brieftext erkennen
  const placeholderCount = (text.match(/_{3,}/g) || []).length;
  if (placeholderCount > 0) {
    confirmAction({
      title: "Platzhalter im Brief?",
      message: "Der Brief enthält noch " + placeholderCount + " Platzhalter (____) — typischerweise Stellen, die du noch ausfüllen musst.\n\nTrotzdem drucken?",
      confirmLabel: "🖨 Trotzdem drucken",
      danger: false,
      onConfirm: () => { _doPrintAnschreiben(text, tpl); },
    });
    return;
  }
  await _doPrintAnschreiben(text, tpl);
}

// Inline-Print statt Pop-up — vermeidet Browser-Blocker und funktioniert auch
// als PWA. Inhalt wird ins aktuelle Dokument injiziert; @media print blendet
// alles andere aus. Nach dem Drucken wird der Inhalt wieder entfernt.
async function _doPrintAnschreiben(text, tpl) {
  // Anhänge bauen, falls welche ausgewählt
  const selectedIds = getSelectedAttachmentIds();
  let attachmentsHtml = "";
  if (selectedIds.size > 0) {
    const available = getAvailableAttachments();
    const selected = available.filter(a => selectedIds.has(a.id));
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:99999; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px;";
    overlay.innerHTML = '<div style="background:#1e3a5f; padding:24px 36px; border-radius:12px; text-align:center;"><div style="font-size:32px;">📎</div><div style="margin-top:10px;">Bereite Anhänge vor (' + selected.length + ')…</div></div>';
    document.body.appendChild(overlay);
    try {
      const parts = [];
      for (const att of selected) parts.push(await renderAttachmentForPrint(att));
      attachmentsHtml = parts.join("");
    } finally {
      document.body.removeChild(overlay);
    }
  }

  // Print-Container ins DOM injizieren
  const oldContainer = document.getElementById("inline-print-container");
  if (oldContainer) oldContainer.remove();
  const container = document.createElement("div");
  container.id = "inline-print-container";
  container.innerHTML =
    '<div class="brief-text">' + esc(text) + '</div>' +
    getBriefSignatureHtml() +
    (attachmentsHtml ? '<div class="attachments-area">' + attachmentsHtml + '</div>' : "");
  document.body.appendChild(container);

  // Doc-Title temporär ändern damit PDF-Filename passt
  const oldTitle = document.title;
  document.title = tpl.title + " — " + (state.shared?.name || "");

  // Drucken — Browser-eigener Dialog
  try {
    window.print();
  } catch(e) {
    alert("Drucken fehlgeschlagen: " + e.message);
  }

  // Nach Druckdialog (ob OK oder Abbruch): aufräumen
  setTimeout(() => {
    document.title = oldTitle;
    const c = document.getElementById("inline-print-container");
    if (c) c.remove();
  }, 500);

  if (activeAnschreiben) recordBriefSent(activeAnschreiben, "drucken");
}

// Form-mode printing: rendert das Formular-HTML (mit Checkboxen, Linien etc.)
// in ein eigenes Fenster und löst den Druck aus. Im Gegensatz zu printAnschreiben
// wird hier HTML markup beibehalten (nicht als Plain-Text escaped).

  const tpl = ANSCHREIBEN_TEMPLATES[activeAnschreiben];

  // Daten-Dict frisch aus aktuellem State bauen — gleich wie in renderAnschreibenView
  const d = buildAnschreibenDataDict();
  // Druck-Version: editable=false, also Spans statt Inputs
  const printHtml = renderErklaerungFormHtml(d, false);

  // Anhänge sammeln (wie in printAnschreiben)
  const selectedIds = getSelectedAttachmentIds();
  let attachmentsHtml = "";
  if (selectedIds.size > 0) {
    const available = getAvailableAttachments();
    const selected = available.filter(a => selectedIds.has(a.id));
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:99999; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px;";
    overlay.innerHTML = '<div style="background:#1e3a5f; padding:24px 36px; border-radius:12px; text-align:center;"><div style="font-size:32px;">📎</div><div style="margin-top:10px;">Bereite Anhänge vor (' + selected.length + ')…</div></div>';
    document.body.appendChild(overlay);
    try {
      const parts = [];
      for (const att of selected) parts.push(await renderAttachmentForPrint(att));
      attachmentsHtml = parts.join("");
    } finally {
      document.body.removeChild(overlay);
    }
  }

  // Inline-Print statt Pop-up (siehe _doPrintAnschreiben)
  const oldContainer = document.getElementById("inline-print-container");
  if (oldContainer) oldContainer.remove();
  const container = document.createElement("div");
  container.id = "inline-print-container";
  container.classList.add("formular-print");
  container.innerHTML = printHtml + getBriefSignatureHtml() + attachmentsHtml;
  document.body.appendChild(container);

  const oldTitle = document.title;
  document.title = (tpl?.title || "Formular") + " — " + (state.shared?.name || "");

  try { window.print(); } catch(e) { alert("Drucken fehlgeschlagen: " + e.message); }

  setTimeout(() => {
    document.title = oldTitle;
    const c = document.getElementById("inline-print-container");
    if (c) c.remove();
  }, 500);

  if (activeAnschreiben) recordBriefSent(activeAnschreiben, "drucken");
}

// Wird vom oninput-Handler der Formular-Inputs aufgerufen. Mapped den
// Form-Feldnamen auf den richtigen Storage-Slot (state.shared / state.docs.*)
// und speichert dort. Re-render ist NICHT nötig — die anderen Felder hängen
// nicht direkt voneinander ab; falls doch, machen wir's beim nächsten Open.
// Debounced über setTimeout damit nicht bei jedem Tastendruck synchron zur
// localStorage geschrieben wird (kann auf Mobile spürbar ruckeln).
const _erklSaveTimers = {};
function saveErklaerungField(fieldKey, value) {
  if (!fieldKey) return;
  // Direkt im State speichern (synchron — kein UI-Flicker)
  const mapping = {
    // Stammdaten (state.shared)
    name:        { type: "shared", key: "name" },
    geb:         { type: "shared", key: "geburtsdatum" },
    anschrift:   { type: "shared", key: "anschrift" },
    tel:         { type: "shared", key: "telefon" },
    // Kosten / Erklaerung wirtschaftliche Verhaeltnisse
    k_az_kasse:           { type: "doc", docId: "kosten", key: "verfahren.az_landesjustizkasse" },
    k_arbeitgeber:        { type: "doc", docId: "kosten", key: "erklaerung_wirtschaft.arbeitgeber" },
    k_ehe_einkommen:      { type: "doc", docId: "kosten", key: "erklaerung_wirtschaft.ehe_einkommen" },
    k_ev_gericht:         { type: "doc", docId: "kosten", key: "erklaerung_wirtschaft.ev_gericht" },
    k_ev_aktenzeichen:    { type: "doc", docId: "kosten", key: "erklaerung_wirtschaft.ev_aktenzeichen" },
    k_ausgaben_freitext:  { type: "doc", docId: "kosten", key: "erklaerung_wirtschaft.ausgaben_freitext" },
    k_sonstiges:          { type: "doc", docId: "kosten", key: "erklaerung_wirtschaft.sonstiges" },
    leistung_behoerde:    { type: "doc", docId: "kosten", key: "erklaerung_wirtschaft.leistung_behoerde" },
    leistung_betrag_override: { type: "doc", docId: "kosten", key: "erklaerung_wirtschaft.leistung_betrag_override" },
    kinder_alter:         { type: "doc", docId: "kosten", key: "erklaerung_wirtschaft.kinder_alter" },
    // EAR
    ear_lohn:    { type: "doc", docId: "ear", key: "arbeit.lohn" },
    kinder:      { type: "doc", docId: "ear", key: "personal.kinder" },
  };
  const m = mapping[fieldKey];
  if (!m) {
    console.warn("saveErklaerungField: unbekanntes Feld " + fieldKey);
    return;
  }
  if (m.type === "shared") {
    state.shared[m.key] = value;
    // Debounced Storage-Save
    clearTimeout(_erklSaveTimers.shared);
    _erklSaveTimers.shared = setTimeout(() => {
      Storage.set(SHARED_STORAGE_KEY, JSON.stringify(state.shared));
    }, 300);
  } else if (m.type === "doc") {
    const ds = state.docs[m.docId];
    if (!ds) return;
    if (!ds.answers) ds.answers = {};
    ds.answers[m.key] = value;
    clearTimeout(_erklSaveTimers[m.docId]);
    _erklSaveTimers[m.docId] = setTimeout(() => {
      const sk = DOCS[m.docId] && DOCS[m.docId].storageKey;
      if (sk) Storage.set(sk, JSON.stringify(ds));
    }, 300);
  }
}

// Email an Anschreiben directly (mailto)
function emailAnschreiben() {
  const ta = document.getElementById("anschreiben-textarea");
  if (!ta) return;
  const tpl = ANSCHREIBEN_TEMPLATES[activeAnschreiben];
  const subject = `${tpl.title}${state.shared.name ? " - " + state.shared.name : ""}${state.shared.aktenzeichen ? " (Az. " + state.shared.aktenzeichen + ")" : ""}`;
  const url = `mailto:${encodeURIComponent(state.shared.bh_email || "")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(ta.value)}`;
  window.location.href = url;
  if (activeAnschreiben) recordBriefSent(activeAnschreiben, "email");
}

function renderWizard() {
  const doc = DOCS[state.activeDocId];
  const ds = getDocState();
  // Defensive: clamp index in case it's out of bounds
  if (ds.currentIdx >= doc.sections.length || ds.currentIdx < 0) ds.currentIdx = 0;
  const sec = doc.sections[ds.currentIdx];
  const totalSec = doc.sections.length;
  const progress = (ds.currentIdx / (totalSec - 1)) * 100;

  let body = "";
  if (sec.type === "review") body = renderReview(doc);
  else if (sec.type === "info") body = renderFieldsSection(sec, "info");
  else if (sec.type === "money") body = renderFieldsSection(sec, "money");
  else if (sec.type === "freetext") body = renderFieldsSection(sec, "freetext");
  else if (sec.type === "rows") body = renderRowsSection(sec);
  else if (sec.type === "checkboxes") body = renderCheckboxSection(sec);
  else if (sec.type === "signatures") body = renderSignaturesSection(sec, doc);

  return `
    <div class="header">
      <div>
        <h1>${doc.icon} ${doc.title}</h1>
        <div class="sub">Schritt ${ds.currentIdx + 1} von ${totalSec}</div>
      </div>
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <div class="save-indicator ${saveStatus}" id="saveInd">
          <span class="dot"></span><span id="saveTxt">${saveStatus === "saving" ? "Speichert..." : saveStatus === "saved" ? "Gespeichert" : "Fehler"}</span>
        </div>
        <button class="btn btn-secondary" onclick="goHome()">← Zur Übersicht</button>
        <button class="reset-btn" onclick="resetActiveDoc()">Dokument zurücksetzen</button>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div style="height:14px"></div>
    <div class="layout">
      <aside class="sidebar">
        <h3>Abschnitte</h3>
        <ul>
          ${doc.sections.map((s, i) => {
            const st = sectionStatus(s);
            return `<li class="${i === ds.currentIdx ? 'active' : ''} ${st}" onclick="jumpTo(${i})">
              <span class="check">${st === "done" ? "✓" : st === "partial" ? "·" : ""}</span>
              <span>${s.icon} ${s.title}</span>
            </li>`;
          }).join("")}
        </ul>
      </aside>
      <main class="main">
        <div class="section-head">
          <h2>${sec.icon} ${sec.title}</h2>
          ${sec.hint ? `<div class="meta">${esc(sec.hint)}</div>` : (sec.type === "money" ? `<div class="meta">Beträge in Euro - monatlicher Durchschnitt. Was nicht zutrifft, mit „Nicht zutreffend" markieren.</div>` : "")}
        </div>
        ${state.activeDocId === "kosten" ? `
          <div style="background:rgba(217, 119, 6, 0.08); border:1px solid var(--warn); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px;">
            ⚖️ <strong>Wichtiger Hinweis:</strong> Bei größeren Beträgen oder finanziellen Engpässen wende dich an eine <strong>Schuldnerberatung</strong> (kostenlos: Caritas, Diakonie, Verbraucherzentrale) oder einen Anwalt. Diese App hilft dir bei der Übersicht und beim Aufsetzen von Anträgen, ersetzt aber keine individuelle Beratung.
          </div>
          <div style="background:var(--primary-soft); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px;">
            💡 <strong>Tipp – nicht verwechseln:</strong> Geldauflagen an Geschädigte oder gemeinnützige Einrichtungen gehören in das Dokument <strong>„💶 Schadenswiedergutmachung"</strong>. Hier in <strong>„💸 Verfahrenskosten"</strong> erfasst du Gerichtskosten, Geldstrafe (Tagessätze), Anwaltskosten und Gutachterkosten. Das sind unterschiedliche Sachen, auch wenn beides „nach dem Verfahren zu zahlen" ist.
          </div>` : ""}
        ${state.activeDocId === "asservate" ? `
          <div style="background:rgba(217, 119, 6, 0.08); border:1px solid var(--warn); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px;">
            ⚖️ <strong>Wichtiger Hinweis:</strong> Diese App ist <strong>kein Ersatz für anwaltlichen Rat</strong>. Sie hilft dir, deine Daten zu organisieren und einen formal sauberen Antrag auf Herausgabe (§ 111n StPO) zu formulieren. Bei strittigen Fällen, drohender Einziehung oder Unklarheiten zur Rechtslage solltest du eine:n Strafverteidiger:in einschalten. Auch die Staatsanwaltschaft selbst darf rechtlich nicht beraten.
          </div>
          <div style="background:var(--primary-soft); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px;">
            💡 <strong>Tipp:</strong> Mache von deinem <strong>Beschlagnahme-Protokoll Fotos</strong> und hänge sie bei den jeweiligen Gegenständen an. Such dir auch <strong>Kaufbelege</strong> raus (z.B. aus E-Mails, Online-Shops) - das sind die wichtigsten Eigentumsnachweise. Je früher du das machst, desto einfacher wird der spätere Antrag.
          </div>` : ""}
        ${body}
        ${renderNav(doc, sec)}
      </main>

  `;
}

function renderFieldsSection(sec, type) {
  let html = "";
  if (type === "money") {
    const t = totalsBySide();
    const hhPart = t.einHH > 0 ? ` (+ ${formatMoney(t.einHH)} weitere Haushaltsmitglieder)` : "";
    html += `<div class="info-box">Aktuell: <strong>${formatMoney(t.ein)}</strong> deine Einnahmen${hhPart} · <strong>${formatMoney(t.aus)}</strong> Ausgaben → Saldo <strong style="color:${t.saldo >= 0 ? 'var(--accent)' : 'var(--danger)'}">${formatMoney(t.saldo)}</strong></div>`;
  }
  sec.fields.forEach(f => {
    const a = getAnswer(sec.id, f.id);
    const skipped = isSkipped(a);
    const value = valueOf(a);
    const isText = f.type === "text" || f.type === "date" || (!f.type && type === "info");
    const isArea = f.type === "textarea";
    const inputCls = (skipped ? "skipped" : "") + (isText ? " text-field" : "");
    const inputType = f.type === "date" ? "date" : "text";
    const placeholder = type === "money" ? "0,00" : "";
    // Spellcheck: on for text/textarea (uses browser's German dictionary via <html lang="de">),
    // off for money fields (would falsely flag numbers) and date fields (no need).
    const isMoney = type === "money";
    const isDate = f.type === "date";
    const spellAttrs = isMoney || isDate
      ? `spellcheck="false" inputmode="${isMoney ? "decimal" : "text"}"`
      : `spellcheck="true" lang="de" autocapitalize="sentences"`;
    const inputHtml = isArea
      ? `<textarea data-fkey="${sec.id}.${f.id}" class="${inputCls}" rows="6" style="width:100%; min-height:140px; resize:vertical;" ${spellAttrs} ${skipped ? "disabled" : ""}>${esc(value)}</textarea>`
      : `<input data-fkey="${sec.id}.${f.id}" type="${inputType}" class="${inputCls}" value="${esc(value)}" placeholder="${placeholder}" ${spellAttrs} ${skipped ? "disabled" : ""} />`;
    const currency = type === "money" ? `<span class="currency">€</span>` : "";
    // Average calculator button - only for money fields (helps with 3-month averaging)
    const avgBtn = (type === "money" && !skipped)
      ? `<button class="avg-calc-btn" onclick="openAvgCalculator('${sec.id}','${f.id}')" title="Durchschnitt aus mehreren Monaten berechnen">Ø Mittelwert</button>`
      : "";
    html += `
      <div class="field ${skipped ? 'skipped' : ''}">
        <label>${esc(f.label)}${f.shared ? ' <span title="Wird in allen Dokumenten geteilt" style="color:var(--primary); font-size:11px;">🔗</span>' : ''}</label>
        <div class="field-input-wrap">
          ${inputHtml}${currency}
          <button class="skip-btn ${skipped ? 'active' : ''}" onclick="toggleSkip('${sec.id}','${f.id}')">${skipped ? '↶ Doch eintragen' : '✕ Nicht zutreffend'}</button>
        </div>
        ${avgBtn}
      </div>`;
  });
  return html;
}

function renderRowsSection(sec) {
  const rows = getRows(sec.id);
  const searchTerm = getRowSearch(sec.id);
  // Show search bar if there are 4+ rows
  let html = "";

  // Detect if this section holds appointments/payments worth calendar-exporting
  const docId = state.activeDocId;
  const isAppointmentSection = (
    (docId === "thera" && sec.id === "termine") ||
    (docId === "sozial" && sec.id === "stunden") ||
    (docId === "bhtermine" && sec.id === "termine") ||
    (docId === "schadens" && sec.id === "zahlungen") ||
    (docId === "kosten" && sec.id === "zahlungen")
  );

  // Bulk calendar export button when there are at least 1 row with date
  if (isAppointmentSection && rows.some(r => r.datum)) {
    html += `
      <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
        <button class="btn-secondary" onclick="exportAllToCalendar('${docId}', '${sec.id}')" style="font-size:13px; padding:6px 14px;" title="Alle zukünftigen Einträge mit Datum als .ics-Datei exportieren">📲 Alle Termine exportieren</button>
      </div>`;
  }

  if (rows.length >= 4) {
    const matchCount = rows.filter(r => rowMatchesSearch(r, searchTerm)).length;
    html += `
      <div class="row-search">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Einträge durchsuchen..." value="${esc(searchTerm)}"
          oninput="setRowSearch('${sec.id}', this.value); applySearchFilter('${sec.id}', this.value); updateSearchInfo('${sec.id}');" />
        ${searchTerm ? `<button class="clear-search" onclick="setRowSearch('${sec.id}', ''); render();" title="Suche zurücksetzen">✕</button>` : ""}
      </div>
      ${searchTerm ? `<div class="row-search-info" id="search-info-${sec.id}">${matchCount} von ${rows.length} Einträgen passen</div>` : ""}
    `;
  }
  html += `<div class="rows-section">`;
  if (rows.length === 0) {
    html += `<div style="text-align:center; padding:30px; color:var(--text-soft); font-size:14px;">Noch keine Einträge. Klick unten auf „Eintrag hinzufügen“ um den ersten zu erstellen.</div>`;
  }
  rows.forEach((row, idx) => {
    const visible = rowMatchesSearch(row, searchTerm);
    let cols = "";
    sec.columns.forEach(col => {
      // Disable spellcheck for clearly numeric/date columns
      const numericLike = /^(betrag|datum|von|bis|uhrzeit|dauer|pause|stunden)$/.test(col.id);
      const spellAttrs = numericLike
        ? `spellcheck="false"`
        : `spellcheck="true" lang="de" autocapitalize="sentences"`;
      const isTextarea = col.type === "textarea";
      const fieldClass = isTextarea ? "field-mini field-mini-wide" : "field-mini";
      const inputEl = isTextarea
        ? `<textarea data-rowkey="${sec.id}|${idx}|${col.id}" rows="2" placeholder="${esc(col.placeholder || "")}" ${spellAttrs}>${esc(row[col.id] || "")}</textarea>`
        : `<input data-rowkey="${sec.id}|${idx}|${col.id}" type="text" value="${esc(row[col.id] || "")}" placeholder="${esc(col.placeholder || "")}" ${spellAttrs} />`;
      cols += `
        <div class="${fieldClass}">
          <label>${esc(col.label)}</label>
          ${inputEl}
        </div>`;
    });
    let pastMarker = "";
    if (row.datum && isDateInPast(row.datum)) {
      // Show status if available (BH-Termine has 'status' column)
      const status = (row.status || "").toLowerCase();
      if (status.includes("wahrgenommen")) {
        pastMarker = `<span class="past-marker attended">✓ wahrgenommen</span>`;
      } else if (status.includes("abgesagt") || status.includes("nicht")) {
        pastMarker = `<span class="past-marker cancelled">✕ abgesagt</span>`;
      } else {
        pastMarker = `<span class="past-marker">vergangen</span>`;
      }
    }
    let attachmentsHtml = "";
    if (sec.hasAttachments) {
      const atts = getAttachments(sec.id, idx);
      let attList = "";
      atts.forEach(att => {
        const sizeKb = (att.size / 1024).toFixed(0);
        const preview = att.type === "image"
          ? `<img src="${att.dataUrl}" alt="${esc(att.name)}" onclick="viewAttachment('${sec.id}', ${idx}, '${att.id}')" />`
          : `<div class="pdf-icon" onclick="viewAttachment('${sec.id}', ${idx}, '${att.id}')" style="cursor:pointer">📄</div>`;
        // OCR: pro Anhang ein Knopf, der den erkannten Text speichert. Bei
        // laufender OCR Spinner-Chip; nach Abschluss klickbarer Text-Knopf.
        let ocrUi = "";
        if (att.ocrRunning) {
          ocrUi = `<span class="att-action-btn" style="background:rgba(59,130,246,0.15); color:#1e40af; cursor:default;" title="OCR läuft…">⟳</span>`;
        } else if (att.extractedText) {
          ocrUi = `<button class="att-action-btn" onclick="viewExtractedText('${sec.id}', ${idx}, '${att.id}')" title="OCR-Text anzeigen (${att.extractedText.length} Zeichen)" style="background:rgba(110,231,183,0.2); color:#166534;">📝</button>`;
        } else {
          ocrUi = `<button class="att-action-btn" onclick="startOcrForDocAttachment('${sec.id}', ${idx}, '${att.id}')" title="Text per OCR auslesen">🔍</button>`;
        }
        attList += `
          <div class="attachment-item">
            ${preview}
            <div class="name" title="${esc(att.name)}">${esc(att.name)}</div>
            <div class="size">${sizeKb} KB</div>
            <div style="display:flex; gap:2px; margin-top:2px; flex-wrap:wrap;">
              ${ocrUi}
              <button class="att-action-btn" onclick="downloadAttachment('${sec.id}', ${idx}, '${att.id}')" title="Beleg runterladen">⬇</button>
              <button class="att-action-btn" onclick="shareAttachment('${sec.id}', ${idx}, '${att.id}')" title="Beleg teilen / per Mail senden">📤</button>
            </div>
            <button class="delete" onclick="deleteAttachment('${sec.id}', ${idx}, '${att.id}')" title="Beleg entfernen">✕</button>
          </div>`;
      });
      attachmentsHtml = `
        <div class="attachments-area">
          <div class="attachment-list">${attList}</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <label class="attach-upload-btn">
              📎 Datei anhängen

            </label>
            <label class="attach-upload-btn">
              📷 Foto aufnehmen
              <input type="file" accept="image/*" capture="environment" style="display:none" onchange="handleAttachmentUpload('${sec.id}', ${idx}, this.files); this.value='';" />
            </label>
          </div>
        </div>`;
    }
    let signatureHtml = "";
    if (sec.hasRowSignature) {
      const docId = state.activeDocId;
      const rowSig = getRowSignature(docId, sec.id, idx);
      if (rowSig) {
        signatureHtml = `
          <div class="attachments-area" style="background:transparent; padding:6px 0;">
            <div class="sig-row-mini">
              <img src="${rowSig.dataUrl}" alt="Unterschrift">

                ${rowSig.signerName ? `<strong style="font-size:12px;">${esc(rowSig.signerName)}</strong><br>` : ""}
                <span class="sig-row-mini-meta">${esc(fmtSigTimestamp(rowSig.timestamp))}</span>

              <button class="sig-row-btn" onclick="removeRowSignature('${docId}', '${sec.id}', ${idx})">✕ Unterschrift löschen</button>
            </div>
          </div>`;
      } else {
        const rowDateLabel = row.datum ? "vom " + row.datum : "Eintrag #" + (idx + 1);
        const rowOptsId = _registerSigOpts({
          docId, sectionId: sec.id, rowIdx: idx,
          title: "Unterschrift " + rowDateLabel,
          subtitle: "Bitte Name eintragen und unterschreiben.",
          defaultName: ""
        });

          <div class="attachments-area" style="background:transparent; padding:6px 0;">
            <button class="sig-row-btn" onclick="dispatchSignRow('${rowOptsId}')">✍️ Diese Zeile unterzeichnen lassen</button>
          </div>`;
      }
    }
    // Per-row calendar export button (only if row has a date and is in an appointment section)
    const calendarBtn = (isAppointmentSection && row.datum)
      ? `<button class="row-calendar-btn" onclick="exportRowToCalendar('${docId}', '${sec.id}', ${idx})" title="Diesen Eintrag als .ics in den Kalender exportieren">📲 Kalender</button>`
      : "";

    // Termin-Vorbereitungs-Checkliste nur für künftige BH-Termine
    let terminPrepHtml = "";
    if (state.activeDocId === "bhtermine" && sec.id === "termine" && row.datum) {
      const rowDate = parseDateGuess(row.datum);
      const today = new Date(); today.setHours(0,0,0,0);
      if (rowDate && rowDate >= today) {
        const termId = "bh-" + idx;
        terminPrepHtml = renderTerminPrepWidget(termId, false);
      }
    }

    html += `
      <div class="row-card${visible ? '' : ' search-hidden'}">
        <div class="row-num">#${idx + 1}${pastMarker}</div>
        <div class="row-grid">${cols}</div>
        ${attachmentsHtml}

          ${calendarBtn}

        </div>
      </div>`;
  });
  html += `<button class="add-row-btn" onclick="addRow('${sec.id}')">+ Eintrag hinzufügen</button>`;
  html += `</div>`;
  return html;
}

function renderCheckboxSection(sec) {

// Print the document. Opens it in a clean, separate window with only the print
// styles. The new window prints ITSELF after fully loading (incl. images) - far
// more reliable than calling print() on the window from the parent context.
async function confirmAndPrint() {
  const id = state.activeDocId;
  // Make sure the print view is rendered WITH attachments included (if the doc
  // has any). The user expects belege in the printout.
  const docsWithAttachments = ["schadens", "sozial", "kosten", "asservate"];
  if (docsWithAttachments.includes(id) && countAllAttachments(id) > 0 && !state.printWithAttachments) {
    state.printWithAttachments = true;
    render(); // re-render the preview so #printView includes the attachment pages
  }
  const pv = document.getElementById("printView");
  if (!pv || !pv.innerHTML.trim()) {
    try { window.print(); } catch (e) {
      alert("Bitte die Druckfunktion deines Browsers nutzen (Strg+P).");
    }
    return;
  }
  // Embed PDF attachments inline before opening the print window. Show progress
  // overlay because rendering a multi-page PDF can take several seconds.
  const pendingCount = pv.querySelectorAll(".pdf-pending").length;
  let overlay = null;
  let msgEl = null;
  if (pendingCount > 0) {
    overlay = document.createElement("div");
    overlay.className = "print-prep-overlay";
    overlay.innerHTML =
      '<div class="box">' +
        '<div class="spinner"></div>' +
        '<div class="msg" id="printPrepMsg">PDF-Belege werden eingebettet…</div>' +
        '<div class="sub">0 von ' + pendingCount + ' fertig</div>' +
      '</div>';
    document.body.appendChild(overlay);
    msgEl = overlay.querySelector(".sub");
    // Yield a frame so the overlay is visible before the heavy work starts
    await new Promise(r => requestAnimationFrame(r));
  }
  try {
    if (pendingCount > 0) {
      await inlinePdfPlaceholders(pv, (done, total) => {
        if (msgEl) msgEl.textContent = done + " von " + total + " fertig";
      });
    }
  } catch (err) {
    console.error("PDF-Embedding fehlgeschlagen:", err);
  } finally {
    if (overlay) overlay.remove();
  }
  openPrintWindow(pv, id);
}

  const win = window.open("", "_blank");
  if (!win) {
    try { window.print(); } catch (e) {
      alert("Das Druckfenster wurde vom Browser blockiert. Bitte Pop-ups für diese Seite erlauben - oder direkt mit Strg+P drucken.");
    }
    return;
  }
  win.document.open();
  win.document.write(
    '<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">' +
    '<title>' + esc(docTitle) + '</title>' +
    '<style>' + printCss + '</style>' +
    '</head><body class="has-controls">' +
    controlsBar +
    pv.innerHTML +
    '</body></html>'
  );
  win.document.close();
  win.focus();
  // After the print window has its own copy, restore a fresh placeholder DOM
  // in the main window's printView so subsequent print clicks re-render PDFs
  // from scratch (otherwise the user would only see embedded images on the
  // second click — visually fine but loses the "Belege werden eingebettet"
  // overlay state and prevents updates if attachments changed in between).
  render();
}

function attachListeners() {

    el.addEventListener("input", e => setAnswer(sid, fid, e.target.value));

// Global Escape key handler: closes any open modal
// ── Globale Suche (Strg+/) ────────────────────────────────────────────────
// Durchsucht: Notizen, Inbox-Belege, Doc-Beleg-Attachment-Namen, Doc-Inhalte
// (alle answers) und Brief-Templates. Ergebnisliste mit Link zur Quelle.

function closeGlobalSearch() {

function setGlobalSearchQuery(q) {
  // Wichtig: das vollständige render() würde den Input-Cursor an den Anfang
  // setzen (Eindruck: "rückwärts tippen"). Stattdessen nur die Ergebnisliste
  // im Modal aktualisieren, den Input nicht anrühren.
  state.globalSearchQuery = q;

  const counterEl = document.getElementById("global-search-count");
  if (!resultsContainer) {

    render();

  }

  _searchResultsCache.set(q, results);
  let listHtml = "";
  if (q && results.length === 0) {
    listHtml = `<div style="padding:30px; text-align:center; color:var(--text-soft); font-size:13px;">Keine Treffer für \u201E${esc(q)}\u201C. Versuch's mit weniger oder anderen Worten.</div>`;
  } else if (results.length > 0) {
    listHtml = results.map((r, i) => `
      <button onclick="selectSearchResult(${i})" style="display:block; width:100%; text-align:left; padding:10px 14px; background:transparent; border:none; border-bottom:1px solid var(--border); cursor:pointer; color:var(--text);">
        <div style="font-size:13px; font-weight:500;">${esc(r.label)}</div>
        <div style="font-size:11px; color:var(--text-soft); margin-top:2px;">${esc(r.sub)}</div>
      </button>`).join("");
  } else {
    listHtml = `<div style="padding:30px; text-align:center; color:var(--text-soft); font-size:13px;">Tippe los, um Notizen, Belege, Doc-Felder, Briefe und Kontakte zu durchsuchen.<br><br><strong>Tipp:</strong> Strg+/ öffnet diese Suche von überall.</div>`;
  }
  resultsContainer.innerHTML = listHtml;
  if (counterEl) {
    counterEl.textContent = results.length > 0 ? results.length + " Treffer · Esc zum Schließen" : "";
  }
}
function runGlobalSearch(q) {
  const norm = (s) => (s == null ? "" : String(s).toLowerCase());
  const needle = norm(q).trim();
  if (!needle) return [];
  const results = [];

  // Notizen
  (state.notes || []).forEach(n => {
    const txt = norm(n.text);
    if (txt.includes(needle)) {
      results.push({
        kind: "note",
        label: (n.text || "").slice(0, 80),
        sub: "📝 Notiz · " + (n.createdAt ? new Date(n.createdAt).toLocaleDateString("de-DE") : ""),
        action: () => { state.view = "home"; render(); /* notes panel is on home */ },
      });
    }
  });

  // Inbox-Belege
  (state.inbox || []).forEach(item => {
    if (norm(item.name).includes(needle) || norm(item.ocrText).includes(needle)) {
      results.push({
        kind: "inbox",
        label: item.name || "Beleg",
        sub: "📥 Beleg-Inbox · " + (item.type === "image" ? "Bild" : "PDF"),
        action: () => { state.view = "inbox"; render(); },
      });
    }
  });

  // Doc-Anhänge (Name + ggf OCR-Text)
  Object.entries(state.docs || {}).forEach(([docId, ds]) => {
    if (!ds || !ds.attachments) return;
    const docDef = DOCS[docId];
    if (!docDef) return;
    Object.entries(ds.attachments).forEach(([secId, byRow]) => {
      if (!byRow) return;
      Object.entries(byRow).forEach(([rowIdx, atts]) => {
        if (!Array.isArray(atts)) return;
        atts.forEach(att => {
          if (norm(att.name).includes(needle) || norm(att.extractedText).includes(needle)) {
            results.push({
              kind: "attachment",
              label: att.name || "Beleg",
              sub: (docDef.icon || "📎") + " " + docDef.title + " · " + secId,
              action: () => { state.activeDocId = docId; state.view = "wizard"; render(); },
            });
          }
        });
      });
    });
  });

  // Doc-Answers (Felder)
  Object.entries(state.docs || {}).forEach(([docId, ds]) => {
    if (!ds || !ds.answers) return;
    const docDef = DOCS[docId];
    if (!docDef) return;
    Object.entries(ds.answers).forEach(([key, val]) => {
      const v = norm(val);
      if (v && v.includes(needle)) {
        results.push({
          kind: "field",
          label: String(val).slice(0, 80),
          sub: (docDef.icon || "📄") + " " + docDef.title + " · " + key,
          action: () => { state.activeDocId = docId; state.view = "wizard"; render(); },
        });
      }
    });
    // Auch Rows durchsuchen
    if (ds.rows) {
      Object.entries(ds.rows).forEach(([secId, rows]) => {
        if (!Array.isArray(rows)) return;
        rows.forEach((r, idx) => {
          const all = Object.values(r).map(v => norm(v)).join(" ");
          if (all.includes(needle)) {
            // Treffer mit dem ersten Feld als Label
            const firstField = Object.entries(r).find(([k, v]) => norm(v).includes(needle));
            const labelText = firstField ? String(firstField[1]).slice(0, 80) : "Zeile " + (idx + 1);
            results.push({
              kind: "row",
              label: labelText,
              sub: (docDef.icon || "📄") + " " + docDef.title + " · " + secId + " Zeile " + (idx + 1),
              action: () => { state.activeDocId = docId; state.view = "wizard"; render(); },
            });
          }
        });
      });
    }
  });

  // Brief-Templates
  Object.entries(ANSCHREIBEN_TEMPLATES).forEach(([key, tpl]) => {
    if (norm(tpl.title).includes(needle) || norm(tpl.desc).includes(needle)) {
      const cat = ANSCHREIBEN_CATEGORIES[tpl.cat]?.label || "Brief";
      results.push({
        kind: "template",
        label: tpl.title,
        sub: "✉️ " + cat,
        action: () => { state.view = "anschreiben"; selectAnschreiben(key); },
      });
    }
  });

  // Kontakte (Adressbuch)
  (state.contacts || []).forEach(c => {
    const blob = norm([c.name, c.firma, c.email, c.telefon, c.notiz, c.rolle].join(" "));
    if (blob.includes(needle)) {
      results.push({
        kind: "contact",
        label: c.name || c.firma || "Kontakt",
        sub: "📇 Adressbuch · " + (c.rolle || ""),
        action: () => { state.view = "contacts"; render(); },
      });
    }
  });

  return results.slice(0, 60);
}

      </div>
    </div>`;

document.addEventListener("keydown", e => {
  // Escape: schliesst offene Modals (Reihenfolge: innerste zuerst)
  if (e.key === "Escape") {
    if (state.confirmModal) { closeConfirmModal(); return; }
    if (state.extractedTextModal) { closeExtractedTextModal(); return; }
    if (resetModalOpen) { closeResetModal(); return; }
    if (quickAddOpen) { closeQuickAdd(); return; }
    if (onboardingActive) { skipOnboarding(); return; }
    if (lightboxOpen) { closeLightbox(); return; }
    if (state.inboxModal) { closeInboxModal(); return; }
    if (state.globalSearchOpen) { closeGlobalSearch(); return; }
    if (state.addCustomTplOpen) { closeAddCustomTpl(); return; }
    return;
  }
  // Strg+/ oder Cmd+/: Globale Suche oeffnen
  if ((e.ctrlKey || e.metaKey) && e.key === "/" && !state.globalSearchOpen) {
    e.preventDefault();
    openGlobalSearch();
    return;
  }
  // Strg+P oder Cmd+P: Drucken (nur im Doc-Preview-Modus oder Anschreiben)
  if ((e.ctrlKey || e.metaKey) && e.key === "p") {
    if (state.view === "preview" || state.view === "anschreiben") {
      // Browser-eigener Druckdialog ist sowieso besser als unser Print-Window
      // also lassen wir den Standard-Print durchrennen
      return;
    }
    return;
  }
  // Strg+S oder Cmd+S: Sichern (Backup-Datei)
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    if (typeof exportAllData === "function") exportAllData();
    return;
  }
});

async function exportAllData() {
  const dump = {
    version: 4,
    appVersion: APP_VERSION,
    exportedAt: new Date().toISOString(),
    shared: state.shared,
    theme: state.theme,
    settings: state.settings,
    docs: state.docs,
    notes: state.notes,
    inbox: state.inbox,
    // v3.31 additions:
    contacts: state.contacts || [],
    briefHistory: state.briefHistory || [],
    customTemplates: state.customTemplates || {},
    terminPrep: state.terminPrep || {},
  };
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = todayISO();
  const userName = (state.shared.name || "").replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");
  a.href = url; a.download = `Bewaehrungshilfe-Daten_${userName ? userName + "_" : ""}${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  await markBackupDone();
  showSaveToast("Backup gespeichert");
}

function triggerImport() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || typeof data !== "object" || !data.docs) throw new Error("Ungültiges Format - das ist keine Bewährungshilfe-Datensicherung");
      // Version compatibility check
      const fileVer = data.version || 1;
      if (fileVer > 4) {
        if (!confirm(`Diese Sicherungsdatei wurde mit einer neueren Version der App erstellt (Version ${fileVer}, deine App: ${APP_VERSION}). Möglicherweise gehen dabei Daten verloren oder werden falsch eingelesen.\n\nTrotzdem fortfahren?`)) return;
      }
      if (!confirm("Achtung: Importieren überschreibt deine aktuellen Daten in diesem Browser. Fortfahren?")) return;
      // Merge each doc
      Object.keys(data.docs).forEach(docId => {
        if (DOCS[docId]) {
          state.docs[docId] = { ...state.docs[docId], ...data.docs[docId] };
        }
      });
      if (data.shared) state.shared = data.shared;
      if (data.theme === "dark" || data.theme === "light") { state.theme = data.theme; applyTheme(); }
      if (Array.isArray(data.notes)) state.notes = data.notes;
      if (Array.isArray(data.inbox)) state.inbox = data.inbox;
      // v3.31 fields
      if (Array.isArray(data.contacts)) state.contacts = data.contacts;
      if (Array.isArray(data.briefHistory)) state.briefHistory = data.briefHistory;
      if (data.customTemplates && typeof data.customTemplates === "object") {
        state.customTemplates = data.customTemplates;
        restoreCustomTemplatesIntoTemplates();
      }
      if (data.terminPrep && typeof data.terminPrep === "object") state.terminPrep = data.terminPrep;
      // Save everything
      for (const id of Object.keys(state.docs)) {
        if (DOCS[id]) await Storage.set(DOCS[id].storageKey, JSON.stringify(state.docs[id]));
      }
      await Storage.set(SHARED_STORAGE_KEY, JSON.stringify(state.shared));
      await Storage.set(THEME_STORAGE_KEY, state.theme);
      await Storage.set(NOTES_STORAGE_KEY, JSON.stringify(state.notes));
      await Storage.set(INBOX_STORAGE_KEY, JSON.stringify(state.inbox));
      if (state.contacts) await Storage.set(CONTACTS_STORAGE_KEY, JSON.stringify(state.contacts));
      if (state.briefHistory) await Storage.set(BRIEF_HISTORY_KEY, JSON.stringify(state.briefHistory));
      if (state.customTemplates) await Storage.set(CUSTOM_TEMPLATES_KEY, JSON.stringify(state.customTemplates));
      if (state.terminPrep) await Storage.set(TERMIN_PREP_KEY, JSON.stringify(state.terminPrep));
      const exportedDate = data.exportedAt ? new Date(data.exportedAt).toLocaleDateString("de-DE") : "";
      alert(`Daten erfolgreich importiert!${exportedDate ? "\n\nSicherungsdatum: " + exportedDate : ""}`);
      render();
    } catch (err) {
      alert("Fehler beim Import: " + err.message);
    }
  };
  inp.click();
}

// Render document-level signatures section for print (proband + counter-signer)
function renderPrintSignatures(docId, opts) {
  // opts: { counterRoleLabel, probandLabel, hideIfEmpty }
  opts = opts || {};
  const probandSig = getSignature(docId, "gesamt_proband");
  const counterSig = getSignature(docId, "gesamt");
  const counterRoleLabel = opts.counterRoleLabel || "Bestätigt durch";
  const probandLabel = opts.probandLabel || "Proband:in";
  const probandName = (state.shared && state.shared.name) || "";

  if (opts.hideIfEmpty && !probandSig && !counterSig) return "";

  const renderSlot = (sig, fallbackLabel, fallbackName) => {
    if (sig && sig.dataUrl) {
      const deviceStr = (sig.device && sig.device.userAgentShort) ? ` · ${esc(sig.device.userAgentShort)}` : "";
      return `
        <div class="print-sig-slot">
          <div class="print-sig-img-wrap">
            <img src="${sig.dataUrl}" alt="Unterschrift" class="print-sig-img">
          </div>
          <div class="print-sig-line"></div>
          <div class="print-sig-label">
            ${sig.signerName ? `<strong>${esc(sig.signerName)}</strong><br>` : (fallbackName ? `<strong>${esc(fallbackName)}</strong><br>` : "")}
            <span style="font-size:10px; color:#666;">Digital unterzeichnet am ${esc(fmtSigTimestamp(sig.timestamp))}${deviceStr}</span><br>
            <span style="font-size:11px;">${esc(fallbackLabel)}</span>
          </div>
        </div>`;
    }
    // Empty slot for handwritten signature
    return `
      <div class="print-sig-slot">
        <div class="print-sig-img-wrap"><!-- space for handwritten --></div>
        <div class="print-sig-line"></div>
        <div class="print-sig-label">
          ${fallbackName ? `<strong>${esc(fallbackName)}</strong><br>` : ""}
          <span style="font-size:11px;">${esc(fallbackLabel)}</span><br>
          <span style="font-size:10px; color:#888;">(Ort, Datum, Unterschrift)</span>
        </div>
      </div>`;
  };

  return `
    <div class="print-signatures">
      ${renderSlot(probandSig, probandLabel, probandName)}
      ${renderSlot(counterSig, counterRoleLabel, "")}
    </div>`;
}

// Render a verification summary page listing all digital signatures with metadata
// Useful for someone receiving the print: they see at a glance which signatures
// were captured digitally, when, on what device, and can compare with the visible signatures.
function renderPrintVerificationFooter(docId) {
  const ds = state.docs[docId];
  if (!ds || !ds.signatures) return "";
  const sigs = ds.signatures;
  const entries = Object.keys(sigs).map(key => ({ key, sig: sigs[key] })).filter(e => e.sig && e.sig.dataUrl);
  if (entries.length === 0) return "";

  function describeKey(key) {
    if (key === "gesamt_proband") return "Gesamt-Unterschrift Proband:in";
    if (key === "gesamt") return "Gesamt-Unterschrift bestätigende Person";
    const m = key.match(/^row_([^_]+)_(\d+)$/);
    if (m) return `Zeile ${parseInt(m[2]) + 1} (${m[1]})`;
    return key;
  }

  let rows = "";
  entries.forEach((e, i) => {
    const sig = e.sig;
    const dev = sig.device || {};
    const methodLabel = {
      draw: "Gezeichnet",
      upload: "Bild hochgeladen",
      saved: "Gespeicherte Unterschrift"
    }[sig.method] || "Gezeichnet";
    rows += `<tr>
      <td>${i + 1}</td>
      <td>${esc(describeKey(e.key))}</td>
      <td>${esc(sig.signerName || "(ohne Name)")}</td>
      <td>${esc(fmtSigTimestamp(sig.timestamp))}</td>
      <td style="font-size:9pt;">${esc(methodLabel)}</td>
      <td style="font-size:9pt;">${esc((dev.userAgentShort || "") + (dev.timezone ? " · " + dev.timezone : ""))}</td>
    </tr>`;
  });

  return `
    <div class="pagebreak"></div>
    <div class="verification-footer">
      <h2>📋 Verifikation digitaler Unterschriften</h2>
      <p style="font-size:10pt; color:#555; margin-bottom:10pt;">
        Diese Übersicht zeigt alle in diesem Dokument enthaltenen digitalen Unterschriften zum Zeitpunkt des Ausdrucks. Jede Zeile dokumentiert, wann und auf welchem Gerät unterzeichnet wurde - vergleichbar mit dem Logbuch eines DHL-Paket-Tablets.
      </p>
      <table>
        <tr><th>Nr</th><th>Bereich</th><th>Unterzeichnet von</th><th>Zeitpunkt</th><th>Erfassungsart</th><th>Gerät / Zeitzone</th></tr>
        ${rows}
      </table>
      <p style="font-size:9pt; font-style:italic; color:#888; margin-top:10pt;">
        Diese Übersicht ist <strong>kein Beweismittel im Sinne einer qualifizierten elektronischen Signatur</strong> (eIDAS), sondern eine technische Dokumentation der erfassten Unterschriften zum Beweis-/Nachweiszweck im Alltag (vergleichbar einer Quittung).
      </p>
    </div>`;
}

function renderPrintView() {
  const pv = document.getElementById("printView");
  pv.classList.add("show");
  // Force light theme just for preview, even if app is in dark mode
  pv.setAttribute("data-theme", "light");
  const id = state.activeDocId;
  if (id === "ear") pv.innerHTML = renderPrintEAR();
  else if (id === "zeit") { pv.innerHTML = renderPrintZeit(); pv.classList.add("landscape-mode"); }
  else if (id === "thera") pv.innerHTML = renderPrintThera();
  else if (id === "schadens") pv.innerHTML = renderPrintSchadens();
  else if (id === "sozial") { pv.innerHTML = renderPrintSozial(); pv.classList.add("landscape-mode"); }
  else if (id === "uebersicht") pv.innerHTML = renderPrintUebersicht();
  else if (id === "bhtermine") { pv.innerHTML = renderPrintBhtermine(); pv.classList.add("landscape-mode"); }
  else if (id === "asservate") { pv.innerHTML = renderPrintAsservate(); pv.classList.add("landscape-mode"); }
  else if (id === "kosten") { pv.innerHTML = renderPrintKosten(); pv.classList.add("landscape-mode"); }
  else if (id === "ziele") pv.innerHTML = renderPrintZiele();
}

function valOrSkipPrint(secId, fId) {
  const a = getAnswer(secId, fId);
  if (isSkipped(a)) return { skipped: true, value: "" };
  return { skipped: false, value: valueOf(a) };
}
// Filter out skipped pairs - they should not appear in the final document
function filterPairs(pairs) {
  return pairs.filter(p => !p[1].skipped);
}
function tdLabel(label, skipped) {
  return `<td class="label ${skipped ? "strike" : ""}">${esc(label)}</td>`;
}
function tdValue(val) { return `<td>${esc(val) || "&nbsp;"}</td>`; }
function tdEmpty() { return `<td>&nbsp;</td><td>&nbsp;</td>`; }

function renderPrintEAR() {
  const ans = (s, f) => valOrSkipPrint(s, f);
  const personalAll = [
    ["Name, Vorname", ans("personal","name")], ["Geburtsdatum", ans("personal","geburtsdatum")],
    ["Anschrift", ans("personal","anschrift")], ["Telefon", ans("personal","telefon")],
    ["E-Mail", ans("personal","email")], ["Familienstand", ans("personal","familienstand")],
    ["Personen im Haushalt", ans("personal","haushalt")], ["Davon unterhaltspflichtige Kinder", ans("personal","kinder")],
    ["Aktenzeichen Bewährungshilfe", ans("personal","aktenzeichen")], ["Bewährungshelfer/in", ans("personal","bewaehrungshelfer")],
    ["Abrechnungszeitraum", ans("personal","zeitraum")], ["Erstellt am", ans("personal","erstellt")],
  ];
  const personal = filterPairs(personalAll);
  let infoTable = `<table>`;
  if (personal.length === 0) {
    infoTable += `<tr><td>&nbsp;</td></tr>`;
  } else {
    for (let i = 0; i < personal.length; i += 2) {
      const L = personal[i], R = personal[i+1];
      if (R) {
        infoTable += `<tr>${tdLabel(L[0], false)}${tdValue(L[1].value)}${tdLabel(R[0], false)}${tdValue(R[1].value)}</tr>`;
      } else {
        infoTable += `<tr>${tdLabel(L[0], false)}${tdValue(L[1].value)}<td colspan="2">&nbsp;</td></tr>`;
      }
    }
  }
  infoTable += `</table>`;

  function moneyTable(groups, sumLabel) {
    let html = `<table><tr><th style="width:70%">Bezeichnung</th><th>Betrag (EUR)</th></tr>`;
    let sum = 0;
    let anyShown = false;
    groups.forEach(grp => {
      const sec = DOCS.ear.sections.find(s => s.id === grp.id);
      // Collect rows that should be visible (have a value, not skipped)
      const visibleFields = [];
      sec.fields.forEach(f => {
        const a = getAnswer(grp.id, f.id);
        const skipped = isSkipped(a);
        const v = valueOf(a);
        if (!skipped && v) {
          const n = parseMoney(v);
          sum += n;
          visibleFields.push({ label: f.label, value: moneyOnly(n) });
        }
      });
      if (visibleFields.length === 0) return; // skip empty subgroup entirely
      anyShown = true;
      html += `<tr><td class="subhead" colspan="2">${esc(grp.title)}</td></tr>`;
      visibleFields.forEach(f => {
        html += `<tr><td>${esc(f.label)}</td><td>${f.value}</td></tr>`;
      });
    });
    if (!anyShown) {
      html += `<tr><td colspan="2" style="text-align:center; color:#888; font-style:italic;">(keine Einträge)</td></tr>`;
    }
    html += `<tr><td class="sum">${sumLabel}</td><td class="sum">${moneyOnly(sum)}</td></tr></table>`;
    return { html, sum };
  }

  const einGroups = [
    { id: "arbeit", title: "ARBEITSEINKOMMEN" },
    { id: "sozial", title: "SOZIALLEISTUNGEN" },
    { id: "familie_ein", title: "FAMILIENLEISTUNGEN" },
    { id: "renten", title: "RENTEN / VERSORGUNG" },
    { id: "sonst_ein", title: "SONSTIGE EINNAHMEN" },
  ];
  const ausGroups = [
    { id: "wohnen", title: "WOHNEN" }, { id: "vers", title: "VERSICHERUNGEN" },
    { id: "mob", title: "MOBILITÄT" }, { id: "tk", title: "TELEKOMMUNIKATION & MEDIEN" },
    { id: "leben", title: "LEBENSHALTUNG" }, { id: "gesundheit", title: "GESUNDHEIT" },
    { id: "familie_aus", title: "FAMILIE / KINDER" }, { id: "schulden", title: "SCHULDEN / VERPFLICHTUNGEN" },
    { id: "justiz", title: "BEWÄHRUNGSAUFLAGEN / JUSTIZ" }, { id: "freizeit", title: "FREIZEIT / SONSTIGES" },
  ];
  const einR = moneyTable(einGroups, "DEINE EINNAHMEN GESAMT");
  const ausR = moneyTable(ausGroups, "GESAMTAUSGABEN HAUSHALT");

  // Household members' income table
  const hhRows = (getDocState().rows && getDocState().rows.haushalt_ein) || [];
  const hhFiltered = hhRows.filter(r => (r.name || r.beziehung || r.art || r.betrag));
  let hhSum = 0;
  let hhTable = "";
  if (hhFiltered.length > 0) {
    hhTable = `<table><tr><th>Name</th><th>Beziehung</th><th>Art der Einnahme</th><th>Monatlich (EUR)</th></tr>`;
    hhFiltered.forEach(r => {
      const n = parseMoney(r.betrag || "");
      hhSum += n;
      hhTable += `<tr><td>${esc(r.name || "")}</td><td>${esc(r.beziehung || "")}</td><td>${esc(r.art || "")}</td><td>${r.betrag ? moneyOnly(n) : ""}</td></tr>`;
    });
    hhTable += `<tr><td class="sum" colspan="3">Einnahmen weiterer Haushaltsmitglieder gesamt</td><td class="sum">${moneyOnly(hhSum)}</td></tr></table>`;
  }
  const totalEin = einR.sum + hhSum;
  const saldo = totalEin - ausR.sum;

  const note = ans("anmerkung", "notes");
  let noteSection = "";
  if (!note.skipped && note.value) {
    const noteHtml = note.value.split("\n").map(l => `<p>${esc(l) || "&nbsp;"}</p>`).join("");
    noteSection = `<h2>${hhFiltered.length > 0 ? "6" : "5"}. Anmerkungen / Erläuterungen</h2>${noteHtml}`;
  }

  // Build saldo table - different depending on whether household has entries
  let saldoTable;
  if (hhFiltered.length > 0) {
    saldoTable = `<table>
      <tr><th style="width:70%">Position</th><th>Betrag (EUR)</th></tr>
      <tr><td>Deine Einnahmen</td><td>${moneyOnly(einR.sum)}</td></tr>
      <tr><td>Einnahmen weiterer Haushaltsmitglieder</td><td>${moneyOnly(hhSum)}</td></tr>
      <tr><td><strong>Gesamteinnahmen Haushalt</strong></td><td><strong>${moneyOnly(totalEin)}</strong></td></tr>
      <tr><td>Gesamtausgaben Haushalt</td><td>${moneyOnly(ausR.sum)}</td></tr>
      <tr><td class="sum">ÜBERSCHUSS / FEHLBETRAG (Haushalt)</td><td class="sum" style="color:${saldo >= 0 ? '#5BA572' : '#dc2626'}">${moneyOnly(saldo)}</td></tr>
    </table>`;
  } else {
    saldoTable = `<table>
      <tr><th style="width:70%">Position</th><th>Betrag (EUR)</th></tr>
      <tr><td>Gesamteinnahmen</td><td>${moneyOnly(einR.sum)}</td></tr>
      <tr><td>Gesamtausgaben</td><td>${moneyOnly(ausR.sum)}</td></tr>
      <tr><td class="sum">ÜBERSCHUSS / FEHLBETRAG</td><td class="sum" style="color:${saldo >= 0 ? '#5BA572' : '#dc2626'}">${moneyOnly(saldo)}</td></tr>
    </table>`;
  }

  // Build sections with dynamic numbering
  const hhSection = hhFiltered.length > 0 ? `<h2>3. Einnahmen weiterer Haushaltsmitglieder</h2>${hhTable}<div class="pagebreak"></div>` : "";
  const ausNum = hhFiltered.length > 0 ? "4" : "3";
  const saldoNum = hhFiltered.length > 0 ? "5" : "4";

  return `
    <h1>Einnahmen-Ausgaben-Rechnung</h1>
    <div class="subtitle">für die Bewährungshilfe</div>
    <h2>1. Persönliche Angaben</h2>${infoTable}
    <h2>2. Deine Einnahmen</h2>${einR.html}
    <div class="pagebreak"></div>
    ${hhSection}
    <h2>${ausNum}. Ausgaben${hhFiltered.length > 0 ? " (Haushalt gesamt)" : ""}</h2>${ausR.html}
    <div class="pagebreak"></div>
    <h2>${saldoNum}. Zusammenfassung / Saldo</h2>
    ${saldoTable}
    ${noteSection}
    ${renderPrintSignatures("ear", { counterRoleLabel: "Bestätigung (optional)", probandLabel: "Eintragen durch (Proband:in)", hideIfEmpty: false })}
    <p style="font-size:8pt; font-style:italic; color:#666; margin-top:8pt;">Ich versichere, dass die vorstehenden Angaben vollständig und wahrheitsgemäß sind.</p>
  `;
}

function renderPrintZeit() {
  const ans = (s, f) => valOrSkipPrint(s, f);
  // Personal - filter out skipped
  const personalAll = [
    ["Name, Vorname", ans("personal","name")], ["Geburtsdatum", ans("personal","geburtsdatum")],
    ["Geburtsort", ans("personal","geburtsort")], ["Staatsangehörigkeit", ans("personal","staat")],
    ["Aktuelle Anschrift", ans("personal","anschrift")], ["Telefon / E-Mail", ans("personal","kontakt")],
    ["Aktenzeichen", ans("personal","aktenzeichen")], ["Bewährungshelfer/in", ans("personal","bewaehrungshelfer")],
    ["Erstellt am", ans("personal","erstellt")], ["Stand / Zeitraum", ans("personal","stand")],
  ];
  const personal = filterPairs(personalAll);
  let infoTable = `<table>`;
  if (personal.length === 0) {
    infoTable += `<tr><td>&nbsp;</td></tr>`;
  } else {
    for (let i = 0; i < personal.length; i += 2) {
      const L = personal[i], R = personal[i+1];
      if (R) {
        infoTable += `<tr>${tdLabel(L[0], false)}${tdValue(L[1].value)}${tdLabel(R[0], false)}${tdValue(R[1].value)}</tr>`;
      } else {
        infoTable += `<tr>${tdLabel(L[0], false)}${tdValue(L[1].value)}<td colspan="2">&nbsp;</td></tr>`;
      }
    }
  }
  infoTable += `</table>`;

  function rowsTable(secId) {
    const sec = DOCS.zeit.sections.find(s => s.id === secId);
    const rows = getRows(secId);
    // Filter out completely empty rows
    const nonEmpty = rows.filter(r => sec.columns.some(c => r[c.id] && r[c.id].trim()));
    if (nonEmpty.length === 0) return ""; // hide entire section if no entries
    let html = `<table><tr>${sec.columns.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr>`;
    nonEmpty.forEach(r => {
      html += `<tr>${sec.columns.map(c => `<td>${esc(r[c.id] || "")}</td>`).join("")}</tr>`;
    });
    html += `</table>`;
    return html;
  }
  function sectionIfHasContent(num, title, secId) {
    const t = rowsTable(secId);
    return t ? `<h2>${num}. ${title}</h2>${t}` : "";
  }

  const note = ans("anmerkung", "notes");
  const noteSection = (!note.skipped && note.value)
    ? `<h2>10. Anmerkungen / Ergänzungen</h2>${note.value.split("\n").map(l => `<p>${esc(l) || "&nbsp;"}</p>`).join("")}`
    : "";

  // Build sections array - only those with content
  const parts = [];
  parts.push({ kind: "info", html: `<h2>1. Persönliche Angaben</h2>${infoTable}` });
  const dynSections = [
    ["Wohnsitze", "wohnungen"],
    ["Berufliche Tätigkeiten", "arbeit"],
    ["Schulischer und beruflicher Bildungsweg", "bildung"],
    ["Wichtige Lebensereignisse", "lebensereignisse"],
    ["Therapien und Beratungen", "therapie"],
    ["Maßnahmen und Aufenthalte", "massnahmen"],
    ["Justiz / Strafrechtliche Verfahren", "justiz"],
    ["Aktuelles Unterstützungssystem", "hilfen"],
  ];
  dynSections.forEach(([title, sid]) => {
    const t = rowsTable(sid);
    if (t) parts.push({ kind: "rows", html: `<h2>${parts.length + 1}. ${title}</h2>${t}` });
  });
  if (noteSection) parts.push({ kind: "note", html: `<h2>${parts.length + 1}. Anmerkungen / Ergänzungen</h2>${(!note.skipped && note.value) ? note.value.split("\n").map(l => `<p>${esc(l) || "&nbsp;"}</p>`).join("") : ""}` });

  // Insert page breaks every ~2 sections to avoid awkward layouts
  let body = "";
  parts.forEach((p, i) => {
    if (i > 0 && i % 2 === 0) body += `<div class="pagebreak"></div>`;
    body += p.html;
  });

  return `
    <h1>Zeitstrahl / Lebensverlauf</h1>
    <div class="subtitle">Strukturierte Übersicht für die Bewährungshilfe</div>
    ${body}
    ${renderPrintSignatures("zeit", { counterRoleLabel: "Bestätigung (optional)", probandLabel: "Eintragen durch (Proband:in)" })}
    <p style="font-size:8pt; font-style:italic; color:#666; margin-top:8pt;">Ich versichere, dass die vorstehenden Angaben nach bestem Wissen vollständig und wahrheitsgemäß sind.</p>
  `;
}

function renderPrintThera() {
  const ans = (s, f) => valOrSkipPrint(s, f);
  // Briefkopf - already filters skipped lines
  const brief = ["name","titel","praxis","tel","email","kasse"].map(f => ans("briefkopf", f));
  const briefHasContent = brief.some(b => !b.skipped && b.value);
  let briefkopf = `<div class="briefkopf">`;
  if (briefHasContent) {
    briefkopf += brief.map(b => {
      if (b.skipped || !b.value) return "";
      return `<div>${esc(b.value)}</div>`;
    }).join("");
  } else {
    briefkopf += `<div class="label">Praxisstempel / Briefkopf Therapeut/in</div>
      <div style="height:60pt;"></div>
      <div class="label">(Name, Berufsbezeichnung, Praxisanschrift, Telefon, E-Mail, ggf. Kassenzulassung)</div>`;
  }
  briefkopf += `</div>`;

  // Patient - filter skipped
  const patientAll = [
    ["Name, Vorname", ans("patient","name")], ["Geburtsdatum", ans("patient","geburtsdatum")],
    ["Anschrift", ans("patient","anschrift")], ["Telefon", ans("patient","tel")],
    ["Aktenzeichen Bewährungshilfe", ans("patient","aktenzeichen")], ["Bewährungshelfer/in", ans("patient","bewaehrungshelfer")],
  ];
  const patient = filterPairs(patientAll);
  let patTable = `<table>`;
  if (patient.length === 0) {
    patTable += `<tr><td>&nbsp;</td></tr>`;
  } else {
    for (let i = 0; i < patient.length; i += 2) {
      const L = patient[i], R = patient[i+1];
      if (R) patTable += `<tr>${tdLabel(L[0], false)}${tdValue(L[1].value)}${tdLabel(R[0], false)}${tdValue(R[1].value)}</tr>`;
      else patTable += `<tr>${tdLabel(L[0], false)}${tdValue(L[1].value)}<td colspan="2">&nbsp;</td></tr>`;
    }
  }
  patTable += `</table>`;

  // Therapie info - filter skipped
  const therInfoAll = [
    ["Therapiebeginn", ans("therapie_info","beginn")], ["Geplantes Ende", ans("therapie_info","ende")],
    ["Verfahren / Methode", ans("therapie_info","methode")], ["Frequenz", ans("therapie_info","frequenz")],
    ["Dauer pro Sitzung", ans("therapie_info","dauer")], ["Setting", ans("therapie_info","setting")],
    ["Sitzungen bewilligt", ans("therapie_info","sitzungen")], ["Kostenträger", ans("therapie_info","kostentraeger")],
    ["Behandlungsanlass / -ziel", ans("therapie_info","anlass")],
  ];
  const therInfo = filterPairs(therInfoAll);
  let therTable = "";
  if (therInfo.length > 0) {
    therTable = `<table>`;
    for (let i = 0; i < therInfo.length; i += 2) {
      const L = therInfo[i], R = therInfo[i+1];
      if (R) therTable += `<tr>${tdLabel(L[0], false)}${tdValue(L[1].value)}${tdLabel(R[0], false)}${tdValue(R[1].value)}</tr>`;
      else therTable += `<tr>${tdLabel(L[0], false)}${tdValue(L[1].value)}<td colspan="2">&nbsp;</td></tr>`;
    }
    therTable += `</table>`;
  }

  // Therapieart - only show CHECKED options
  const therArt = DOCS.thera.sections.find(s => s.id === "therapieart");
  const therChecks = getChecks("therapieart");
  const checkedTherArt = therArt.options.filter(o => therChecks[o]);
  let therArtSection = "";
  if (checkedTherArt.length > 0) {
    let html = `<p style="font-size:9pt; margin-top:6pt;"><strong>Therapieformen:</strong></p><div class="checkbox-list">`;
    checkedTherArt.forEach(opt => { html += `<div class="item">☒ ${esc(opt)}</div>`; });
    html += `</div>`;
    therArtSection = html;
  }

  // Termine - more rows for multiple sessions on one sheet
  const termineRows = getRows("termine");
  let termineHtml = `<table><tr><th>Datum</th><th>Uhrzeit</th><th>Dauer</th><th>Art</th><th>Wahr-<br>genommen</th><th>Notiz / Hausaufgabe</th><th>Unterschrift / Stempel</th></tr>`;
  // Show entered rows + extra empty rows for upcoming sessions, total at least 15
  const minRows = 15;
  const targetRows = Math.max(termineRows.length + 5, minRows);
  for (let i = 0; i < targetRows; i++) {
    const r = termineRows[i] || {};
    const rowSigHtml = (i < termineRows.length) ? renderPrintRowSignature("thera", "termine", i) : "";
    const notizText = esc(r.notiz || "").replace(/\n/g, "<br>");
    termineHtml += `<tr>
      <td>${esc(r.datum || "")}&nbsp;</td>
      <td>${esc(r.uhrzeit || "")}&nbsp;</td>
      <td>${esc(r.dauer || "")}&nbsp;</td>
      <td>${esc(r.art || "")}&nbsp;</td>
      <td style="text-align:center;">☐ ja  ☐ nein</td>
      <td style="font-size:9pt;">${notizText || "&nbsp;"}</td>
      <td style="height:32pt; vertical-align:middle;">${rowSigHtml || "&nbsp;"}</td>
    </tr>`;
  }
  termineHtml += `</table>`;

  // Schweigepflicht - only show CHECKED options
  const sp = DOCS.thera.sections.find(s => s.id === "schweigepflicht");
  const spChecks = getChecks("schweigepflicht");
  const checkedSp = sp.options.filter(o => spChecks[o]);
  const patName = ans("patient","name").value || "_____________________________________";
  let spSection = "";
  if (checkedSp.length > 0) {
    let html = `<p>Hiermit entbinde ich, ${esc(patName)} (Patient/in), die/den oben genannte/n Therapeut/in von der Schweigepflicht im folgenden Umfang gegenüber meiner/meinem Bewährungshelfer/in:</p><div class="checkbox-list" style="margin-top:6pt;">`;
    checkedSp.forEach(opt => { html += `<div class="item">☒ ${esc(opt)}</div>`; });
    html += `</div><p style="margin-top:6pt; font-size:8pt; font-style:italic; color:#666;">Diese Entbindung kann jederzeit schriftlich widerrufen werden.</p>`;
    spSection = html;
  }

  // Bemerkung - hide section heading entirely if no content
  const bem = ans("bemerkung", "notes");
  const bemSection = (!bem.skipped && bem.value)
    ? bem.value.split("\n").map(l => `<p>${esc(l) || "&nbsp;"}</p>`).join("")
    : "";

  // Build sections with dynamic numbering
  const sections = [];
  sections.push(`<h2>${sections.length + 1}. Patient/in</h2>${patTable}`);
  if (therTable || therArtSection) {
    sections.push(`<h2>${sections.length + 1}. Angaben zur Therapie</h2>${therTable}${therArtSection}`);
  }
  sections.push(`<div class="pagebreak"></div><h2>${sections.length + 1}. Übersicht der Termine / Sitzungen</h2>

    ${termineHtml}`);
  if (bemSection) {
    sections.push(`<h2>${sections.length + 1}. Bemerkungen zum Therapieverlauf</h2>${bemSection}`);
  }
  if (spSection) {
    sections.push(`<h2>${sections.length + 1}. Schweigepflichtentbindung</h2>${spSection}`);

  const therBestNum = sections.length + 1;
  sections.push(`<h2>${therBestNum}. Bestätigung & Unterschriften</h2>

  return `

          attachmentPages += `<div class="pdf-pending" data-pdf-ref="${ref}" data-caption="${esc(caption)}"></div>`;
        }

// ---- Status-Übersicht (auto-generated from all other docs) ----
function renderPrintUebersicht() {
  // Resolve a shared field by checking state.shared first, then any doc that has it
  function getShared(field) {
    if (state.shared[field]) return state.shared[field];
    // Fallback: look across all docs that have this shared field
    for (const docId of Object.keys(SHARED_FIELD_MAP)) {
      const map = SHARED_FIELD_MAP[docId];
      for (const key of Object.keys(map)) {
        if (map[key] !== field) continue;
        const v = state.docs[docId]?.answers?.[key];
        if (v && typeof v === "string") return v;
      }
    }
    return "";
  }
  function getRowsFor(docId, secId) {
    return state.docs[docId]?.rows?.[secId] || [];
  }
  function getDocAnswer(docId, secId, fId) {
    const v = state.docs[docId]?.answers?.[`${secId}.${fId}`];
    if (v && typeof v === "object" && v.skipped) return "";
    return typeof v === "string" ? v : "";
  }
  function countDoneSections(docId) {
    const prev = state.activeDocId; state.activeDocId = docId;
    let done = 0, total = 0;
    DOCS[docId].sections.forEach(sec => {
      if (sec.type === "review") return;
      total++;
      const st = sectionStatus(sec);
      if (st === "done") done++;
    });
    state.activeDocId = prev;
    return { done, total };
  }

  const name = getShared("name");
  const geb = getShared("geburtsdatum");
  const adr = getShared("anschrift");
  const tel = getShared("telefon");
  const az = getShared("aktenzeichen");
  const bh = getShared("bewaehrungshelfer");

  // EAR snapshot
  let earBlock = "";
  const earState = countDoneSections("ear");
  if (earState.done > 0) {
    const prev = state.activeDocId; state.activeDocId = "ear";
    const t = totalsBySide();
    state.activeDocId = prev;
    earBlock = `<table>
      <tr><th colspan="2">📋 Einnahmen-Ausgaben-Rechnung</th></tr>

      <tr><td>Ausgaben Haushalt</td><td>${moneyOnly(t.aus)} €</td></tr>
      <tr><td class="sum">Saldo (monatlich)</td><td class="sum" style="color:${t.saldo >= 0 ? '#5BA572' : '#dc2626'}">${moneyOnly(t.saldo)} €</td></tr>
      <tr><td>Bearbeitungsstand</td><td>${earState.done} von ${earState.total} Abschnitten ausgefüllt</td></tr>
    </table>`;

      <tr><td>Bildungsstationen</td><td>${totals.bildung}</td></tr>
