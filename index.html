      ${gesamt > 0 ? `<tr><td>Gesamtbetrag (Auflage)</td><td>${moneyOnly(gesamt)} €</td></tr>` : ""}
      ${rate > 0 ? `<tr><td>Monatliche Rate</td><td>${moneyOnly(rate)} €</td></tr>` : ""}
      <tr><td>Bisher gezahlt</td><td>${moneyOnly(gezahlt)} €${gesamt > 0 ? ` (${pct}%)` : ""}</td></tr>
      ${gesamt > 0 ? `<tr><td class="sum">Noch offen</td><td class="sum" style="color:${rest === 0 ? '#5BA572' : '#d97706'}">${moneyOnly(rest)} €</td></tr>` : ""}
      <tr><td>Erfasste Zahlungen</td><td>${rows.length}</td></tr>
    </table>`;
  }

  // Sozial snapshot
  const sozialState = countDoneSections("sozial");
  let sozialBlock = "";
  if (sozialState.done > 0) {
    const stundenGesamt = parseMoney(getDocAnswer("sozial","auflage","stunden_gesamt"));
    const rows = getRowsFor("sozial","stunden").filter(r => r.datum || r.stunden);
    const stundenSum = rows.reduce((s, r) => s + parseMoney(r.stunden || ""), 0);
    const rest = Math.max(0, stundenGesamt - stundenSum);
    const pct = stundenGesamt > 0 ? Math.round((stundenSum / stundenGesamt) * 100) : 0;
    sozialBlock = `<table>
      <tr><th colspan="2">🤝 Sozialstunden-Nachweis</th></tr>
      ${stundenGesamt > 0 ? `<tr><td>Auflage Gesamtstunden</td><td>${stundenGesamt.toLocaleString("de-DE")} h</td></tr>` : ""}
      <tr><td>Geleistet bisher</td><td>${stundenSum.toLocaleString("de-DE")} h${stundenGesamt > 0 ? ` (${pct}%)` : ""}</td></tr>
      ${stundenGesamt > 0 ? `<tr><td class="sum">Noch zu leisten</td><td class="sum" style="color:${rest === 0 ? '#5BA572' : '#d97706'}">${rest.toLocaleString("de-DE")} h</td></tr>` : ""}
      <tr><td>Erfasste Einsätze</td><td>${rows.length}</td></tr>
    </table>`;
  }

  // Asservate snapshot
  const asservateState = countDoneSections("asservate");
  let asservateBlock = "";
  if (asservateState.done > 0) {
    const azSta = getDocAnswer("asservate","verfahren","az_sta");
    const behoerde = getDocAnswer("asservate","verfahren","behoerde");
    const rows = getRowsFor("asservate","gegenstaende").filter(r => r.bezeichnung || r.seriennr || r.marke);
    const erhalten = rows.filter(r => (r.status || "").toLowerCase().includes("erhalten")).length;
    const offen = rows.filter(r => !(r.status || "").toLowerCase().includes("erhalten") && !(r.status || "").toLowerCase().includes("eingezogen")).length;
    asservateBlock = `<table>
      <tr><th colspan="2">📦 Beweismittel & Asservate</th></tr>
      ${azSta ? `<tr><td>Aktenzeichen StA</td><td>${esc(azSta)}</td></tr>` : ""}
      ${behoerde ? `<tr><td>Staatsanwaltschaft</td><td>${esc(behoerde)}</td></tr>` : ""}
      <tr><td>Erfasste Gegenstände</td><td>${rows.length}</td></tr>
      ${rows.length > 0 ? `<tr><td>Davon zurückerhalten</td><td>${erhalten}</td></tr>` : ""}
      ${rows.length > 0 ? `<tr><td class="sum">Noch ausstehend</td><td class="sum" style="color:${offen === 0 ? '#5BA572' : '#d97706'}">${offen}</td></tr>` : ""}
    </table>`;
  }

  // BH-Termine snapshot
  const bhtermineState = countDoneSections("bhtermine");
  let bhtermineBlock = "";
  if (bhtermineState.done > 0) {
    const naechsterDatum = getDocAnswer("bhtermine","naechster","datum");
    const naechsterUhrzeit = getDocAnswer("bhtermine","naechster","uhrzeit");
    const rows = getRowsFor("bhtermine","termine").filter(r => r.datum || r.themen);
    const wahrgenommen = rows.filter(r => (r.status || "").toLowerCase().includes("wahrgenommen")).length;
    const abgesagt = rows.filter(r => (r.status || "").toLowerCase().includes("abgesagt") || (r.status || "").toLowerCase().includes("nicht")).length;
    bhtermineBlock = `<table>
      <tr><th colspan="2">📞 BH-Termine & Gespräche</th></tr>
      <tr><td>Erfasste Termine</td><td>${rows.length}</td></tr>
      ${rows.length > 0 ? `<tr><td>Davon wahrgenommen</td><td>${wahrgenommen}</td></tr>` : ""}
      ${abgesagt > 0 ? `<tr><td>Davon abgesagt / nicht wahrgenommen</td><td style="color:#d97706">${abgesagt}</td></tr>` : ""}
      ${naechsterDatum ? `<tr><td class="sum">Nächster Termin</td><td class="sum">${esc(naechsterDatum)}${naechsterUhrzeit ? `, ${esc(naechsterUhrzeit)}` : ""}</td></tr>` : ""}
    </table>`;
  }

  // Verfahrenskosten snapshot
  const kostenState = countDoneSections("kosten");
  let kostenBlock = "";
  if (kostenState.done > 0) {
    const geldstrafeGesamt = parseMoney(getDocAnswer("kosten","geldstrafe","betrag_gesamt"));
    const gerichtskostenGesamt = parseMoney(getDocAnswer("kosten","gerichtskosten","betrag_gesamt"));
    const weitereRows = getRowsFor("kosten","weitere_kosten").filter(r => r.betrag);
    const weitereSum = weitereRows.reduce((s, r) => s + parseMoney(r.betrag || ""), 0);
    const zahlungenRows = getRowsFor("kosten","zahlungen").filter(r => r.betrag);
    const gezahlt = zahlungenRows.reduce((s, r) => s + parseMoney(r.betrag || ""), 0);
    const gesamt = geldstrafeGesamt + gerichtskostenGesamt + weitereSum;
    const rest = Math.max(0, gesamt - gezahlt);
    const pct = gesamt > 0 ? Math.round((gezahlt / gesamt) * 100) : 0;
    kostenBlock = `<table>
      <tr><th colspan="2">💸 Verfahrenskosten & Geldstrafe</th></tr>
      ${geldstrafeGesamt > 0 ? `<tr><td>Geldstrafe</td><td>${moneyOnly(geldstrafeGesamt)} €</td></tr>` : ""}
      ${gerichtskostenGesamt > 0 ? `<tr><td>Gerichtskosten</td><td>${moneyOnly(gerichtskostenGesamt)} €</td></tr>` : ""}
      ${weitereSum > 0 ? `<tr><td>Weitere Kosten (${weitereRows.length})</td><td>${moneyOnly(weitereSum)} €</td></tr>` : ""}
      ${gesamt > 0 ? `<tr><td>Gesamt</td><td><strong>${moneyOnly(gesamt)} €</strong></td></tr>` : ""}
      <tr><td>Bisher gezahlt</td><td>${moneyOnly(gezahlt)} €${gesamt > 0 ? ` (${pct}%)` : ""}</td></tr>
      ${gesamt > 0 ? `<tr><td class="sum">Noch offen</td><td class="sum" style="color:${rest === 0 ? '#5BA572' : '#d97706'}">${moneyOnly(rest)} €</td></tr>` : ""}
    </table>`;
  }

  // Reihenfolge wie auf der Startseite: BH-Termine zuerst, dann Standard-Pflichten, dann Spezial
  const blocks = [bhtermineBlock, earBlock, schadensBlock, kostenBlock, sozialBlock, theraBlock, zeitBlock, asservateBlock].filter(b => b);
  const personalRows = [
    ["Name, Vorname", name], ["Geburtsdatum", geb],
    ["Anschrift", adr], ["Telefon", tel],
    ["Aktenzeichen Bewährungshilfe", az], ["Bewährungshelfer/in", bh],
  ].filter(p => p[1]);
  let personalTbl = "";
  if (personalRows.length > 0) {
    personalTbl = `<table>`;
    for (let i = 0; i < personalRows.length; i += 2) {
      const L = personalRows[i], R = personalRows[i+1];
      if (R) personalTbl += `<tr><td class="label">${esc(L[0])}</td><td>${esc(L[1])}</td><td class="label">${esc(R[0])}</td><td>${esc(R[1])}</td></tr>`;
      else personalTbl += `<tr><td class="label">${esc(L[0])}</td><td>${esc(L[1])}</td><td colspan="2">&nbsp;</td></tr>`;
    }
    personalTbl += `</table>`;
  }

  return `
    <h1>Status-Übersicht</h1>
    <div class="subtitle">Gesamtstand zum ${new Date().toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric" })}</div>
    ${personalTbl ? `<h2>Persönliche Angaben</h2>${personalTbl}` : ""}
    ${blocks.length > 0 ? blocks.join("\n") : `<p style="font-style:italic; color:#888; margin-top:20pt;">Noch keine Daten in den Dokumenten erfasst. Bitte erst die anderen Dokumente ausfüllen.</p>`}
    <p style="font-size:8pt; font-style:italic; color:#666; margin-top:14pt;">Diese Übersicht wurde automatisch aus den anderen Dokumenten erstellt. Detail-Dokumente liegen separat vor.</p>
  `;
}

// ---- BH-Termine print ----
function renderPrintBhtermine() {
  const ans = (s, f) => valOrSkipPrint(s, f);
  function pairsTable(pairsAll) {
    const pairs = filterPairs(pairsAll.filter(p => p[0]));
    if (pairs.length === 0) return "";
    let t = `<table>`;
    for (let i=0; i<pairs.length; i+=2) {
      const L = pairs[i], R = pairs[i+1];
      if (R) t += `<tr>${tdLabel(L[0],false)}${tdValue(L[1].value)}${tdLabel(R[0],false)}${tdValue(R[1].value)}</tr>`;
      else t += `<tr>${tdLabel(L[0],false)}${tdValue(L[1].value)}<td colspan="2">&nbsp;</td></tr>`;
    }
    return t + `</table>`;
  }
  const personalTbl = pairsTable([
    ["Name, Vorname", ans("personal","name")], ["Geburtsdatum", ans("personal","geburtsdatum")],
    ["Aktenzeichen Bewährungshilfe", ans("personal","aktenzeichen")], ["Bewährungshelfer/in", ans("personal","bewaehrungshelfer")],
  ]);
  const termineRows = (getDocState().rows && getDocState().rows.termine) || [];
  const filtered = termineRows.map((r, i) => ({ ...r, _origIdx: i })).filter(r => r.datum || r.themen);
  let termineTbl = "";
  if (filtered.length > 0) {
    termineTbl = `<table>
      <tr><th>Datum</th><th>Uhrzeit</th><th>Art</th><th>Besprochene Themen</th><th>Vereinbarungen / nächste Schritte</th><th>Status</th><th>Unterschrift BH</th></tr>`;
    filtered.forEach(r => {
      const rowSigHtml = renderPrintRowSignature("bhtermine", "termine", r._origIdx);
      const ver = esc(r.vereinbarungen || "");
      const notizText = esc(r.notiz || "").replace(/\n/g, "<br>");
      let verCell = "";
      if (ver && notizText) {
        verCell = `${ver}<br><span style="font-size:8pt; color:#555; font-style:italic;">📝 ${notizText}</span>`;
      } else if (ver) {
        verCell = ver;
      } else if (notizText) {
        verCell = `<span style="font-size:9pt; font-style:italic;">📝 ${notizText}</span>`;
      } else {
        verCell = "";
      }
      termineTbl += `<tr>
        <td>${esc(r.datum || "")}</td>
        <td>${esc(r.uhrzeit || "")}</td>
        <td>${esc(r.art || "")}</td>
        <td>${esc(r.themen || "")}</td>
        <td>${verCell}</td>
        <td>${esc(r.status || "")}</td>
        <td style="height:30pt; vertical-align:middle;">${rowSigHtml || "&nbsp;"}</td>
      </tr>`;
    });
    termineTbl += `</table>`;
  } else {
    termineTbl = `<p style="font-style:italic; color:#888;">(keine Termine erfasst)</p>`;
  }
  // Nächster Termin
  const nextPairs = [
    ["Datum", ans("naechster","datum")], ["Uhrzeit", ans("naechster","uhrzeit")],
    ["Ort", ans("naechster","ort")],
  ];
  const nextTbl = pairsTable(nextPairs);
  const vorbereitung = ans("naechster", "vorbereitung");
  const vorbereitungSection = (!vorbereitung.skipped && vorbereitung.value)
    ? `<p style="margin-top:8pt;"><strong>Vorbereitung / zu besprechen:</strong></p><p>${esc(vorbereitung.value).replace(/\n/g, "<br>")}</p>`
    : "";
  const note = ans("anmerkung", "notes");
  const noteSection = (!note.skipped && note.value)
    ? `<h2>Notizen</h2>${note.value.split("\n").map(l => `<p>${esc(l) || "&nbsp;"}</p>`).join("")}`
    : "";

  return `
    <h1>Bewährungshilfe-Termine</h1>
    <div class="subtitle">Übersicht der Termine und Gespräche</div>
    ${personalTbl ? `<h2>Persönliche Angaben</h2>${personalTbl}` : ""}
    <h2>Termine</h2>${termineTbl}
    ${nextTbl || vorbereitungSection ? `<h2>Nächster Termin</h2>${nextTbl}${vorbereitungSection}` : ""}
    ${noteSection}
    ${renderPrintSignatures("bhtermine", { counterRoleLabel: "Bewährungshelfer:in (optional)", probandLabel: "Bewährter / Bewährte" })}
    <p style="font-size:8pt; font-style:italic; color:#666; margin-top:14pt;">Persönliche Notizen zur eigenen Vorbereitung und Übersicht.</p>
    ${renderPrintVerificationFooter("bhtermine")}
  `;
}

  const kasseAnschrift = ans("verfahren","behoerde_kasse_anschrift");

    weitereTbl = `<table>

        <td>${esc(r.art || "")}</td>
        <td>${esc(r.beschreibung || "")}</td>

    zahlungenTbl += `</table>`;

    ["Datum Antrag Ratenzahlung", ans("antraege","ratenzahlung_datum")], ["Status", ans("antraege","ratenzahlung_status")],

  ]);

    : "";

// ============================================
// PRINT MEINE ZIELE
// ============================================
// Persönliche Ziel-Übersicht: einfache, ruhige Druckansicht. Status-farbcodiert
// so dass „erreicht" sofort sichtbar ist — das ist der Sinn des Drucks: dem
// Nutzer (oder seiner BH) die eigenen Fortschritte greifbar zeigen.
function renderPrintZiele() {
  const ans = (s, f) => valOrSkipPrint(s, f);
  function pairsTable(pairsAll) {
    const pairs = filterPairs(pairsAll.filter(p => p[0]));
    if (pairs.length === 0) return "";
    let t = `<table>`;
    for (let i = 0; i < pairs.length; i += 2) {
      const L = pairs[i], R = pairs[i+1];
      if (R) t += `<tr>${tdLabel(L[0],false)}${tdValue(L[1].value)}${tdLabel(R[0],false)}${tdValue(R[1].value)}</tr>`;
      else t += `<tr>${tdLabel(L[0],false)}${tdValue(L[1].value)}<td colspan="2">&nbsp;</td></tr>`;
    }
    return t + `</table>`;
  }
  const personalTbl = pairsTable([
    ["Name, Vorname", ans("personal","name")], ["Geburtsdatum", ans("personal","geburtsdatum")],
  ]);

  // Ziele-Zeilen
  const rows = (getDocState().rows && getDocState().rows.ziele) || [];
  const filtered = rows.filter(r => r.bezeichnung);
  // Sortierung: erreicht zuletzt, sonst nach Status-Reihenfolge
  function statusOrder(s) {
    const x = (s || "").toLowerCase();
    if (x.includes("in arbeit")) return 1;
    if (x.includes("offen")) return 2;
    if (x.includes("erreicht")) return 4;
    if (x.includes("aufgegeben")) return 5;
    return 3;
  }
  const sorted = [...filtered].sort((a, b) => statusOrder(a.status) - statusOrder(b.status));

  function statusBadge(s) {
    const x = (s || "").toLowerCase();
    let bg = "#eee", color = "#333", icon = "";
    if (x.includes("erreicht")) { bg = "#dcfce7"; color = "#166534"; icon = "✓ "; }
    else if (x.includes("in arbeit")) { bg = "#dbeafe"; color = "#1e40af"; icon = "⟳ "; }
    else if (x.includes("offen")) { bg = "#fef3c7"; color = "#92400e"; icon = "○ "; }
    else if (x.includes("aufgegeben")) { bg = "#fee2e2"; color = "#991b1b"; icon = "× "; }
    return `<span style="display:inline-block; padding:1pt 6pt; border-radius:999px; background:${bg}; color:${color}; font-size:9pt; font-weight:600;">${icon}${esc(s || "—")}</span>`;
  }

  let zieleHtml = "";
  if (sorted.length === 0) {
    zieleHtml = `<p style="font-style:italic; color:#888;">(noch keine Ziele erfasst)</p>`;
  } else {
    sorted.forEach((r, i) => {
      const blocks = [];
      if (r.warum) blocks.push(`<p style="margin:4pt 0;"><strong>Warum mir das wichtig ist:</strong><br>${esc(r.warum).replace(/\n/g, "<br>")}</p>`);
      if (r.etappen) blocks.push(`<p style="margin:4pt 0;"><strong>Nächste Schritte:</strong><br>${esc(r.etappen).replace(/\n/g, "<br>")}</p>`);
      if (r.fortschritt) blocks.push(`<p style="margin:4pt 0;"><strong>Schon getan:</strong><br>${esc(r.fortschritt).replace(/\n/g, "<br>")}</p>`);
      const meta = [];
      if (r.kategorie) meta.push(`<span>Bereich: <strong>${esc(r.kategorie)}</strong></span>`);
      if (r.zieldatum) meta.push(`<span>Zieldatum: <strong>${esc(r.zieldatum)}</strong></span>`);
      if (r.datum_erreicht) meta.push(`<span style="color:#166534;">Erreicht am: <strong>${esc(r.datum_erreicht)}</strong></span>`);
      zieleHtml += `
        <div style="margin: 10pt 0; padding: 10pt; border: 1px solid #ccc; border-radius: 4pt; page-break-inside: avoid;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10pt; margin-bottom:6pt;">
            <h3 style="margin:0; font-size:13pt;">${i+1}. ${esc(r.bezeichnung)}</h3>
            ${statusBadge(r.status)}
          </div>
          ${meta.length > 0 ? `<div style="display:flex; gap:14pt; font-size:10pt; color:#555; margin-bottom:6pt; flex-wrap:wrap;">${meta.join("")}</div>` : ""}
          ${blocks.join("")}
        </div>`;
    });
  }

  const rueckblick = ans("rueckblick", "notes");
  const rueckblickSec = (!rueckblick.skipped && rueckblick.value)
    ? `<h2>Rückblick und Erkenntnisse</h2>${rueckblick.value.split("\n").map(l => `<p>${esc(l) || "&nbsp;"}</p>`).join("")}`
    : "";

  // Mini-Zusammenfassung
  const erreicht = filtered.filter(r => (r.status || "").toLowerCase().includes("erreicht")).length;
  const inArbeit = filtered.filter(r => (r.status || "").toLowerCase().includes("in arbeit")).length;
  const offen = filtered.filter(r => (r.status || "").toLowerCase().includes("offen")).length;
  const summary = filtered.length > 0
    ? `<div style="margin: 10pt 0; padding: 8pt 12pt; background: #f5f5f5; border-radius: 4pt; font-size: 11pt;">
        <strong>${filtered.length} Ziele insgesamt</strong> · ${erreicht} erreicht · ${inArbeit} in Arbeit · ${offen} offen
      </div>`
    : "";

  return `
    <h1>Meine Ziele</h1>
    <div class="subtitle">Persönliche Ziele, Etappen und Fortschritt</div>
    ${personalTbl ? `<h2>Persönliche Angaben</h2>${personalTbl}` : ""}
    ${summary}
    <h2>Ziele</h2>
    ${zieleHtml}
    ${rueckblickSec}
    <p style="font-size:8pt; font-style:italic; color:#666; margin-top:14pt;">Persönliche Übersicht zur Selbstreflexion und ggf. zur Vorlage bei der Bewährungshilfe.</p>
  `;
}

// ============================================
// DOCX GENERATION (lazy load library)
// ============================================
let docxLoading = null;
function loadDocxLib() {
  if (window.docx) return Promise.resolve();
  if (docxLoading) return docxLoading;
  // docx 9.x: the browser build is index.iife.js. We must NOT use .cjs files -
  // CDNs serve them as "application/node" which browsers refuse to run as <script>.
  const sources = [
    "https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js",
    "https://unpkg.com/docx@9.5.1/dist/index.iife.js"
  ];
  docxLoading = new Promise((resolve, reject) => {
    let idx = 0;
    function tryNext() {
      if (idx >= sources.length) {
        reject(new Error("Konnte die Word-Bibliothek nicht laden. Bitte Internetverbindung prüfen. Tipp: Du kannst stattdessen „🖨 Drucken / als PDF\" nutzen - das funktioniert auch ohne Internet."));
        return;
      }
      const url = sources[idx++];
      const s = document.createElement("script");
      s.src = url;
      s.onload = () => {
        if (window.docx && (window.docx.Document || window.docx.Packer)) {
          resolve();
        } else {
          tryNext();
        }
      };
      s.onerror = () => tryNext();
      document.head.appendChild(s);
    }
    tryNext();
  });
  return docxLoading;
}

async function generateDoc() {
  const btn = document.getElementById("genBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Erstelle Dokument..."; }
  try {
    await loadDocxLib();
    const id = state.activeDocId;
    let blob, filename;
    if (id === "ear") { blob = await buildEarDocx(); filename = "Einnahmen-Ausgaben-Rechnung"; }
    else if (id === "zeit") { blob = await buildZeitDocx(); filename = "Zeitstrahl-Lebensverlauf"; }
    else if (id === "thera") { blob = await buildTheraDocx(); filename = "Therapie-Terminbestaetigung"; }
    else if (id === "schadens") { blob = await buildSchadensDocx(); filename = "Schadenswiedergutmachung"; }
    else if (id === "sozial") { blob = await buildSozialDocx(); filename = "Sozialstunden-Nachweis"; }
    else if (id === "asservate") { blob = await buildAsservateDocx(); filename = "Asservate-Beweismittel"; }
    else if (id === "kosten") { blob = await buildKostenDocx(); filename = "Verfahrenskosten"; }
    else if (id === "bhtermine") { blob = await buildBhtermineDocx(); filename = "BH-Termine"; }
    else if (id === "uebersicht") { alert("Für die Status-Übersicht bitte \u201EDrucken / als PDF speichern\u201C verwenden."); if (btn) { btn.disabled = false; btn.textContent = "📄 Word-Dokument erstellen"; } return; }
    else { alert("Für dieses Dokument ist (noch) kein Word-Export verfügbar. Bitte \u201E🖨 Drucken / als PDF\u201C nutzen \u2014 das funktioniert für alle Dokumente und enthält alle eingegebenen Daten."); if (btn) { btn.disabled = false; btn.textContent = "📄 Word-Dokument erstellen"; } return; }
    // Add name suffix if available
    const userName = (state.shared.name || "").replace(/[^a-zA-Z0-9äöüÄÖÜß_-]/g, "_");
    if (userName) filename += "_" + userName;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename + ".docx";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if (btn) { btn.disabled = false; btn.textContent = "✓ Heruntergeladen - nochmal erstellen"; }
  } catch (e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.textContent = "📄 Word-Dokument erstellen"; }
    alert("Fehler: " + e.message + "\n\nTipp: Du kannst stattdessen die Druckansicht verwenden – die funktioniert auch ohne Internetverbindung.");
  }
}

// ---- Shared docx helpers ----
function docxBase() {
  const D = window.docx;
  const border = { style: D.BorderStyle.SINGLE, size: 4, color: "999999" };
  return {
    D, border,
    borders: { top: border, bottom: border, left: border, right: border },
    cellMargins: { top: 80, bottom: 80, left: 120, right: 120 },
    PAGE_W: 11906, PAGE_H: 16838, MARGIN: 1080,
    COLOR_HEADER: "2E5984", COLOR_SUB: "B8CCE4", COLOR_ZEILE: "F2F2F2",
  };
}
function docxP(text, opts = {}) {
  const D = window.docx;
  return new D.Paragraph({
    children: [new D.TextRun({ text: text || "", ...opts })],
    spacing: { after: opts.after || 60 },
    alignment: opts.align,
  });
}
function docxH1(text) {
  const { D, COLOR_HEADER } = docxBase();
  return new D.Paragraph({
    children: [new D.TextRun({ text, bold: true, size: 28, color: "FFFFFF" })],
    shading: { fill: COLOR_HEADER, type: D.ShadingType.CLEAR },
    spacing: { before: 240, after: 120 }, indent: { left: 80 }
  });
}
function docxCell(text, opts = {}) {
  const { D, borders, cellMargins } = docxBase();
  const para = new D.Paragraph({
    children: [new D.TextRun({
      text, bold: opts.bold, size: opts.size || 20,
      strike: opts.strike, color: opts.strike ? "888888" : (opts.color || "000000")
    })],
    alignment: opts.align
  });
  return new D.TableCell({
    borders,
    width: { size: opts.width, type: D.WidthType.DXA },
    shading: opts.shade ? { fill: opts.shade, type: D.ShadingType.CLEAR } : undefined,
    margins: cellMargins,
    children: [para]
  });
}
function docxBlankCell(width) {
  const { D, borders, cellMargins } = docxBase();
  return new D.TableCell({
    borders,
    width: { size: width, type: D.WidthType.DXA },
    margins: cellMargins,
    children: [new D.Paragraph({ children: [new D.TextRun({ text: " " })] })]
  });
}
function docxSignature(width) {
  const { D, border, cellMargins } = docxBase();
  const half = Math.floor(width / 2);
  return new D.Table({
    width: { size: width, type: D.WidthType.DXA },
    columnWidths: [half, width - half],
    rows: [new D.TableRow({ children: [
      new D.TableCell({
        borders: { top: border, bottom: { style: D.BorderStyle.NONE }, left: { style: D.BorderStyle.NONE }, right: { style: D.BorderStyle.NONE }},
        width: { size: half, type: D.WidthType.DXA }, margins: cellMargins,
        children: [docxP("Ort, Datum", { size: 18, color: "666666" })]
      }),
      new D.TableCell({
        borders: { top: border, bottom: { style: D.BorderStyle.NONE }, left: { style: D.BorderStyle.NONE }, right: { style: D.BorderStyle.NONE }},
        width: { size: width - half, type: D.WidthType.DXA }, margins: cellMargins,
        children: [docxP("Unterschrift", { size: 18, color: "666666" })]
      })
    ]})]
  });
}

// Convert base64 dataUrl to Uint8Array for docx ImageRun
function dataUrlToBytes(dataUrl) {
  if (!dataUrl) return null;
  const m = dataUrl.match(/^data:[^;]+;base64,(.+)$/);
  if (!m) return null;
  const b64 = m[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

// New: signature block with optional digital signatures (proband + counter)
function docxSignatureBlock(width, docId, opts) {
  // opts: { counterRoleLabel, probandLabel }
  opts = opts || {};
  const { D, border, cellMargins } = docxBase();
  const half = Math.floor(width / 2);
  const probandSig = getSignature(docId, "gesamt_proband");
  const counterSig = getSignature(docId, "gesamt");
  const probandName = (state.shared && state.shared.name) || "";
  const probandLabel = opts.probandLabel || "Proband:in";
  const counterRoleLabel = opts.counterRoleLabel || "Bestätigt durch";

  function buildCell(sig, fallbackLabel, fallbackName, cellWidth) {
    const cellChildren = [];
    if (sig && sig.dataUrl) {
      try {
        const bytes = dataUrlToBytes(sig.dataUrl);
        if (bytes) {
          cellChildren.push(new D.Paragraph({
            children: [new D.ImageRun({
              data: bytes,
              transformation: { width: 180, height: 60 }
            })]
          }));
        }
      } catch (e) { /* fall through */ }
    }
    // The signature line itself
    cellChildren.push(docxP(sig && sig.signerName ? sig.signerName : (fallbackName || ""),
      { size: 20, bold: !!(sig && sig.signerName), after: 0 }));
    if (sig && sig.timestamp) {
      cellChildren.push(docxP(`Digital unterzeichnet am ${fmtSigTimestamp(sig.timestamp)}`,
        { size: 16, color: "666666", italics: true, after: 0 }));
    }
    cellChildren.push(docxP(fallbackLabel, { size: 18, color: "666666", after: 0 }));
    if (!sig) {
      cellChildren.push(docxP("(Ort, Datum, Unterschrift)", { size: 16, color: "888888", italics: true }));
    }
    return new D.TableCell({
      borders: { top: border, bottom: { style: D.BorderStyle.NONE }, left: { style: D.BorderStyle.NONE }, right: { style: D.BorderStyle.NONE }},
      width: { size: cellWidth, type: D.WidthType.DXA }, margins: cellMargins,
      children: cellChildren
    });
  }

  return new D.Table({
    width: { size: width, type: D.WidthType.DXA },
    columnWidths: [half, width - half],
    rows: [new D.TableRow({ children: [
      buildCell(probandSig, probandLabel, probandName, half),
      buildCell(counterSig, counterRoleLabel, "", width - half)
    ]})]
  });
}

      })]})]

  const patientPairs = [

    ["Geburtsdatum:", v("patient","geburtsdatum").value, v("patient","geburtsdatum").skipped],
    ["Anschrift:", v("patient","anschrift").value, v("patient","anschrift").skipped],
    ["Telefon:", v("patient","tel").value, v("patient","tel").skipped],
    ["Aktenzeichen Bewährungshilfe:", v("patient","aktenzeichen").value, v("patient","aktenzeichen").skipped],
    ["Bewährungshelfer/in:", v("patient","bewaehrungshelfer").value, v("patient","bewaehrungshelfer").skipped],

    ["Geplantes Ende:", v("therapie_info","ende").value, v("therapie_info","ende").skipped],
    ["Verfahren / Methode:", v("therapie_info","methode").value, v("therapie_info","methode").skipped],
    ["Frequenz:", v("therapie_info","frequenz").value, v("therapie_info","frequenz").skipped],
    ["Dauer pro Sitzung:", v("therapie_info","dauer").value, v("therapie_info","dauer").skipped],
    ["Setting:", v("therapie_info","setting").value, v("therapie_info","setting").skipped],
    ["Sitzungen bewilligt:", v("therapie_info","sitzungen").value, v("therapie_info","sitzungen").skipped],
    ["Kostenträger:", v("therapie_info","kostentraeger").value, v("therapie_info","kostentraeger").skipped],
    ["Behandlungsanlass / -ziel:", v("therapie_info","anlass").value, v("therapie_info","anlass").skipped],
  ];

  const therArt = DOCS.thera.sections.find(s => s.id === "therapieart");
  const therChecks = getChecks("therapieart");
  const checkedTherArt = therArt.options.filter(o => therChecks[o]);
  const sp = DOCS.thera.sections.find(s => s.id === "schweigepflicht");
  const spChecks = getChecks("schweigepflicht");
  const checkedSp = sp.options.filter(o => spChecks[o]);

  // Termine table - more rows for multiple sessions
  const termineRows = getRows("termine");
  const termineWidths = [1300, 1100, 900, 1500, 1400, 1746, 1796]; // sum 9746
  const termineHeader = ["Datum", "Uhrzeit", "Dauer", "Art", "Wahrgenommen", "Bemerkung", "Unterschrift / Stempel"];
  const tRows = [new D.TableRow({ tableHeader: true, children: termineHeader.map((h,i) =>
    docxCell(h, { width: termineWidths[i], bold: true, shade: COLOR_SUB, size: 18, align: D.AlignmentType.CENTER })
  )})];
  const minTermineRows = 15;
  const targetTermine = Math.max(termineRows.length + 5, minTermineRows);
  for (let i = 0; i < targetTermine; i++) {
    const r = termineRows[i] || {};
    const sh = i % 2 === 0 ? COLOR_ZEILE : null;
    tRows.push(new D.TableRow({ children: [
      docxCell(r.datum || " ", { width: termineWidths[0], shade: sh, size: 18 }),
      docxCell(r.uhrzeit || " ", { width: termineWidths[1], shade: sh, size: 18 }),
      docxCell(r.dauer || " ", { width: termineWidths[2], shade: sh, size: 18 }),
      docxCell(r.art || " ", { width: termineWidths[3], shade: sh, size: 18 }),
      docxCell("☐ ja  ☐ nein", { width: termineWidths[4], shade: sh, size: 18 }),
      docxCell(" ", { width: termineWidths[5], shade: sh, size: 18 }),
      new D.TableCell({
        borders: docxBase().borders,
        width: { size: termineWidths[6], type: D.WidthType.DXA },
        shading: sh ? { fill: sh, type: D.ShadingType.CLEAR } : undefined,
        margins: cellMargins,
        children: [docxP(" "), docxP(" ")]
      })
    ]}));
  }
  const termineTable = new D.Table({
    width: { size: termineWidths.reduce((a,b)=>a+b,0), type: D.WidthType.DXA },
    columnWidths: termineWidths, rows: tRows
  });

  const patName = v("patient","name").value || "_____________________________________";
  const bemVal = v("bemerkung","notes");

  const children = [
    briefkopfTable,
    new D.Paragraph({ spacing: { after: 240 }, children: [new D.TextRun({ text: "" })] }),
    new D.Paragraph({ children: [new D.TextRun({ text: "Bestätigung der Therapieteilnahme", bold: true, size: 32, color: "1F3864" })], alignment: D.AlignmentType.CENTER, spacing: { after: 80 } }),
    new D.Paragraph({ children: [new D.TextRun({ text: "zur Vorlage bei der Bewährungshilfe", italics: true, size: 22, color: "555555" })], alignment: D.AlignmentType.CENTER, spacing: { after: 240 } }),
  ];
  let secNum = 1;

  // 1. Patient
  const patTbl = infoTbl(patientPairs);
  if (patTbl) { children.push(docxH1(`${secNum++}. Patient/in`), patTbl); }

  // 2. Therapie info (only if any visible content)
  const therTbl = infoTbl(therPairs);
  if (therTbl || checkedTherArt.length > 0) {
    children.push(docxH1(`${secNum++}. Angaben zur Therapie`));
    if (therTbl) children.push(therTbl);
    if (checkedTherArt.length > 0) {
      children.push(docxP("Therapieformen:", { size: 20, bold: true, after: 80 }));
      checkedTherArt.forEach(opt => {
        children.push(docxP(`☒ ${opt}`, { size: 20, after: 60 }));
      });
    }
  }

  // 3. Termine (always shown - core of the document)
  children.push(new D.Paragraph({ children: [new D.PageBreak()] }));
  children.push(docxH1(`${secNum++}. Übersicht der Termine / Sitzungen`));
  children.push(docxP("Mehrere Termine können auf diesem einen Blatt geführt werden. Die jeweilige Wahrnehmung wird durch Unterschrift / Stempel der/des Therapeut/in bestätigt.", { italics: true, size: 18, color: "666666", after: 120 }));
  children.push(termineTable);

  // 4. Bemerkungen (only if has content)
  if (!bemVal.skipped && bemVal.value) {
    children.push(docxH1(`${secNum++}. Bemerkungen zum Therapieverlauf`));
    bemVal.value.split("\n").forEach(l => children.push(docxP(l || " ")));
  }

  // 5. Schweigepflicht (only if at least one option checked)
  if (checkedSp.length > 0) {
    children.push(docxH1(`${secNum++}. Schweigepflichtentbindung`));
    children.push(docxP(`Hiermit entbinde ich, ${patName} (Patient/in), die/den oben genannte/n Therapeut/in von der Schweigepflicht im folgenden Umfang gegenüber meiner/meinem Bewährungshelfer/in:`, { size: 20, after: 120 }));
    checkedSp.forEach(opt => {
      children.push(docxP(`☒ ${opt}`, { size: 20, after: 60 }));
    });
    children.push(docxP("Diese Entbindung kann jederzeit schriftlich widerrufen werden.", { size: 18, italics: true, color: "666666", after: 360 }));
  } else {
    children.push(new D.Paragraph({ spacing: { before: 360 }, children: [new D.TextRun({ text: "" })] }));
  }

  // Signature blocks
  function sigBlock(label) {
    const half = Math.floor(CONTENT_W / 2);
    return new D.Table({
      width: { size: CONTENT_W, type: D.WidthType.DXA },
      columnWidths: [half, CONTENT_W - half],
      rows: [new D.TableRow({ children: [
        new D.TableCell({
          borders: { top: border, bottom: { style: D.BorderStyle.NONE }, left: { style: D.BorderStyle.NONE }, right: { style: D.BorderStyle.NONE }},
          width: { size: half, type: D.WidthType.DXA }, margins: cellMargins,
          children: [docxP("Ort, Datum", { size: 18, color: "666666" })]
        }),
        new D.TableCell({
          borders: { top: border, bottom: { style: D.BorderStyle.NONE }, left: { style: D.BorderStyle.NONE }, right: { style: D.BorderStyle.NONE }},
          width: { size: CONTENT_W - half, type: D.WidthType.DXA }, margins: cellMargins,
          children: [docxP(label, { size: 18, color: "666666" })]
        })
      ]})]
    });
  }
  children.push(sigBlock("Unterschrift Patient/in"));
  children.push(new D.Paragraph({ spacing: { after: 480 }, children: [new D.TextRun({ text: "" })] }));
  children.push(docxH1(`${secNum++}. Bestätigung durch die/den Therapeut/in`));
  children.push(docxP("Ich bestätige hiermit die in dieser Übersicht aufgeführten Angaben sowie die Wahrnehmung der oben angegebenen Termine.", { size: 20, after: 360 }));
  children.push(sigBlock("Unterschrift / Stempel Therapeut/in"));

  const doc = new D.Document({
    creator: "Bewährungshilfe-Assistent",
    styles: { default: { document: { run: { font: "Arial", size: 20 } } } },
    sections: [{
      properties: { page: { size: { width: PAGE_W, height: PAGE_H }, margin: { top: MARGIN, right: MARGIN, bottom: MARGIN, left: MARGIN } } },
      children
    }]
  });
  return await D.Packer.toBlob(doc);
}

// ---- Schadenswiedergutmachung docx ----
async function buildSchadensDocx() {
  const { D, PAGE_W, PAGE_H, MARGIN, COLOR_SUB, COLOR_ZEILE } = docxBase();
  const CONTENT_W = PAGE_W - 2 * MARGIN;
  const v = (s,f) => valOrSkipPrint(s,f);

  function infoTbl(pairsRaw) {
    const pairs = pairsRaw.filter(p => !p[2] && p[0]);
    if (pairs.length === 0) return null;
    const c1=2400, c2=2473, c3=2400, c4=2473;
    const rows = [];
    for (let i=0; i<pairs.length; i+=2) {
      const L = pairs[i], R = pairs[i+1];
      if (R) rows.push(new D.TableRow({ children: [
        docxCell(L[0], { width: c1, bold: true, shade: COLOR_ZEILE }),
        docxCell(L[1] || "", { width: c2 }),
        docxCell(R[0], { width: c3, bold: true, shade: COLOR_ZEILE }),
        docxCell(R[1] || "", { width: c4 }),
      ]})); else rows.push(new D.TableRow({ children: [
        docxCell(L[0], { width: c1, bold: true, shade: COLOR_ZEILE }),
        docxCell(L[1] || "", { width: c2 }),
        docxCell("", { width: c3 }), docxCell("", { width: c4 }),
      ]}));
    }
    return new D.Table({ width: { size: c1+c2+c3+c4, type: D.WidthType.DXA }, columnWidths: [c1,c2,c3,c4], rows });
  }

  const personalPairs = [
    ["Name, Vorname:", v("personal","name").value, v("personal","name").skipped],
    ["Geburtsdatum:", v("personal","geburtsdatum").value, v("personal","geburtsdatum").skipped],
    ["Anschrift:", v("personal","anschrift").value, v("personal","anschrift").skipped],
    ["Telefon:", v("personal","telefon").value, v("personal","telefon").skipped],
    ["Aktenzeichen Bewährungshilfe:", v("personal","aktenzeichen").value, v("personal","aktenzeichen").skipped],
    ["Bewährungshelfer/in:", v("personal","bewaehrungshelfer").value, v("personal","bewaehrungshelfer").skipped],
    ["Erstellt am:", v("personal","erstellt").value, v("personal","erstellt").skipped],
  ];
  const auflagePairs = [
    ["Gericht:", v("auflage","gericht").value, v("auflage","gericht").skipped],
    ["Aktenzeichen Gericht:", v("auflage","az_gericht").value, v("auflage","az_gericht").skipped],
    ["Datum Urteil/Beschluss:", v("auflage","urteil_datum").value, v("auflage","urteil_datum").skipped],
    ["Tat / Anlass:", v("auflage","tat").value, v("auflage","tat").skipped],
    ["Geschädigte/r:", v("auflage","geschaedigte").value, v("auflage","geschaedigte").skipped],
    ["Gesamtbetrag:", v("auflage","gesamt").value, v("auflage","gesamt").skipped],
    ["Monatliche Rate:", v("auflage","rate").value, v("auflage","rate").skipped],
    ["Beginn der Zahlungen:", v("auflage","beginn").value, v("auflage","beginn").skipped],
    ["Frist / spätestes Ende:", v("auflage","frist").value, v("auflage","frist").skipped],
  ];
  const empfPairs = [
    ["Empfänger Name:", v("empfaenger","name").value, v("empfaenger","name").skipped],
    ["Anschrift:", v("empfaenger","anschrift").value, v("empfaenger","anschrift").skipped],
    ["IBAN:", v("empfaenger","iban").value, v("empfaenger","iban").skipped],
    ["BIC:", v("empfaenger","bic").value, v("empfaenger","bic").skipped],
    ["Bank:", v("empfaenger","bank").value, v("empfaenger","bank").skipped],
    ["Verwendungszweck:", v("empfaenger","verwendung").value, v("empfaenger","verwendung").skipped],
  ];

  // Zahlungen table
  const zahlungenRows = (getDocState().rows && getDocState().rows.zahlungen) || [];
  const filtered = zahlungenRows.filter(r => r.datum || r.betrag);
  let zahlungTbl = null, gezahlt = 0;
  const cols = [1500, 1700, 2300, 1700, 2546]; // 9746 total
  const head = ["Datum", "Betrag (EUR)", "Beleg-Nr / Referenz", "Art", "Bemerkung"];
  const trs = [new D.TableRow({ tableHeader: true, children: head.map((h,i) => docxCell(h, { width: cols[i], bold: true, shade: COLOR_SUB, size: 18 }))})];
  filtered.forEach((r, i) => {
    const n = parseMoney(r.betrag || ""); gezahlt += n;
    const sh = i % 2 === 0 ? COLOR_ZEILE : null;
    trs.push(new D.TableRow({ children: [
      docxCell(r.datum || " ", { width: cols[0], shade: sh, size: 18 }),
      docxCell(r.betrag ? moneyOnly(n) : " ", { width: cols[1], shade: sh, size: 18 }),
      docxCell(r.beleg || " ", { width: cols[2], shade: sh, size: 18 }),
      docxCell(r.art || " ", { width: cols[3], shade: sh, size: 18 }),
      docxCell(r.bemerkung || " ", { width: cols[4], shade: sh, size: 18 }),
    ]}));
  });
  if (filtered.length > 0) {
    trs.push(new D.TableRow({ children: [
      docxCell("Summe", { width: cols[0], bold: true, shade: "FFF2CC" }),
      docxCell(moneyOnly(gezahlt), { width: cols[1], bold: true, shade: "FFF2CC" }),
      docxCell(`${filtered.length} Zahlung(en)`, { width: cols[2]+cols[3]+cols[4], bold: true, shade: "FFF2CC" }),
    ]}));
    zahlungTbl = new D.Table({ width: { size: cols.reduce((a,b)=>a+b,0), type: D.WidthType.DXA }, columnWidths: cols, rows: trs });
  }

  // Fortschritt
  const gesamtVal = parseMoney(v("auflage","gesamt").value || "");
  const rateVal = parseMoney(v("auflage","rate").value || "");
  const rest = Math.max(0, gesamtVal - gezahlt);
  let progressTbl = null;
  if (gesamtVal > 0) {
    const c1 = Math.floor(CONTENT_W * 0.55), c2 = CONTENT_W - c1;
    const pct = Math.round((gezahlt / gesamtVal) * 100);
    const rows = [
      new D.TableRow({ tableHeader: true, children: [
        docxCell("Position", { width: c1, bold: true, shade: COLOR_SUB }),
        docxCell("Wert", { width: c2, bold: true, shade: COLOR_SUB }),
      ]}),
      new D.TableRow({ children: [
        docxCell("Gesamtbetrag (laut Auflage)", { width: c1 }),
        docxCell(moneyOnly(gesamtVal) + " €", { width: c2 }),
      ]}),
      new D.TableRow({ children: [
        docxCell("Bisher gezahlt", { width: c1, shade: COLOR_ZEILE }),
        docxCell(moneyOnly(gezahlt) + " €", { width: c2, shade: COLOR_ZEILE }),
      ]}),
      new D.TableRow({ children: [
        docxCell("Fortschritt", { width: c1 }),
        docxCell(pct + " %", { width: c2 }),
      ]}),
      new D.TableRow({ children: [
        docxCell("Noch offen", { width: c1, bold: true, shade: "FFF2CC" }),
        docxCell(moneyOnly(rest) + " €", { width: c2, bold: true, shade: "FFF2CC" }),
      ]}),
    ];
    if (rateVal > 0 && rest > 0) {
      const monateNoch = Math.ceil(rest / rateVal);
      const ende = new Date(); ende.setMonth(ende.getMonth() + monateNoch);
      rows.push(new D.TableRow({ children: [
        docxCell("Voraussichtlich abgeschlossen", { width: c1, shade: COLOR_ZEILE }),
        docxCell(`in ${monateNoch} Monat(en) (${ende.toLocaleDateString("de-DE", { month: "long", year: "numeric" })})`, { width: c2, shade: COLOR_ZEILE }),
      ]}));
    }
    progressTbl = new D.Table({ width: { size: CONTENT_W, type: D.WidthType.DXA }, columnWidths: [c1, c2], rows });
  }

  const noteVal = v("anmerkung", "notes");
  let secNum = 1;
  const children = [
    new D.Paragraph({ children: [new D.TextRun({ text: "Schadenswiedergutmachung / Geldauflage", bold: true, size: 32, color: "1F3864" })], alignment: D.AlignmentType.CENTER, spacing: { after: 80 } }),
    new D.Paragraph({ children: [new D.TextRun({ text: "Nachweis und Zahlungsverlauf", italics: true, size: 22, color: "555555" })], alignment: D.AlignmentType.CENTER, spacing: { after: 240 } }),
  ];
  const personalT = infoTbl(personalPairs);
  if (personalT) { children.push(docxH1(`${secNum++}. Persönliche Angaben`), personalT); }
  const auflageT = infoTbl(auflagePairs);
  if (auflageT) { children.push(docxH1(`${secNum++}. Auflage / Verurteilung`), auflageT); }
  const empfT = infoTbl(empfPairs);
  if (empfT) { children.push(docxH1(`${secNum++}. Empfänger / Bankverbindung`), empfT); }
  children.push(new D.Paragraph({ children: [new D.PageBreak()] }));
  children.push(docxH1(`${secNum++}. Zahlungsverlauf`));
  if (zahlungTbl) children.push(zahlungTbl);
  else children.push(docxP("(noch keine Zahlungen erfasst)", { italics: true, color: "888888" }));
  if (progressTbl) { children.push(docxH1(`${secNum++}. Fortschritt / Restbetrag`), progressTbl); }
  if (!noteVal.skipped && noteVal.value) {
    children.push(docxH1(`${secNum++}. Anmerkungen`));
    noteVal.value.split("\n").forEach(l => children.push(docxP(l || " ")));
  }
  children.push(new D.Paragraph({ spacing: { before: 480 }, children: [new D.TextRun({ text: "" })] }));
  children.push(docxSignatureBlock(CONTENT_W, "schadens", { counterRoleLabel: "Empfangsbestätigung Geschädigte:r", probandLabel: "Bewährter / Bewährte" }));
  children.push(docxP("Belege (Überweisungsnachweise, Quittungen) sind diesem Nachweis beigefügt.", { size: 18, italics: true, color: "666666" }));

  const doc = new D.Document({
    creator: "Bewährungshilfe-Assistent",
    styles: { default: { document: { run: { font: "Arial", size: 20 } } } },
    sections: [{
      properties: { page: { size: { width: PAGE_W, height: PAGE_H }, margin: { top: MARGIN, right: MARGIN, bottom: MARGIN, left: MARGIN } } },
      children
    }]
  });
  return await D.Packer.toBlob(doc);
}

  const auflagePairs = [
    ["Gericht:", v("auflage","gericht").value, v("auflage","gericht").skipped],
    ["Aktenzeichen Gericht:", v("auflage","az_gericht").value, v("auflage","az_gericht").skipped],
    ["Datum Urteil:", v("auflage","urteil_datum").value, v("auflage","urteil_datum").skipped],
    ["Auflage Gesamtstunden:", v("auflage","stunden_gesamt").value, v("auflage","stunden_gesamt").skipped],
    ["Frist (spätestens bis):", v("auflage","frist").value, v("auflage","frist").skipped],
    ["Art der Tätigkeit:", v("auflage","art").value, v("auflage","art").skipped],
  ];
  const einrPairs = [
    ["Name der Einrichtung:", v("einrichtung","name").value, v("einrichtung","name").skipped],
    ["Anschrift:", v("einrichtung","anschrift").value, v("einrichtung","anschrift").skipped],
    ["Ansprechperson:", v("einrichtung","ansprech").value, v("einrichtung","ansprech").skipped],
    ["Telefon:", v("einrichtung","tel").value, v("einrichtung","tel").skipped],
    ["E-Mail:", v("einrichtung","email").value, v("einrichtung","email").skipped],
    ["Tätigkeitsbereich:", v("einrichtung","taetigkeit").value, v("einrichtung","taetigkeit").skipped],
  ];

  // Stunden table
  const stRows = (getDocState().rows && getDocState().rows.stunden) || [];
  const filtered = stRows.filter(r => r.datum || r.von || r.stunden);
  let stundenSum = 0;
  const cols = [600, 1200, 900, 900, 900, 900, 2500, 2546]; // sums to 10446 < land content
  // Recalc to fit: use LAND_CONTENT_W
  const totalCol = LAND_CONTENT_W;
  const proportions = [0.05, 0.10, 0.07, 0.07, 0.06, 0.07, 0.27, 0.31];
  const widths = proportions.map(p => Math.floor(totalCol * p));
  // adjust last column to fill
  widths[widths.length - 1] = totalCol - widths.slice(0, -1).reduce((a,b)=>a+b,0);

  const head = ["Nr", "Datum", "von", "bis", "Pause (Min)", "Stunden netto", "Tätigkeit", "Bestätigt durch (Unterschrift / Stempel)"];
  const trs = [new D.TableRow({ tableHeader: true, children: head.map((h,i) => docxCell(h, { width: widths[i], bold: true, shade: COLOR_SUB, size: 16, align: D.AlignmentType.CENTER }))})];
  filtered.forEach((r, i) => {
    const h = parseMoney(r.stunden || ""); stundenSum += h;
    const sh = i % 2 === 0 ? COLOR_ZEILE : null;
    trs.push(new D.TableRow({ children: [
      docxCell(String(i+1), { width: widths[0], shade: sh, size: 18, align: D.AlignmentType.CENTER }),
      docxCell(r.datum || " ", { width: widths[1], shade: sh, size: 18 }),
      docxCell(r.von || " ", { width: widths[2], shade: sh, size: 18 }),
      docxCell(r.bis || " ", { width: widths[3], shade: sh, size: 18 }),
      docxCell(r.pause || " ", { width: widths[4], shade: sh, size: 18, align: D.AlignmentType.CENTER }),
      docxCell(r.stunden || " ", { width: widths[5], shade: sh, size: 18, align: D.AlignmentType.CENTER }),
      docxCell(r.taetigkeit || " ", { width: widths[6], shade: sh, size: 18 }),
      new D.TableCell({
        borders: docxBase().borders,
        width: { size: widths[7], type: D.WidthType.DXA },
        shading: sh ? { fill: sh, type: D.ShadingType.CLEAR } : undefined,
        margins: cellMargins,
        children: [docxP(" "), docxP(" ")]
      })
    ]}));
  });
  // Add empty rows for additional handwritten entries
  const targetEmpty = Math.max(15 - filtered.length, 5);
  for (let i = 0; i < targetEmpty; i++) {
    const num = filtered.length + i + 1;
    const sh = (filtered.length + i) % 2 === 0 ? COLOR_ZEILE : null;
    trs.push(new D.TableRow({ children: [
      docxCell(String(num), { width: widths[0], shade: sh, size: 18, align: D.AlignmentType.CENTER }),
      docxCell(" ", { width: widths[1], shade: sh, size: 18 }),
      docxCell(" ", { width: widths[2], shade: sh, size: 18 }),
      docxCell(" ", { width: widths[3], shade: sh, size: 18 }),
      docxCell(" ", { width: widths[4], shade: sh, size: 18 }),
      docxCell(" ", { width: widths[5], shade: sh, size: 18 }),
      docxCell(" ", { width: widths[6], shade: sh, size: 18 }),
      new D.TableCell({
        borders: docxBase().borders,
        width: { size: widths[7], type: D.WidthType.DXA },
        shading: sh ? { fill: sh, type: D.ShadingType.CLEAR } : undefined,
        margins: cellMargins,
        children: [docxP(" "), docxP(" ")]
      })
    ]}));
  }
  trs.push(new D.TableRow({ children: [
    docxCell("Geleistete Stunden bisher", { width: widths.slice(0,5).reduce((a,b)=>a+b,0), bold: true, shade: "FFF2CC" }),
    docxCell(stundenSum.toLocaleString("de-DE") + " h", { width: widths[5], bold: true, shade: "FFF2CC" }),
    docxCell("", { width: widths[6] + widths[7], shade: "FFF2CC" }),
  ]}));
  // need to rebuild last row to merge cells correctly - simpler: just add 3 cells matching widths
  trs.pop();
  trs.push(new D.TableRow({ children: [
    docxCell("Geleistete Stunden bisher (netto)", { width: widths[0]+widths[1]+widths[2]+widths[3]+widths[4], bold: true, shade: "FFF2CC" }),
    docxCell(stundenSum.toLocaleString("de-DE") + " h", { width: widths[5], bold: true, shade: "FFF2CC", align: D.AlignmentType.CENTER }),
    docxCell(" ", { width: widths[6], shade: "FFF2CC" }),
    docxCell(" ", { width: widths[7], shade: "FFF2CC" }),
  ]}));
  const stundenTable = new D.Table({
    width: { size: widths.reduce((a,b)=>a+b,0), type: D.WidthType.DXA },
    columnWidths: widths, rows: trs
  });

  // Progress table
  const stundenGesamt = parseMoney(v("auflage","stunden_gesamt").value || "");
  let progressTbl = null;
  if (stundenGesamt > 0) {
    const rest = Math.max(0, stundenGesamt - stundenSum);
    const pct = Math.round((stundenSum / stundenGesamt) * 100);
    const c1 = Math.floor(LAND_CONTENT_W * 0.5), c2 = LAND_CONTENT_W - c1;
    progressTbl = new D.Table({
      width: { size: LAND_CONTENT_W, type: D.WidthType.DXA },
      columnWidths: [c1, c2],
      rows: [
        new D.TableRow({ tableHeader: true, children: [
          docxCell("Position", { width: c1, bold: true, shade: COLOR_SUB }),
          docxCell("Stunden", { width: c2, bold: true, shade: COLOR_SUB }),
        ]}),
        new D.TableRow({ children: [
          docxCell("Auflage Gesamtstunden", { width: c1 }),
          docxCell(stundenGesamt.toLocaleString("de-DE") + " h", { width: c2 }),
        ]}),
        new D.TableRow({ children: [
          docxCell("Geleistet bisher", { width: c1, shade: COLOR_ZEILE }),
          docxCell(stundenSum.toLocaleString("de-DE") + " h", { width: c2, shade: COLOR_ZEILE }),
        ]}),
        new D.TableRow({ children: [
          docxCell("Fortschritt", { width: c1 }),
          docxCell(pct + " %", { width: c2 }),
        ]}),
        new D.TableRow({ children: [
          docxCell("Noch zu leisten", { width: c1, bold: true, shade: "FFF2CC" }),
          docxCell(rest.toLocaleString("de-DE") + " h", { width: c2, bold: true, shade: "FFF2CC" }),
        ]}),
      ]
    });
  }

  const noteVal = v("anmerkung", "notes");
  let secNum = 1;
  const children = [
    new D.Paragraph({ children: [new D.TextRun({ text: "Sozialstunden-Nachweis", bold: true, size: 32, color: "1F3864" })], alignment: D.AlignmentType.CENTER, spacing: { after: 80 } }),
    new D.Paragraph({ children: [new D.TextRun({ text: "Gemeinnützige Arbeit / Bewährungsauflage", italics: true, size: 22, color: "555555" })], alignment: D.AlignmentType.CENTER, spacing: { after: 240 } }),
  ];
  const personalT = infoTbl(personalPairs, LAND_CONTENT_W);
  if (personalT) { children.push(docxH1(`${secNum++}. Persönliche Angaben`), personalT); }
  const auflageT = infoTbl(auflagePairs, LAND_CONTENT_W);
  if (auflageT) { children.push(docxH1(`${secNum++}. Auflage`), auflageT); }
  const einrT = infoTbl(einrPairs, LAND_CONTENT_W);
  if (einrT) { children.push(docxH1(`${secNum++}. Einrichtung`), einrT); }
  children.push(new D.Paragraph({ children: [new D.PageBreak()] }));
  children.push(docxH1(`${secNum++}. Stunden-Nachweis`));
  children.push(docxP("Jeder Einsatz wird durch Unterschrift / Stempel der Einrichtung bestätigt.", { italics: true, size: 18, color: "666666", after: 120 }));
  children.push(stundenTable);
  if (progressTbl) {
    children.push(new D.Paragraph({ children: [new D.PageBreak()] }));
    children.push(docxH1(`${secNum++}. Fortschritt`), progressTbl);
  }
  if (!noteVal.skipped && noteVal.value) {
    children.push(docxH1(`${secNum++}. Anmerkungen`));
    noteVal.value.split("\n").forEach(l => children.push(docxP(l || " ")));
  }
  children.push(new D.Paragraph({ spacing: { before: 360 }, children: [new D.TextRun({ text: "" })] }));
  children.push(docxSignatureBlock(LAND_CONTENT_W, "sozial", { counterRoleLabel: "Bestätigung durch Einrichtung", probandLabel: "Bewährter / Bewährte" }));

  const doc = new D.Document({
    creator: "Bewährungshilfe-Assistent",
    styles: { default: { document: { run: { font: "Arial", size: 20 } } } },
    sections: [{
      properties: { page: { size: { width: PAGE_W, height: PAGE_H, orientation: D.PageOrientation.LANDSCAPE }, margin: { top: MARGIN, right: MARGIN, bottom: MARGIN, left: MARGIN } } },
      children
    }]
  });
  return await D.Packer.toBlob(doc);
}

// ---- Asservate / Beweismittel docx (landscape — gegenstaende table is wide) ----
async function buildAsservateDocx() {
  const { D, PAGE_W, PAGE_H, MARGIN, COLOR_SUB, COLOR_ZEILE, cellMargins } = docxBase();
  const LAND_CONTENT_W = PAGE_H - 2 * MARGIN;
  const v = (s,f) => valOrSkipPrint(s,f);
  const ds = state.docs.asservate || {};

  function infoTbl(pairsRaw) {
    const pairs = pairsRaw.filter(p => !p[2] && p[0]);
    if (pairs.length === 0) return null;
    const totalW = LAND_CONTENT_W;
    const c1 = Math.floor(totalW * 0.18);
    const c2 = Math.floor(totalW * 0.32);
    const c3 = Math.floor(totalW * 0.18);
    const c4 = totalW - c1 - c2 - c3;
    const rows = [];
    for (let i = 0; i < pairs.length; i += 2) {
      const L = pairs[i], R = pairs[i+1];
      if (R) rows.push(new D.TableRow({ children: [
        docxCell(L[0], { width: c1, bold: true, shade: COLOR_ZEILE }),
        docxCell(L[1] || " ", { width: c2 }),
        docxCell(R[0], { width: c3, bold: true, shade: COLOR_ZEILE }),
        docxCell(R[1] || " ", { width: c4 }),
      ]})); else rows.push(new D.TableRow({ children: [
        docxCell(L[0], { width: c1, bold: true, shade: COLOR_ZEILE }),
        docxCell(L[1] || " ", { width: c2 }),
        docxCell(" ", { width: c3 }),
        docxCell(" ", { width: c4 }),
      ]}));
    }
    return new D.Table({ width: { size: totalW, type: D.WidthType.DXA }, columnWidths: [c1,c2,c3,c4], rows });
  }

  function blockText(label, val) {
    if (!val || val.skipped || !val.value) return null;
    const lines = String(val.value).split(/\r?\n/);
    const out = [
      new D.Paragraph({ children: [new D.TextRun({ text: label, bold: true, size: 20 })], spacing: { before: 120, after: 40 } }),
    ];
    lines.forEach(l => out.push(new D.Paragraph({ children: [new D.TextRun({ text: l || " ", size: 20 })], spacing: { after: 40 } })));
    return out;
  }

  const personalPairs = [
    ["Name, Vorname:", v("personal","name").value, v("personal","name").skipped],
    ["Geburtsdatum:", v("personal","geburtsdatum").value, v("personal","geburtsdatum").skipped],
    ["Anschrift:", v("personal","anschrift").value, v("personal","anschrift").skipped],
    ["Telefon:", v("personal","telefon").value, v("personal","telefon").skipped],
    ["E-Mail:", v("personal","email").value, v("personal","email").skipped],
  ];

  const verfahrenPairs = [
    ["Aktenzeichen StA:", v("verfahren","az_sta").value, v("verfahren","az_sta").skipped],
    ["Aktenzeichen Polizei:", v("verfahren","az_polizei").value, v("verfahren","az_polizei").skipped],
    ["Aktenzeichen Gericht:", v("verfahren","az_gericht").value, v("verfahren","az_gericht").skipped],
    ["Zuständige Staatsanwaltschaft:", v("verfahren","behoerde").value, v("verfahren","behoerde").skipped],
    ["Sachbearbeiter/in:", v("verfahren","sachbearbeiter").value, v("verfahren","sachbearbeiter").skipped],
    ["Rechtsgrundlage:", v("verfahren","rechtsgrundlage").value, v("verfahren","rechtsgrundlage").skipped],
    ["Verfahrensstand:", v("verfahren","verfahrensstand").value, v("verfahren","verfahrensstand").skipped],
  ];

  const durchsuchungPairs = [
    ["Datum:", v("durchsuchung","datum").value, v("durchsuchung","datum").skipped],
    ["Ort:", v("durchsuchung","ort").value, v("durchsuchung","ort").skipped],
    ["Uhrzeit Beginn:", v("durchsuchung","uhrzeit_beginn").value, v("durchsuchung","uhrzeit_beginn").skipped],
    ["Uhrzeit Ende:", v("durchsuchung","uhrzeit_ende").value, v("durchsuchung","uhrzeit_ende").skipped],
    ["Beschluss-Datum:", v("durchsuchung","beschluss_datum").value, v("durchsuchung","beschluss_datum").skipped],
    ["Erlassendes Gericht:", v("durchsuchung","beschluss_gericht").value, v("durchsuchung","beschluss_gericht").skipped],
    ["Aktenzeichen Beschluss:", v("durchsuchung","beschluss_az").value, v("durchsuchung","beschluss_az").skipped],
    ["Bei Gefahr im Verzug:", v("durchsuchung","gefahr_im_verzug").value, v("durchsuchung","gefahr_im_verzug").skipped],
    ["Anzahl Beamte:", v("durchsuchung","anzahl_beamte").value, v("durchsuchung","anzahl_beamte").skipped],
    ["Einsatzleiter/in:", v("durchsuchung","leiter_einsatz").value, v("durchsuchung","leiter_einsatz").skipped],
    ["Widerspruch eingelegt:", v("durchsuchung","widerspruch").value, v("durchsuchung","widerspruch").skipped],
    ["Widerspruch im Protokoll:", v("durchsuchung","widerspruch_protokolliert").value, v("durchsuchung","widerspruch_protokolliert").skipped],
  ];

  // Gegenstaende table — landscape gives room for all 11 columns
  const rows = (ds.rows && ds.rows.gegenstaende) || [];
  const filtered = rows.filter(r => r.bezeichnung || r.seriennr || r.marke || r.modell);
  let gegenstaendeTbl = null;
  if (filtered.length > 0) {
    const head = ["Nr", "Bezeichnung", "Marke / Modell", "Seriennr / IMEI", "Merkmale", "Fundort", "Kaufpreis (€)", "Kaufdatum", "Eigentümer", "Bemerkung", "Status"];
    // Column widths sum to ~LAND_CONTENT_W
    const cw = [400, 1800, 1400, 1400, 1100, 1100, 900, 900, 1000, 1500, 1100];
    // Scale to fit content width exactly
    const sum = cw.reduce((a,b)=>a+b, 0);
    const widths = cw.map(w => Math.floor(w * LAND_CONTENT_W / sum));
    const trs = [new D.TableRow({ tableHeader: true, children: head.map((h, i) => docxCell(h, { width: widths[i], bold: true, shade: COLOR_SUB, size: 18 })) })];
    filtered.forEach((r, i) => {
      const sh = i % 2 === 0 ? COLOR_ZEILE : null;
      const markeModell = [r.marke, r.modell].filter(Boolean).join(" / ");
      const cells = [
        String(i + 1), r.bezeichnung || "", markeModell, r.seriennr || "",
        r.farbe || "", r.fundort || "", r.kaufpreis || "", r.kaufdatum || "",
        r.eigentuemer || "", r.bemerkung || "", r.status || "",
      ];
      trs.push(new D.TableRow({ children: cells.map((c, ci) => docxCell(c || " ", { width: widths[ci], shade: sh, size: 16 })) }));
    });
    gegenstaendeTbl = new D.Table({
      width: { size: widths.reduce((a,b)=>a+b,0), type: D.WidthType.DXA },
      columnWidths: widths, rows: trs
    });
  }

  const antragPairs = [
    ["Datum letzter Antrag:", v("antrag","antrag_datum").value, v("antrag","antrag_datum").skipped],
    ["Versendet per:", v("antrag","antrag_versendet").value, v("antrag","antrag_versendet").skipped],
    ["Datum Rückmeldung:", v("antrag","rueckmeldung_datum").value, v("antrag","rueckmeldung_datum").skipped],
    ["Anwalt/Anwältin:", v("antrag","anwalt").value, v("antrag","anwalt").skipped],
  ];

  const schadenPairs = [
    ["Geschätzter Gesamtbetrag (€):", v("schaden","schaeden_betrag").value, v("schaden","schaeden_betrag").skipped],
    ["Rechtsschutzversicherung:", v("schaden","rechtsschutz").value, v("schaden","rechtsschutz").skipped],
    ["Datum Antrag StrEG:", v("schaden","antrag_streg_datum").value, v("schaden","antrag_streg_datum").skipped],
    ["Status StrEG-Antrag:", v("schaden","antrag_streg_status").value, v("schaden","antrag_streg_status").skipped],
  ];

  let secNum = 1;
  const children = [
    new D.Paragraph({ children: [new D.TextRun({ text: "Beweismittel & Asservate", bold: true, size: 32, color: "1F3864" })], alignment: D.AlignmentType.CENTER, spacing: { after: 80 } }),
    new D.Paragraph({ children: [new D.TextRun({ text: "Dokumentation der beschlagnahmten / sichergestellten Gegenstände", italics: true, size: 22, color: "555555" })], alignment: D.AlignmentType.CENTER, spacing: { after: 240 } }),
  ];

  const pT = infoTbl(personalPairs);
  if (pT) { children.push(docxH1(`${secNum++}. Persönliche Angaben`), pT); }

  const vT = infoTbl(verfahrenPairs);
  if (vT) { children.push(docxH1(`${secNum++}. Verfahrensdaten`), vT); }
  const behoerdeAnschr = v("verfahren","behoerde_anschrift");
  const ba = blockText("Anschrift Staatsanwaltschaft:", behoerdeAnschr);
  if (ba) ba.forEach(p => children.push(p));
  const vorwurf = v("verfahren","vorwurf");
  const vw = blockText("Tatvorwurf:", vorwurf);
  if (vw) vw.forEach(p => children.push(p));

  const dT = infoTbl(durchsuchungPairs);
  if (dT) { children.push(docxH1(`${secNum++}. Durchsuchung / Beschlagnahme`), dT); }
  const beamteB = blockText("Namen / Dienststellen der Beamten:", v("durchsuchung","namen_beamte"));
  if (beamteB) beamteB.forEach(p => children.push(p));
  const zeugenB = blockText("Anwesende Zeugen:", v("durchsuchung","zeugen"));
  if (zeugenB) zeugenB.forEach(p => children.push(p));
  const schaedenB = blockText("Entstandene Schäden:", v("durchsuchung","schaeden"));
  if (schaedenB) schaedenB.forEach(p => children.push(p));
  const ablaufB = blockText("Ablauf / Auffälligkeiten (Gedächtnisprotokoll):", v("durchsuchung","ablauf"));
  if (ablaufB) ablaufB.forEach(p => children.push(p));

  children.push(new D.Paragraph({ children: [new D.PageBreak()] }));
  children.push(docxH1(`${secNum++}. Beschlagnahmte Gegenstände (${filtered.length})`));
  if (gegenstaendeTbl) children.push(gegenstaendeTbl);
  else children.push(docxP("(keine Gegenstände erfasst)", { italics: true, color: "888888" }));

  const aT = infoTbl(antragPairs);
  if (aT) { children.push(docxH1(`${secNum++}. Antragsverlauf`), aT); }
  const rmB = blockText("Inhalt der Rückmeldung:", v("antrag","rueckmeldung_inhalt"));
  if (rmB) rmB.forEach(p => children.push(p));
  const anwaltB = blockText("Kontakt Anwalt/Anwältin:", v("antrag","anwalt_kontakt"));
  if (anwaltB) anwaltB.forEach(p => children.push(p));

  const schUbersicht = v("schaden","schaeden_uebersicht");
  const sT = infoTbl(schadenPairs);
  if (sT || (!schUbersicht.skipped && schUbersicht.value)) {
    children.push(docxH1(`${secNum++}. Schadensersatz (StrEG)`));
    if (sT) children.push(sT);
    const schUB = blockText("Übersicht entstandener Schäden:", schUbersicht);
    if (schUB) schUB.forEach(p => children.push(p));
  }

  const noteVal = v("anmerkung", "notes");
  if (!noteVal.skipped && noteVal.value) {
    children.push(docxH1(`${secNum++}. Anmerkungen`));
    noteVal.value.split("\n").forEach(l => children.push(docxP(l || " ")));
  }

  children.push(new D.Paragraph({ spacing: { before: 360 }, children: [new D.TextRun({ text: "" })] }));
  children.push(docxP("Diese Übersicht ist eine persönliche Dokumentation. Für einen formellen Antrag auf Herausgabe nach § 111n StPO siehe das separate Anschreiben.", { size: 18, italics: true, color: "666666" }));

  const doc = new D.Document({
    creator: "Bewährungshilfe-Assistent",
    styles: { default: { document: { run: { font: "Arial", size: 20 } } } },
    sections: [{
      properties: { page: { size: { width: PAGE_W, height: PAGE_H, orientation: D.PageOrientation.LANDSCAPE }, margin: { top: MARGIN, right: MARGIN, bottom: MARGIN, left: MARGIN } } },
      children
    }]
  });
  return await D.Packer.toBlob(doc);
}

// ---- Verfahrenskosten docx (landscape — Zahlungs-Tabelle ist breit) ----

    const c1 = Math.floor(totalW * 0.20);

    const c3 = Math.floor(totalW * 0.20);
    const c4 = totalW - c1 - c2 - c3;
    const rows = [];
    for (let i = 0; i < pairs.length; i += 2) {
      const L = pairs[i], R = pairs[i+1];
      if (R) rows.push(new D.TableRow({ children: [
        docxCell(L[0], { width: c1, bold: true, shade: COLOR_ZEILE }),
        docxCell(L[1] || " ", { width: c2 }),
        docxCell(R[0], { width: c3, bold: true, shade: COLOR_ZEILE }),
        docxCell(R[1] || " ", { width: c4 }),
      ]})); else rows.push(new D.TableRow({ children: [
        docxCell(L[0], { width: c1, bold: true, shade: COLOR_ZEILE }),
        docxCell(L[1] || " ", { width: c2 }),
        docxCell(" ", { width: c3 }), docxCell(" ", { width: c4 }),
      ]}));
    }
    return new D.Table({ width: { size: totalW, type: D.WidthType.DXA }, columnWidths: [c1,c2,c3,c4], rows });
  }
  function blockText(label, val) {
    if (!val || val.skipped || !val.value) return null;
    const lines = String(val.value).split(/\r?\n/);
    const out = [new D.Paragraph({ children: [new D.TextRun({ text: label, bold: true, size: 20 })], spacing: { before: 120, after: 40 } })];
    lines.forEach(l => out.push(new D.Paragraph({ children: [new D.TextRun({ text: l || " ", size: 20 })], spacing: { after: 40 } })));
    return out;
  }

  const personalPairs = [
    ["Name, Vorname:", v("personal","name").value, v("personal","name").skipped],
    ["Geburtsdatum:", v("personal","geburtsdatum").value, v("personal","geburtsdatum").skipped],
    ["Anschrift:", v("personal","anschrift").value, v("personal","anschrift").skipped],
    ["Telefon:", v("personal","telefon").value, v("personal","telefon").skipped],
    ["E-Mail:", v("personal","email").value, v("personal","email").skipped],
  ];
  const verfahrenPairs = [
    ["Aktenzeichen StA:", v("verfahren","az_sta").value, v("verfahren","az_sta").skipped],
    ["Aktenzeichen Gericht:", v("verfahren","az_gericht").value, v("verfahren","az_gericht").skipped],
    ["Kassenzeichen LJK:", v("verfahren","az_landesjustizkasse").value, v("verfahren","az_landesjustizkasse").skipped],
    ["Datum Urteil:", v("verfahren","urteilsdatum").value, v("verfahren","urteilsdatum").skipped],
    ["Datum Rechtskraft:", v("verfahren","rechtskraft_datum").value, v("verfahren","rechtskraft_datum").skipped],
    ["Rechtsgrundlage Kosten:", v("verfahren","rechtsgrundlage_kosten").value, v("verfahren","rechtsgrundlage_kosten").skipped],
    ["Zust. StA:", v("verfahren","behoerde_sta").value, v("verfahren","behoerde_sta").skipped],
    ["Zust. Landesjustizkasse:", v("verfahren","behoerde_kasse").value, v("verfahren","behoerde_kasse").skipped],
  ];
  const geldstrafePairs = [
    ["Anzahl Tagessätze:", v("geldstrafe","anzahl_tagessaetze").value, v("geldstrafe","anzahl_tagessaetze").skipped],
    ["Höhe pro Tagessatz:", v("geldstrafe","hoehe_tagessatz").value, v("geldstrafe","hoehe_tagessatz").skipped],
    ["Geldstrafe gesamt (€):", v("geldstrafe","betrag_gesamt").value, v("geldstrafe","betrag_gesamt").skipped],
    ["Zahlungsfrist:", v("geldstrafe","frist_zahlung").value, v("geldstrafe","frist_zahlung").skipped],
    ["JUKOS-Rechnungsnr:", v("geldstrafe","rechnung_jukos").value, v("geldstrafe","rechnung_jukos").skipped],
    ["Ratenzahlung bewilligt?:", v("geldstrafe","ratenzahlung_bewilligt").value, v("geldstrafe","ratenzahlung_bewilligt").skipped],
    ["Rate (€/Monat):", v("geldstrafe","rate_hoehe").value, v("geldstrafe","rate_hoehe").skipped],
    ["Erste Rate fällig:", v("geldstrafe","rate_erste").value, v("geldstrafe","rate_erste").skipped],
    ["Gemeinnützige Arbeit:", v("geldstrafe","gemeinnuetzige_arbeit").value, v("geldstrafe","gemeinnuetzige_arbeit").skipped],
    ["Ersatzfreiheit drohend:", v("geldstrafe","ersatzfreiheit").value, v("geldstrafe","ersatzfreiheit").skipped],
  ];
  const gkPairs = [
    ["Gerichtskosten gesamt (€):", v("gerichtskosten","betrag_gesamt").value, v("gerichtskosten","betrag_gesamt").skipped],
    ["Gebühren (€):", v("gerichtskosten","gebuehren").value, v("gerichtskosten","gebuehren").skipped],
    ["Auslagen (€):", v("gerichtskosten","auslagen").value, v("gerichtskosten","auslagen").skipped],
    ["Datum Kostenrechnung:", v("gerichtskosten","kostenrechnung_datum").value, v("gerichtskosten","kostenrechnung_datum").skipped],
    ["Zahlungsfrist:", v("gerichtskosten","frist_zahlung").value, v("gerichtskosten","frist_zahlung").skipped],
    ["Rate (€/Monat):", v("gerichtskosten","rate_hoehe").value, v("gerichtskosten","rate_hoehe").skipped],
    ["Erste Rate fällig:", v("gerichtskosten","rate_erste").value, v("gerichtskosten","rate_erste").skipped],
  ];
  const anwaltPairs = [
    ["Verteidiger/in:", v("anwaltskosten","verteidiger_name").value, v("anwaltskosten","verteidiger_name").skipped],
    ["Art:", v("anwaltskosten","art_verteidigung").value, v("anwaltskosten","art_verteidigung").skipped],
    ["RVG-Kosten (€):", v("anwaltskosten","rvg_kosten").value, v("anwaltskosten","rvg_kosten").skipped],
    ["Wahlverteidiger-Honorar (€):", v("anwaltskosten","wahlverteidiger_kosten").value, v("anwaltskosten","wahlverteidiger_kosten").skipped],
    ["Honorarvereinbarung:", v("anwaltskosten","honorarvereinbarung").value, v("anwaltskosten","honorarvereinbarung").skipped],
    ["Rechtsschutz:", v("anwaltskosten","rechtsschutz").value, v("anwaltskosten","rechtsschutz").skipped],
  ];
  const erklaerungPairs = [
    ["Arbeitgeber:", v("erklaerung_wirtschaft","arbeitgeber").value, v("erklaerung_wirtschaft","arbeitgeber").skipped],
    ["Ehegatten-Einkommen (€):", v("erklaerung_wirtschaft","ehe_einkommen").value, v("erklaerung_wirtschaft","ehe_einkommen").skipped],
    ["EV geleistet:", v("erklaerung_wirtschaft","ev_geleistet").value, v("erklaerung_wirtschaft","ev_geleistet").skipped],
    ["EV Gericht:", v("erklaerung_wirtschaft","ev_gericht").value, v("erklaerung_wirtschaft","ev_gericht").skipped],
    ["EV Aktenzeichen:", v("erklaerung_wirtschaft","ev_aktenzeichen").value, v("erklaerung_wirtschaft","ev_aktenzeichen").skipped],
  ];
  const antraegePairs = [
    ["Antrag Ratenzahlung:", v("antraege","ratenzahlung_datum").value, v("antraege","ratenzahlung_datum").skipped],
    ["Status Ratenz.:", v("antraege","ratenzahlung_status").value, v("antraege","ratenzahlung_status").skipped],
    ["Antrag Stundung:", v("antraege","stundung_datum").value, v("antraege","stundung_datum").skipped],
    ["Status Stundung:", v("antraege","stundung_status").value, v("antraege","stundung_status").skipped],
    ["Antrag Erlass:", v("antraege","erlass_datum").value, v("antraege","erlass_datum").skipped],
    ["Status Erlass:", v("antraege","erlass_status").value, v("antraege","erlass_status").skipped],
  ];

  // Zahlungen-Tabelle
  const zahlungen = (ds.rows && ds.rows.zahlungen) || [];
  const filteredZ = zahlungen.filter(r => r.datum || r.betrag);
  let zahlungTbl = null, summe = 0;
  if (filteredZ.length > 0) {
    const cw = [1300, 1600, 4000, 3200, 2600, 3000];
    const sum = cw.reduce((a,b)=>a+b, 0);
    const widths = cw.map(w => Math.floor(w * LAND_CONTENT_W / sum));
    const head = ["Datum", "Betrag (€)", "Verwendungszweck", "Empfänger", "Aktenzeichen", "Bemerkung"];
    const trs = [new D.TableRow({ tableHeader: true, children: head.map((h, i) => docxCell(h, { width: widths[i], bold: true, shade: COLOR_SUB, size: 18 })) })];
    filteredZ.forEach((r, i) => {
      const sh = i % 2 === 0 ? COLOR_ZEILE : null;
      const n = parseMoney(r.betrag || ""); summe += n;
      const cells = [r.datum || "", r.betrag ? moneyOnly(n) : "", r.verwendungszweck || "", r.empfaenger || "", r.az_zahlung || "", r.bemerkung || ""];
      trs.push(new D.TableRow({ children: cells.map((c, ci) => docxCell(c || " ", { width: widths[ci], shade: sh, size: 18 })) }));
    });
    trs.push(new D.TableRow({ children: [
      docxCell("Summe", { width: widths[0], bold: true, shade: "FFF2CC" }),
      docxCell(moneyOnly(summe), { width: widths[1], bold: true, shade: "FFF2CC" }),
      docxCell(filteredZ.length + " Zahlung(en)", { width: widths[2] + widths[3] + widths[4] + widths[5], bold: true, shade: "FFF2CC" }),
    ]}));
    zahlungTbl = new D.Table({ width: { size: widths.reduce((a,b)=>a+b,0), type: D.WidthType.DXA }, columnWidths: widths, rows: trs });
  }

  let secNum = 1;
  const children = [
    new D.Paragraph({ children: [new D.TextRun({ text: "Verfahrenskosten", bold: true, size: 32, color: "1F3864" })], alignment: D.AlignmentType.CENTER, spacing: { after: 80 } }),
    new D.Paragraph({ children: [new D.TextRun({ text: "Geldstrafe, Gerichtskosten, Anwaltskosten und Zahlungsverlauf", italics: true, size: 22, color: "555555" })], alignment: D.AlignmentType.CENTER, spacing: { after: 240 } }),
  ];

  const pT = infoTbl(personalPairs); if (pT) { children.push(docxH1(`${secNum++}. Persönliche Angaben`), pT); }
  const vT = infoTbl(verfahrenPairs); if (vT) { children.push(docxH1(`${secNum++}. Verfahrensdaten`), vT); }
  const tatvBlock = blockText("Tatvorwurf:", v("verfahren","tatvorwurf"));
  if (tatvBlock) tatvBlock.forEach(p => children.push(p));
  const gT = infoTbl(geldstrafePairs); if (gT) { children.push(docxH1(`${secNum++}. Geldstrafe`), gT); }
  const gkT = infoTbl(gkPairs); if (gkT) { children.push(docxH1(`${secNum++}. Gerichtskosten`), gkT); }
  const aT = infoTbl(anwaltPairs); if (aT) { children.push(docxH1(`${secNum++}. Anwalts-/Verteidigerkosten`), aT); }
  const eT = infoTbl(erklaerungPairs); if (eT) { children.push(docxH1(`${secNum++}. Erklärung wirtschaftliche Verhältnisse`), eT); }
  const ausBlock = blockText("Monatliche Ausgaben (Freitext):", v("erklaerung_wirtschaft","ausgaben_freitext"));
  if (ausBlock) ausBlock.forEach(p => children.push(p));
  const sonsBlock = blockText("Sonstige zweckdienliche Angaben:", v("erklaerung_wirtschaft","sonstiges"));
  if (sonsBlock) sonsBlock.forEach(p => children.push(p));
  const antT = infoTbl(antraegePairs); if (antT) { children.push(docxH1(`${secNum++}. Anträge & Status`), antT); }

  if (zahlungTbl) {
    children.push(new D.Paragraph({ children: [new D.PageBreak()] }));
    children.push(docxH1(`${secNum++}. Zahlungsverlauf`));
    children.push(zahlungTbl);
  }

  const noteVal = v("anmerkung", "notes");
  if (!noteVal.skipped && noteVal.value) {
    children.push(docxH1(`${secNum++}. Anmerkungen`));
    noteVal.value.split("\n").forEach(l => children.push(docxP(l || " ")));
  }

  children.push(new D.Paragraph({ spacing: { before: 240 }, children: [new D.TextRun({ text: "" })] }));
  children.push(docxP("Persönliche Übersicht über alle Verfahrenskosten. Bitte ggf. zusammen mit Belegen vorlegen.", { size: 18, italics: true, color: "666666" }));

  const doc = new D.Document({
    creator: "Bewährungshilfe-Assistent",
    styles: { default: { document: { run: { font: "Arial", size: 20 } } } },
    sections: [{
      properties: { page: { size: { width: PAGE_W, height: PAGE_H, orientation: D.PageOrientation.LANDSCAPE }, margin: { top: MARGIN, right: MARGIN, bottom: MARGIN, left: MARGIN } } },
      children
    }]
  });
  return await D.Packer.toBlob(doc);
}

// ---- BH-Termine docx (landscape — Termin-Tabelle ist breit) ----
async function buildBhtermineDocx() {
  const { D, PAGE_W, PAGE_H, MARGIN, COLOR_SUB, COLOR_ZEILE } = docxBase();
  const LAND_CONTENT_W = PAGE_H - 2 * MARGIN;
  const v = (s,f) => valOrSkipPrint(s,f);
  const ds = state.docs.bhtermine || {};

  function infoTbl(pairsRaw) {
    const pairs = pairsRaw.filter(p => !p[2] && p[0]);
    if (pairs.length === 0) return null;
    const totalW = LAND_CONTENT_W;
    const c1 = Math.floor(totalW * 0.20);
    const c2 = Math.floor(totalW * 0.30);
    const c3 = Math.floor(totalW * 0.20);
    const c4 = totalW - c1 - c2 - c3;
    const rows = [];
    for (let i = 0; i < pairs.length; i += 2) {
      const L = pairs[i], R = pairs[i+1];
      if (R) rows.push(new D.TableRow({ children: [
        docxCell(L[0], { width: c1, bold: true, shade: COLOR_ZEILE }),
        docxCell(L[1] || " ", { width: c2 }),
        docxCell(R[0], { width: c3, bold: true, shade: COLOR_ZEILE }),
        docxCell(R[1] || " ", { width: c4 }),
      ]})); else rows.push(new D.TableRow({ children: [
        docxCell(L[0], { width: c1, bold: true, shade: COLOR_ZEILE }),
        docxCell(L[1] || " ", { width: c2 }),
        docxCell(" ", { width: c3 }), docxCell(" ", { width: c4 }),
      ]}));
    }
    return new D.Table({ width: { size: totalW, type: D.WidthType.DXA }, columnWidths: [c1,c2,c3,c4], rows });
  }

  const personalPairs = [
    ["Name, Vorname:", v("personal","name").value, v("personal","name").skipped],
    ["Geburtsdatum:", v("personal","geburtsdatum").value, v("personal","geburtsdatum").skipped],
    ["Aktenzeichen BH:", v("personal","aktenzeichen").value, v("personal","aktenzeichen").skipped],
    ["Bewährungshelfer/in:", v("personal","bewaehrungshelfer").value, v("personal","bewaehrungshelfer").skipped],
    ["Erstellt am:", v("personal","erstellt").value, v("personal","erstellt").skipped],
  ];

  // Termine-Tabelle
  const termine = (ds.rows && ds.rows.termine) || [];
  const filteredT = termine.filter(r => r.datum || r.themen || r.status);
  let terminTbl = null;
  if (filteredT.length > 0) {
    const cw = [1200, 1000, 1600, 3400, 3400, 1600, 3500];
    const sum = cw.reduce((a,b)=>a+b, 0);
    const widths = cw.map(w => Math.floor(w * LAND_CONTENT_W / sum));
    const head = ["Datum", "Uhrzeit", "Art", "Themen", "Vereinbarungen", "Status", "Notiz / Was lief gut"];
    const trs = [new D.TableRow({ tableHeader: true, children: head.map((h, i) => docxCell(h, { width: widths[i], bold: true, shade: COLOR_SUB, size: 18 })) })];
    filteredT.forEach((r, i) => {
      const sh = i % 2 === 0 ? COLOR_ZEILE : null;
      const notiz = [r.notiz, r.gutes].filter(Boolean).join(" — ");
      const cells = [r.datum || "", r.uhrzeit || "", r.art || "", r.themen || "", r.vereinbarungen || "", r.status || "", notiz];
      trs.push(new D.TableRow({ children: cells.map((c, ci) => docxCell(c || " ", { width: widths[ci], shade: sh, size: 16 })) }));
    });
    terminTbl = new D.Table({ width: { size: widths.reduce((a,b)=>a+b,0), type: D.WidthType.DXA }, columnWidths: widths, rows: trs });
  }

  // Nächster Termin
  const naechsterPairs = [
    ["Datum:", v("naechster","datum").value, v("naechster","datum").skipped],
    ["Uhrzeit:", v("naechster","uhrzeit").value, v("naechster","uhrzeit").skipped],
    ["Ort:", v("naechster","ort").value, v("naechster","ort").skipped],
  ];
  function blockText(label, val) {
    if (!val || val.skipped || !val.value) return null;
    const lines = String(val.value).split(/\r?\n/);
    const out = [new D.Paragraph({ children: [new D.TextRun({ text: label, bold: true, size: 20 })], spacing: { before: 120, after: 40 } })];
    lines.forEach(l => out.push(new D.Paragraph({ children: [new D.TextRun({ text: l || " ", size: 20 })], spacing: { after: 40 } })));
    return out;
  }

  let secNum = 1;
  const children = [
    new D.Paragraph({ children: [new D.TextRun({ text: "Bewährungshilfe-Termine", bold: true, size: 32, color: "1F3864" })], alignment: D.AlignmentType.CENTER, spacing: { after: 80 } }),
    new D.Paragraph({ children: [new D.TextRun({ text: "Übersicht aller Termine und Gespräche", italics: true, size: 22, color: "555555" })], alignment: D.AlignmentType.CENTER, spacing: { after: 240 } }),
  ];
  const pT = infoTbl(personalPairs); if (pT) { children.push(docxH1(`${secNum++}. Persönliche Angaben`), pT); }
  if (terminTbl) {
    children.push(docxH1(`${secNum++}. Termine (${filteredT.length})`));
    children.push(terminTbl);
  } else {
    children.push(docxH1(`${secNum++}. Termine`));
    children.push(docxP("(noch keine Termine erfasst)", { italics: true, color: "888888" }));
  }
  const nT = infoTbl(naechsterPairs);
  if (nT) { children.push(docxH1(`${secNum++}. Nächster Termin`), nT); }
  const vorbBlock = blockText("Vorbereitung / zu besprechen:", v("naechster","vorbereitung"));
  if (vorbBlock) vorbBlock.forEach(p => children.push(p));
  const noteVal = v("anmerkung", "notes");
  if (!noteVal.skipped && noteVal.value) {
    children.push(docxH1(`${secNum++}. Notizen`));
    noteVal.value.split("\n").forEach(l => children.push(docxP(l || " ")));
  }
  children.push(new D.Paragraph({ spacing: { before: 360 }, children: [new D.TextRun({ text: "" })] }));
  children.push(docxSignatureBlock(LAND_CONTENT_W, "bhtermine", { counterRoleLabel: "Bewährungshelfer:in (optional)", probandLabel: "Bewährter / Bewährte" }));

  const doc = new D.Document({
    creator: "Bewährungshilfe-Assistent",
    styles: { default: { document: { run: { font: "Arial", size: 20 } } } },
    sections: [{
      properties: { page: { size: { width: PAGE_W, height: PAGE_H, orientation: D.PageOrientation.LANDSCAPE }, margin: { top: MARGIN, right: MARGIN, bottom: MARGIN, left: MARGIN } } },
      children
    }]
  });
  return await D.Packer.toBlob(doc);
}

// INIT
// ============================================
function checkBrowserCompat() {
  // Detect known-incompatible browsers (very old ones)
  // Required features: localStorage, fetch, Promise, async/await, template literals
  const required = {
    localStorage: typeof localStorage !== "undefined",
    fetch: typeof fetch !== "undefined",
    Promise: typeof Promise !== "undefined",
    asyncAwait: (async () => {})().constructor === Promise,
  };
  const missing = Object.entries(required).filter(([k, v]) => !v).map(([k]) => k);
  if (missing.length > 0) {
    document.body.innerHTML = `
      <div style="max-width:560px; margin:60px auto; padding:30px; background:#fef3c7; border:2px solid #f59e0b; border-radius:14px; font-family:sans-serif;">
        <h2 style="color:#92400e; margin-bottom:10px;">⚠ Dein Browser ist zu alt</h2>
        <p style="margin-bottom:14px;">Diese App benötigt einen modernen Browser (Stand 2018 oder neuer). Folgende Funktionen fehlen: ${missing.join(", ")}.</p>
        <p style="margin-bottom:14px;"><strong>Was tun?</strong> Aktualisiere deinen Browser oder verwende einen anderen:</p>
        <ul style="padding-left:20px; margin-bottom:14px;">
          <li>Chrome (alle Plattformen)</li>
          <li>Edge (Windows, macOS)</li>
          <li>Firefox (alle Plattformen)</li>
          <li>Safari (iOS, macOS)</li>
        </ul>
        <p style="font-size:12px; color:#92400e;">Erkannter Browser: ${navigator.userAgent || "unbekannt"}</p>
      </div>`;
    return false;
  }
  // Warn (but don't block) on Internet Explorer / very old Safari
  const ua = navigator.userAgent || "";
  if (/MSIE|Trident\//.test(ua)) {
    console.warn("Internet Explorer wird nicht unterstützt - bitte einen modernen Browser nutzen.");
  }
  return true;
}

(async () => {
  if (!checkBrowserCompat()) return;
  await loadAllState();
  render();
  // Termin-Erinnerungen anwerfen, falls vom Nutzer aktiviert
  scheduleNotifChecks();
})();
</script>
